/* ===== GitHub 업로드(프론트에서 토큰 사용) ===== */
async function pickAndUploadToGitHub(prefix = 'misc', originalNameHint = 'image'){
  // 1) 파일 선택
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.click();
  await new Promise(res => input.onchange = res);
  const file = input.files?.[0];
  if (!file) return null;

  // 2) Base64 변환
  const dataUrl = await new Promise(res => { const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(file); });
  const base64 = String(dataUrl).split(',')[1];

  // 3) 경로
  const safeName = file.name || originalNameHint;
  const path = `${prefix}/${Date.now()}_${safeName}`;

  // 4) GitHub API 호출
  const ghUrl = `https://api.github.com/repos/${encodeURIComponent(GITHUB.owner)}/${encodeURIComponent(GITHUB.repo)}/contents/${encodeURIComponent(path)}`;
  const ghRes = await fetch(ghUrl, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${GITHUB.token}`,
      'Accept': 'application/vnd.github+json'
    },
    body: JSON.stringify({
      message: `Upload via page: ${safeName}`,
      content: base64,
      branch: GITHUB.branch
    })
  });
  const data = await ghRes.json();
  if (!ghRes.ok) {
    console.error('GitHub 업로드 실패:', data);
    alert('업로드 실패: ' + (data?.message || JSON.stringify(data)));
    return null;
  }
  // RAW URL
  const rawUrl = `https://raw.githubusercontent.com/${GITHUB.owner}/${GITHUB.repo}/${GITHUB.branch}/${path}`;
  return rawUrl;
}

    const snap = await get(child(ref(db), path));
    return snap.exists()
      ? { photoUrl:'', photoUrl2:'', ...snap.val() }
      : { time:'오후 5:20', place:'버스주차장', desc:'', photoUrl:'', photoUrl2:'' };
  }catch{
    return { time:'오후 5:20', place:'버스주차장', desc:'', photoUrl:'', photoUrl2:'' };
  }
}

    editBtn.addEventListener('click', async ()=>{
      const d = await fetchReturnDetail(dateKey);
      const built = buildReturnCard(dateKey, d);

      let pending = { ...d };
      const prev1 = document.getElementById('ret-preview-1');
      const prev2 = document.getElementById('ret-preview-2');

      document.getElementById('ret-cancel-btn').addEventListener('click', async ()=>{
        const latest = await fetchReturnDetail(dateKey);
        const b = buildReturnCard(dateKey, latest);
        document.getElementById('return-card-slot').outerHTML = b.viewHtml;
        await attachReturnHandlers(dateKey);
      });

      document.getElementById('ret-change-photo-1').addEventListener('click', async ()=>{
        const newUrl = await pickAndUploadToGitHub(`return_photos/${dateKeyToPath(dateKey)}`,'return1.jpg');

        document.getElementById('return-card-slot').outerHTML = b.viewHtml;
        await attachReturnHandlers(dateKey);
      });
    });
  }
}

      <div class="location-details">
        ${img1 ? `<img class="loc-img" id="go-preview-1" src="${img1}" alt="${location} 이미지 1">` : `<img class="loc-img" id="go-preview-1" src="" style="display:none" alt="${location} 이미지 1">`}
        ${img2 ? `<img class="loc-img" id="go-preview-2" src="${img2}" alt="${location} 이미지 2">` : `<img class="loc-img" id="go-preview-2" src="" style="display:none" alt="${location} 이미지 2">`}
        <label class="edit-label">출발 시간</label>
        <input class="edit-field" id="g-time" placeholder="예: 오전 7:40" value="${info.time || ''}">
        <label class="edit-label">장소 설명</label>
        <textarea class="edit-field" id="g-details" rows="3" placeholder="예: ○○ 출구 앞 버스정류장 부근">${info.details || ''}</textarea>
        <label class="edit-label">이미지 캡션(선택)</label>
        <input class="edit-field" id="g-caption" placeholder="예: ○○역 5번 출구 앞 정류장" value="${caption}">
        <div class="edit-actions" style="justify-content:flex-start;flex-wrap:wrap">
          <button class="btn secondary" id="g-change-photo-1">사진1 변경</button>
          <button class="btn secondary" id="g-change-photo-2">사진2 변경</button>
        </div>
        <div class="edit-actions">
          <button class="btn" id="g-cancel-btn">취소</button>
          <button class="btn primary" id="g-save-btn">저장</button>
        </div>
      </div>
    </div>`;
  return { viewHtml, editHtml };
}
async function attachGoHandlers(location){
  const editBtn = document.getElementById('go-edit-btn');
  if(editBtn){
    editBtn.addEventListener('click', async ()=>{
      const info = await fetchGoDetail(location);
      const built = buildGoCard(location, info);
      document.getElementById('go-card-slot').outerHTML = built.editHtml;

      let pending = { ...info }; // {time, details, image, image2, caption}
      const prev1 = document.getElementById('go-preview-1');
      const prev2 = document.getElementById('go-preview-2');

      document.getElementById('g-cancel-btn').addEventListener('click', async ()=>{
        const latest = await fetchGoDetail(location);
        const b2 = buildGoCard(location, latest);
        document.getElementById('go-card-slot').outerHTML = b2.viewHtml;
        await attachGoHandlers(location);
      });

      document.getElementById('g-change-photo-1').addEventListener('click', async ()=>{
        const newUrl = await pickAndUploadToGitHub(`go_photos/${encodeURIComponent(location)}`,'go1.jpg');
        if(newUrl){ pending.image = newUrl; prev1.src = newUrl; prev1.style.display=''; }
      });
      document.getElementById('g-change-photo-2').addEventListener('click', async ()=>{
        const newUrl = await pickAndUploadToGitHub(`go_photos/${encodeURIComponent(location)}`,'go2.jpg');
        if(newUrl){ pending.image2 = newUrl; prev2.src = newUrl; prev2.style.display=''; }
      });

      document.getElementById('g-save-btn').addEventListener('click', async ()=>{
        pending.time    = (document.getElementById('g-time')?.value || '').trim();
        pending.details = (document.getElementById('g-details')?.value || '').trim();
        pending.caption = (document.getElementById('g-caption')?.value || '').trim();
        await set(ref(db, `goDetails/${encodeURIComponent(location)}`), pending);
        alert('출발 정보가 저장되었습니다.');
        const latest = await fetchGoDetail(location);
        const b2 = buildGoCard(location, latest);
        document.getElementById('go-card-slot').outerHTML = b2.viewHtml;
        await attachGoHandlers(location);
      });
    });
  }
}

/* ===== 메인 렌더 ===== */
async function renderInfo(){
  if(!selectedDate || !selectedLocation) return;

  if(selectedLocation === '대회장(복귀)'){
    const list = getReturnPassengers(selectedDate);
    const passengersHtml = `
      <div class="info-section">
        <h3>👥 ${selectedDate} ${selectedLocation} 탑승자 (${list.length}명)</h3>
        <div class="passenger-list">${list.map(n=>`<div class="name-tag">${n}</div>`).join('')}</div>
      </div>`;
    const d = await fetchReturnDetail(selectedDate);
    const built = buildReturnCard(selectedDate, d);
    infoDisplay.innerHTML = `<div class="info-card">${passengersHtml}${built.viewHtml}</div>`;
    await attachReturnHandlers(selectedDate);
  } else {
    const list = getOutboundPassengers(selectedDate, selectedLocation);
    const passengersHtml = `
      <div class="info-section">
        <h3>👥 ${selectedDate} ${selectedLocation} 탑승자 (${list.length}명)</h3>
        <div class="passenger-list">${list.map(n=>`<div class="name-tag">${n}</div>`).join('')}</div>
      </div>`;

    const coord = coordinatorBlockOf(selectedLocation);
    const info = await fetchGoDetail(selectedLocation); // DB 우선, 없으면 기본
    const built = buildGoCard(selectedLocation, info);

    infoDisplay.innerHTML = `<div class="info-card">${coord}${passengersHtml}${built.viewHtml}</div>`;
    await attachGoHandlers(selectedLocation);
  }
}

document.addEventListener('DOMContentLoaded', ()=>{ renderSelectors(); });
