<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역대회 버스 탑승 안내</title>
    <style>
        :root {
            --primary-color: #6c7b8a;
            --secondary-color: #8a94a6;
            --background-color: #f8f9fa;
            --text-color: #333;
            --white-color: #fff;
            --accent-color: #007bff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 모바일에서 탭 하이라이트 제거 */
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            color: var(--text-color);
            /* 폰트 렌더링 최적화 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: var(--white-color);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 25px 20px;
            text-align: center;
            color: var(--white-color);
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .header p {
            opacity: 0.9;
            font-size: 15px;
        }
        .content {
            padding: 25px;
        }
        .selector-group {
            margin-bottom: 30px;
        }
        .selector-group h2 {
            /* 변경: 글씨 크기 키움 */
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-weight: 700;
        }
        .selector-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }
        .selector-btn {
            /* 변경: 버튼 크기와 글씨 크기 키움 */
            padding: 18px 12px;
            font-size: 17px;
            font-weight: 700;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background-color);
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .selector-btn:hover {
            border-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 148, 166, 0.2);
        }
        .selector-btn.active {
            background: var(--secondary-color);
            border-color: var(--primary-color);
            color: var(--white-color);
            transform: translateY(0);
        }
        #info-display {
            margin-top: 20px;
        }
        .info-card {
            background: var(--background-color);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e1e5e9;
        }
        .info-placeholder {
            text-align: center;
            color: #777;
            padding: 40px 10px;
            font-size: 16px;
            line-height: 1.6;
        }
        .info-section {
            margin-bottom: 25px;
        }
        .info-section:last-child {
            margin-bottom: 0;
        }
        .info-section h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--text-color);
        }
        .coordinator-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white-color);
            padding: 15px;
            border-radius: 10px;
        }
        .coordinator-name {
            font-weight: 700;
            font-size: 18px;
        }
        .call-btn {
            display: inline-block;
            text-decoration: none;
            background-color: var(--accent-color);
            color: var(--white-color);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .call-btn:hover {
            background-color: #0056b3;
        }
        .passenger-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .name-tag {
            background: var(--white-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            /* 변경: 탑승자 이름 글씨 크기 키움 */
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #ddd;
        }
        .location-details {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            color: #8a6d3b;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚌 지역대회 버스 탑승 안내</h1>
            <p>탑승하실 날짜와 장소를 선택해주세요.</p>
        </div>
        <div class="content">
            <div class="selector-group">
                <h2>1. 탑승 날짜 선택</h2>
                <div id="date-selector" class="selector-buttons"></div>
            </div>
            <div class="selector-group">
                <h2>2. 탑승 장소 선택</h2>
                <div id="location-selector" class="selector-buttons"></div>
            </div>
            <div id="info-display">
                <div class="info-placeholder">
                    <p>먼저 탑승하실 **날짜**와 **장소**를<br>순서대로 선택해주세요.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 데이터 (변경 없음) ---
        const gangilRoster = [{name:'권오훈 형제',phone:'010-9490-0846'},{name:'김춘옥 자매',phone:'010-6218-0846'},{name:'이우혁 형제',phone:'010-6556-7678'},{name:'정영휘 자매',phone:'010-7600-2314'},{name:'조병일 형제',phone:'010-7701-0437'},{name:'지부연 자매',phone:'010-5663-4466'},{name:'최승연 자매',phone:'010-3783-6648'},{name:'강진원 형제',phone:'010-4931-6151'},{name:'최화순 자매',phone:'010-2237-2164'}];
        const misaRoster = [{name:'계은경 자매',phone:'010-5362-6573'},{name:'곽영희 자매',phone:'010-6301-8990'},{name:'노남숙 자매',phone:'010-7602-6266'},{name:'노연화 자매',phone:'010-4172-1914'},{name:'박동준 형제',phone:'010-2235-3747'},{name:'신동순 자매',phone:'010-7132-4226'},{name: '이명희 자매',phone:'010-5612-7753'},{name:'이상옥 자매',phone:'010-2371-3747'},{name:'이철호 형제',phone:'010-3930-6573'},{name:'정윤두 형제',phone:'010-2381-2635'},{name:'최성은 자매',phone:'010-3378-8097'},{name:'현진선 자매',phone:'010-7532-0724'}];
        const returnOnlyRoster = [{name:'강소영 자매',phone:'010-4473-7795'},{name:'서존 형제',phone:'010-9510-7795'}];
        const fullRoster = [...gangilRoster, ...misaRoster, ...returnOnlyRoster];
        const schedule = {
            '8/15':['권오훈 형제','김춘옥 자매','이우혁 형제','정영휘 자매','조병일 형제','지부연 자매','최승연 자매','강진원 형제','계은경 자매','곽영희 자매','노남숙 자매','노연화 자매','박동준 형제','이명희 자매','이상옥 자매','이철호 형제','정윤두 형제','최성은 자매','최화순 자매','현진선 자매'],
            '8/16':['권오훈 형제','김춘옥 자매','이우혁 형제','정영휘 자매','조병일 형제','지부연 자매','최승연 자매','강진원 형제','곽영희 자매','노남숙 자매','신동순 자매','이명희 자매','정윤두 형제','최성은 자매','최화순 자매','현진선 자매','서존 형제'],
            '8/17':['권오훈 형제','김춘옥 자매','정영휘 자매','조병일 형제','지부연 자매','최승연 자매','강진원 형제','계은경 자매','곽영희 자매','노남숙 자매','신동순 자매','이명희 자매','이철호 형제','정윤두 형제','최성은 자매','최화순 자매','현진선 자매','강소영 자매']
        };
        const leaders = {'강일주민센터':'조병일 형제','미사역':'정윤두 형제'};
        const dates = [{'8/15': '8/15 (금)'}, {'8/16': '8/16 (토)'}, {'8/17': '8/17 (일)'}];
        const locations = ['강일주민센터', '미사역'];

        // --- 앱 로직 (변경 없음) ---
        let selectedDate = null;
        let selectedLocation = null;

        const dateSelector = document.getElementById('date-selector');
        const locationSelector = document.getElementById('location-selector');
        const infoDisplay = document.getElementById('info-display');

        function findCoordinator(name) {
            return fullRoster.find(person => person.name === name);
        }

        function renderSelectors() {
            dates.forEach(dateObj => {
                const key = Object.keys(dateObj)[0];
                const value = dateObj[key];
                const btn = document.createElement('button');
                btn.className = 'selector-btn';
                btn.textContent = value;
                btn.onclick = () => selectDate(key);
                dateSelector.appendChild(btn);
            });
            locations.forEach(location => {
                const btn = document.createElement('button');
                btn.className = 'selector-btn';
                btn.textContent = location;
                btn.onclick = () => selectLocation(location);
                locationSelector.appendChild(btn);
            });
        }

        function selectDate(dateKey) {
            selectedDate = dateKey;
            Array.from(dateSelector.children).forEach(btn => btn.classList.remove('active'));
            const clickedBtn = Array.from(dateSelector.children).find(btn => btn.textContent.includes(dateKey));
            if(clickedBtn) clickedBtn.classList.add('active');
            renderInfo();
        }

        function selectLocation(location) {
            selectedLocation = location;
            Array.from(locationSelector.children).forEach(btn => btn.classList.remove('active'));
            const clickedBtn = Array.from(locationSelector.children).find(btn => btn.textContent === location);
            if(clickedBtn) clickedBtn.classList.add('active');
            renderInfo();
        }

        function renderInfo() {
            if (!selectedDate || !selectedLocation) {
                return;
            }
            const coordinatorName = leaders[selectedLocation];
            const coordinator = findCoordinator(coordinatorName);
            const passengerList = schedule[selectedDate].sort((a, b) => a.localeCompare(b, 'ko-KR'));
            const coordinatorHtml = `
                <div class="info-section">
                    <h3>📞 담당 인도자</h3>
                    <div class="coordinator-section">
                        <span class="coordinator-name">${coordinator.name}</span>
                        <a href="tel:${coordinator.phone}" class="call-btn">전화 연결</a>
                    </div>
                </div>
            `;
            const passengersHtml = `
                <div class="info-section">
                    <h3>👥 ${selectedDate}일 전체 탑승자 (${passengerList.length}명)</h3>
                    <div class="passenger-list">
                        ${passengerList.map(name => `<div class="name-tag">${name}</div>`).join('')}
                    </div>
                </div>
            `;
            const locationDetailsHtml = `
                <div class="info-section">
                     <h3>📍 탑승 장소 상세 안내</h3>
                     <div class="location-details">
                        자세한 탑승 장소 안내가 곧 추가될 예정입니다.
                     </div>
                </div>
            `;
            infoDisplay.innerHTML = `
                <div class="info-card">
                    ${coordinatorHtml}
                    ${passengersHtml}
                    ${locationDetailsHtml}
                </div>
            `;
        }
        document.addEventListener('DOMContentLoaded', renderSelectors);
    </script>
</body>
</html>
