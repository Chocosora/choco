<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 공수 노트</title>
    <style>
        :root {
            --primary-color: #1976d2;
            --weekend-sat: #3b5bdb;
            --weekend-sun: #e03131;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Applegothic", "Malgun Gothic", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .month-nav { display: flex; align-items: center; gap: 15px; }
        .month-title { font-size: 1.2rem; font-weight: 800; margin: 0; }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-nav { background: #eee; font-weight: bold; }
        .btn-setting { background-color: #546e7a; color: white; }
        .btn-danger { background-color: #e53935; color: white; }

        .summary {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .summary-item { text-align: center; background: rgba(255,255,255,0.5); padding: 8px; border-radius: 6px; }
        .summary-label { font-size: 12px; color: #555; margin-bottom: 4px; }
        .summary-value { font-size: 16px; font-weight: 800; color: var(--primary-color); }
        .total-row { grid-column: span 2; background: #fff3e0; }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
            background: #f1f3f5;
            border-radius: 6px 6px 0 0;
            font-size: 14px;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #dee2e6;
            border: 1px solid #dee2e6;
        }

        .day {
            background: white;
            min-height: 85px;
            padding: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
        }

        .day.today {
            background-color: #fff9db;
            border: 2px solid #fab005;
            z-index: 1;
        }

        .day-number {
            font-size: 12px;
            margin-bottom: 4px;
            color: #888;
        }

        /* --- 수정된 부분: 텍스트 스타일 --- */
        
        /* 1. 현장명 (가장 크게) */
        .site-name {
            font-size: 13px; /* 크기 키움 */
            font-weight: 700; /* 굵게 */
            color: #212529;
            margin-bottom: 4px;
            line-height: 1.2;
            word-break: break-all; /* 긴 단어 줄바꿈 */
        }

        /* 2. 공수 배지 (작게 줄임) */
        .gongsu-badge {
            display: inline-block;
            background-color: #e7f5ff; /* 배경색 연하게 */
            color: #1976d2;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 11px; /* 크기 줄임 */
            font-weight: 600;
            margin-bottom: 4px;
            align-self: flex-start; /* 왼쪽 정렬 */
            border: 1px solid #d0ebff;
        }

        /* 3. 경비 표시 (내역 + 금액) */
        .expense-info {
            font-size: 10px;
            color: #c92a2a; /* 붉은색 계열 */
            margin-top: auto; /* 하단 배치 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 요일 색상 */
        .calendar-header div:nth-child(1), .day:nth-child(7n+1) .day-number { color: var(--weekend-sun); }
        .calendar-header div:nth-child(7), .day:nth-child(7n) .day-number { color: var(--weekend-sat); }

        .list-section { margin-top: 25px; border-top: 2px solid #eee; padding-top: 15px; }
        .list-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .list-table th { background: #f8f9fa; padding: 10px 5px; border-bottom: 2px solid #dee2e6; }
        .list-table td { padding: 10px 5px; border-bottom: 1px solid #eee; text-align: center; }
        .text-left { text-align: left !important; }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%; padding: 12px; box-sizing: border-box;
            border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        .expense-group { display: flex; gap: 5px; }
        .expense-group input:first-child { flex: 2; }
        .expense-group input:last-child { flex: 1; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .btn-group button { flex: 1; padding: 12px; font-size: 16px; }
        .btn-save { background-color: var(--primary-color); color: white; }
        .btn-close { background-color: #e9ecef; color: #333; }
        .btn-delete { background-color: #ffc9c9; color: #c92a2a; flex: 0.5 !important; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="month-nav">
            <button class="btn-nav" id="prevMonth">&lt;</button>
            <h2 class="month-title" id="currentMonthStr"></h2>
            <button class="btn-nav" id="nextMonth">&gt;</button>
        </div>
        <div style="display:flex; gap:5px;">
            <button class="btn-setting" id="btnSetPrice">단가설정</button>
            <button class="btn-danger" id="btnDeleteMonth">월삭제</button>
        </div>
    </header>

    <div class="summary">
        <div class="summary-item">
            <div class="summary-label">총 공수</div>
            <div class="summary-value" id="totalGongsu">0.0</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">예상 급여</div>
            <div class="summary-value" id="totalWage">0</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">총 경비</div>
            <div class="summary-value" id="totalExpense">0</div>
        </div>
        <div class="summary-item total-row">
            <div class="summary-label">최종 합계</div>
            <div class="summary-value" id="grandTotal" style="color:#c92a2a;">0</div>
        </div>
    </div>

    <div class="calendar-header">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="calendar-grid" id="calendarGrid">
        </div>

    <div class="list-section">
        <h3 style="font-size:16px; margin-bottom:10px;">📋 상세 내역</h3>
        <table class="list-table">
            <thead>
                <tr>
                    <th width="12%">일</th>
                    <th width="35%">현장</th>
                    <th width="15%">공수</th>
                    <th width="38%">경비(내역/금액)</th>
                </tr>
            </thead>
            <tbody id="listBody"></tbody>
        </table>
    </div>
</div>

<div class="modal" id="inputModal">
    <div class="modal-content">
        <h3 id="modalDateStr" style="margin-top:0;">날짜 입력</h3>
        
        <div class="form-group">
            <label>🛠️ 공수 입력</label>
            <input type="number" id="inputGongsu" step="0.1" inputmode="decimal" placeholder="예: 1.0">
        </div>
        
        <div class="form-group">
            <label>🏗️ 현장명</label>
            <input type="text" id="inputSite" placeholder="현장 이름">
        </div>
        
        <div class="form-group">
            <label>💸 경비 (내역 / 금액)</label>
            <div class="expense-group">
                <input type="text" id="inputExpenseDesc" placeholder="내역 (예: 식대)">
                <input type="number" id="inputExpenseAmount" inputmode="numeric" placeholder="금액">
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn-delete" id="btnDelete">삭제</button>
            <button class="btn-close" id="btnClose">닫기</button>
            <button class="btn-save" id="btnSave">저장</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4FWP-jskItmNA4SVP-kDGA1gL_U85asw",
      authDomain: "chocosora-ad4df.firebaseapp.com",
      databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com",
      projectId: "chocosora-ad4df",
      storageBucket: "chocosora-ad4df.firebasestorage.app",
      messagingSenderId: "798065461606",
      appId: "1:798065461606:web:fcc2308eae7a71e8f360a7",
      measurementId: "G-4FYC7HVNNV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentDate = new Date();
    let selectedDateKey = null;
    let gongsuData = {}; 
    let currentUnitPrice = 230000;

    const calendarGrid = document.getElementById('calendarGrid');
    const listBody = document.getElementById('listBody');
    const modal = document.getElementById('inputModal');

    function startSync() {
        const dataRef = ref(db, 'gongsuData');
        const priceRef = ref(db, 'setting/unitPrice');

        onValue(dataRef, (snapshot) => {
            gongsuData = snapshot.val() || {};
            renderAll();
        });

        onValue(priceRef, (snapshot) => {
            const val = snapshot.val();
            if(val) currentUnitPrice = parseInt(val);
            renderAll();
        });
    }

    function renderAll() {
        renderCalendar();
        renderList();
        updateSummary();
    }

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const today = new Date();

        document.getElementById('currentMonthStr').innerText = `${year}.${month + 1}`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            calendarGrid.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= lastDate; day++) {
            const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayEl = document.createElement('div');
            dayEl.className = 'day';

            if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
                dayEl.classList.add('today');
            }

            const dayNum = document.createElement('span');
            dayNum.className = 'day-number';
            dayNum.innerText = day;
            dayEl.appendChild(dayNum);

            if (gongsuData[dateKey]) {
                const info = gongsuData[dateKey];
                
                // 1. 현장명 (가장 크게, 맨 위)
                if (info.site) {
                    const siteDiv = document.createElement('div');
                    siteDiv.className = 'site-name';
                    siteDiv.innerText = info.site;
                    dayEl.appendChild(siteDiv);
                }

                // 2. 공수 배지 (작게, 중간)
                if (info.gongsu > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'gongsu-badge';
                    badge.innerText = `${info.gongsu}공수`;
                    dayEl.appendChild(badge);
                }

                // 3. 경비 내역 및 금액 (맨 아래)
                const expAmount = info.expenseAmount || info.expense || 0;
                if (expAmount > 0) {
                    const desc = info.expenseDesc ? info.expenseDesc : '경비';
                    const expenseDiv = document.createElement('div');
                    expenseDiv.className = 'expense-info';
                    // "식대 10,000" 형식으로 표시
                    expenseDiv.innerText = `${desc} ${parseInt(expAmount).toLocaleString()}`;
                    dayEl.appendChild(expenseDiv);
                }
            }

            dayEl.onclick = () => openModal(dateKey);
            calendarGrid.appendChild(dayEl);
        }
    }

    function renderList() {
        listBody.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth() + 1;

        const currentMonthKeys = Object.keys(gongsuData).filter(key => {
            const [dYear, dMonth] = key.split('-').map(Number);
            return dYear === year && dMonth === month;
        }).sort();

        if (currentMonthKeys.length === 0) {
            listBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#999;">기록이 없습니다</td></tr>';
            return;
        }

        currentMonthKeys.forEach(key => {
            const info = gongsuData[key];
            const dateStr = key.split('-')[2];
            const expAmount = info.expenseAmount || info.expense || 0;
            const expDesc = info.expenseDesc || (info.expense ? '기타' : '');
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${dateStr}</td>
                <td class="text-left" style="font-weight:bold;">${info.site || '-'}</td>
                <td>${info.gongsu > 0 ? info.gongsu : ''}</td>
                <td class="text-left" style="font-size:12px;">
                    ${expAmount > 0 ? `<span style="color:#e03131">[${expDesc}]</span> ${parseInt(expAmount).toLocaleString()}` : '-'}
                </td>
            `;
            listBody.appendChild(tr);
        });
    }

    function updateSummary() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth() + 1;

        let totalGongsu = 0;
        let totalExpense = 0;

        Object.keys(gongsuData).forEach(key => {
            const [dYear, dMonth] = key.split('-').map(Number);
            if (dYear === year && dMonth === month) {
                totalGongsu += parseFloat(gongsuData[key].gongsu || 0);
                totalExpense += parseInt(gongsuData[key].expenseAmount || gongsuData[key].expense || 0);
            }
        });

        const wage = totalGongsu * currentUnitPrice;
        const grandTotal = wage + totalExpense;

        document.getElementById('totalGongsu').innerText = totalGongsu.toFixed(1);
        document.getElementById('totalWage').innerText = Math.floor(wage).toLocaleString();
        document.getElementById('totalExpense').innerText = totalExpense.toLocaleString();
        document.getElementById('grandTotal').innerText = grandTotal.toLocaleString() + "원";
    }

    window.openModal = function(dateKey) {
        selectedDateKey = dateKey;
        const dateParts = dateKey.split('-');
        document.getElementById('modalDateStr').innerText = `${dateParts[1]}월 ${dateParts[2]}일 기록`;
        
        const info = gongsuData[dateKey] || {};
        
        document.getElementById('inputGongsu').value = info.gongsu || '';
        document.getElementById('inputSite').value = info.site || '';
        document.getElementById('inputExpenseDesc').value = info.expenseDesc || '';
        document.getElementById('inputExpenseAmount').value = info.expenseAmount || info.expense || '';

        modal.style.display = 'flex';
    }

    window.saveData = function() {
        if (!selectedDateKey) return;
        
        const gongsu = parseFloat(document.getElementById('inputGongsu').value) || 0;
        const site = document.getElementById('inputSite').value;
        const expenseDesc = document.getElementById('inputExpenseDesc').value;
        const expenseAmount = parseInt(document.getElementById('inputExpenseAmount').value) || 0;

        const dateRef = ref(db, 'gongsuData/' + selectedDateKey);

        if (gongsu === 0 && site === '' && expenseAmount === 0) {
            remove(dateRef);
        } else {
            set(dateRef, { gongsu, site, expenseDesc, expenseAmount });
        }
        closeModal();
    }

    window.deleteData = function() {
        if (!selectedDateKey) return;
        if(confirm('삭제하시겠습니까?')) {
            remove(ref(db, 'gongsuData/' + selectedDateKey));
            closeModal();
        }
    }

    window.deleteAllMonth = function() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth() + 1;
        if (!confirm(`${year}년 ${month}월 기록을 모두 삭제하시겠습니까?`)) return;

        const updates = {};
        let count = 0;
        Object.keys(gongsuData).forEach(key => {
            const [dYear, dMonth] = key.split('-').map(Number);
            if (dYear === year && dMonth === month) {
                updates[key] = null;
                count++;
            }
        });

        if (count > 0) {
            update(ref(db, 'gongsuData'), updates);
        }
    }

    window.setUnitPrice = function() {
        const newPrice = prompt("1 공수 단가를 입력하세요", currentUnitPrice);
        if (newPrice) set(ref(db, 'setting/unitPrice'), parseInt(newPrice));
    }

    window.closeModal = function() {
        modal.style.display = 'none';
        selectedDateKey = null;
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderAll();
    }

    document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
    document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
    document.getElementById('btnClose').addEventListener('click', closeModal);
    document.getElementById('btnSave').addEventListener('click', saveData);
    document.getElementById('btnDelete').addEventListener('click', deleteData);
    document.getElementById('btnSetPrice').addEventListener('click', setUnitPrice);
    document.getElementById('btnDeleteMonth').addEventListener('click', deleteAllMonth);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    startSync();

</script>

</body>
</html>
