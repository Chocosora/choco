<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강일 회중 서울 캠페인 스케줄러</title>

    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ko.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0; padding: 0;
            background: #f5f4f0;
            color: #1a1a1a;
            -webkit-text-size-adjust: 100%;
        }

        /* 헤더 */
        header {
            background: #1a1a1a;
            color: #fff;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 52px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h2 { margin: 0; font-size: 14px; font-weight: 700; }
        h2 .accent { color: #a8ff78; }

        .header-btns { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .header-btns::-webkit-scrollbar { display: none; }
        .header-btns button {
            padding: 6px 11px; border: 1px solid rgba(255,255,255,.18);
            border-radius: 20px; background: transparent; color: rgba(255,255,255,.75);
            font-size: 12px; cursor: pointer; white-space: nowrap;
        }
        .header-btns button.active { background: #fff; color: #1a1a1a; font-weight: 700; }

        /* 컨테이너 */
        .container { max-width: 1400px; margin: 0 auto; padding: 12px; }
        #login-view, #admin-view, #sms-view, #daily-view { display: none; }

        /* 달력 공통 */
        #calendar-view { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.06); overflow: hidden; }
        .cal-legend-bar { display: flex; gap: 14px; padding: 10px 16px; font-size: 11px; color: #888; }
        .legend-s { background: #f43f5e; width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .legend-b { background: #3b82f6; width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

        /* FullCalendar 스타일 수정 */
        .fc-event { border: none !important; cursor: pointer; padding: 2px 4px !important; font-size: 11px !important; }
        .gender-sister { background-color: #fff0f2 !important; color: #c0132b !important; }
        .gender-brother { background-color: #eff6ff !important; color: #1d4ed8 !important; }
        .day-count-badge { font-size: 10px; background: #1a1a1a; color: #fff; border-radius: 10px; padding: 1px 5px; margin-left: 5px; }

        /* 패널 공통 */
        .panel-wrap { background: #fff; border-radius: 14px; padding: 20px 16px; box-shadow: 0 2px 16px rgba(0,0,0,.06); }
        .panel-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .panel-sub { font-size: 12px; color: #aaa; margin-bottom: 16px; }

        /* 테이블 및 기타 스타일 */
        .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #f0efeb; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        th, td { padding: 10px; border-bottom: 1px solid #f0efeb; text-align: center; }
        th { background: #faf9f6; font-size: 11px; color: #888; }

        /* 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .modal-content { background: #fff; border-radius: 20px; width: 90%; max-width: 340px; padding: 20px; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; border: none; background: #eee; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }

        /* 로그인 */
        .login-box { text-align: center; padding: 40px 20px; background: #fff; border-radius: 14px; }
        .login-box input { padding: 12px; font-size: 18px; width: 150px; text-align: center; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .login-box button { padding: 12px 30px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; cursor: pointer; }

        /* 날짜 그리드 */
        .date-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #faf9f6; padding: 10px; border-radius: 10px; }
        .date-btn { padding: 8px 0; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .date-btn.selected { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
        .date-btn.selected-daily { background: #e65100 !important; color: #fff !important; }

        textarea { width: 100%; border-radius: 10px; border: 1px solid #ddd; padding: 10px; font-family: inherit; resize: none; }
    </style>
</head>
<body>

    <header>
        <h2>✦ <span class="accent">스마트</span> 스케줄러</h2>
        <div class="header-btns">
            <button id="hbtn-calendar" class="active" onclick="requestView('calendar-view')">달력</button>
            <button id="hbtn-daily" onclick="requestView('daily-view')">명단복사</button>
            <button id="hbtn-admin" onclick="requestView('admin-view')">인원관리</button>
            <button id="hbtn-sms" onclick="requestView('sms-view')">문자발송</button>
        </div>
    </header>

    <div class="container">
        <div id="calendar-view">
            <div class="cal-legend-bar">
                <span><i class="legend-s"></i> 자매</span>
                <span><i class="legend-b"></i> 형제</span>
            </div>
            <div id="calendar"></div>
        </div>

        <div id="login-view" class="login-box">
            <h3>보안 구역</h3>
            <p>관리자 PIN 번호를 입력하세요.</p>
            <input type="password" id="pinInput" maxlength="4" inputmode="numeric">
            <br>
            <button onclick="checkPin()">인증하기</button>
            <p id="loginError" style="color: #f43f5e; display: none; font-size: 13px; margin-top: 10px;">PIN 번호가 일치하지 않습니다.</p>
        </div>

        <div id="admin-view" class="panel-wrap">
            <p class="panel-title">인원 관리</p>
            <button style="margin-bottom:10px; padding: 8px 12px;" onclick="addNewMember()">+ 인원 추가</button>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>회중</th><th>이름</th><th>성별</th><th>전화번호</th><th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="memberTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="daily-view" class="panel-wrap">
            <p class="panel-title">일자별 명단 복사</p>
            <div id="dailyDateGrid" class="date-grid" style="margin-bottom: 15px;"></div>
            <textarea id="dailySummaryText" rows="10" readonly placeholder="날짜를 선택하세요."></textarea>
            <button style="margin-top: 10px; width: 100%; padding: 12px;" onclick="copyDailySummary()">텍스트 복사</button>
            <p id="copyNoti" style="display:none; color: green; text-align:center; font-weight:bold;">복사되었습니다!</p>
        </div>

        <div id="sms-view" class="panel-wrap">
            <p class="panel-title">문자 발송 대상</p>
            <div id="smsGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        </div>
    </div>

    <div class="modal-overlay" id="eventModalOverlay" onclick="closeModal('eventModalOverlay', event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModalBtn('eventModalOverlay')">✕</button>
            <h3 id="modalName" style="margin-top:0;">이름</h3>
            <p id="modalDesc" style="color:#666;"></p>
            <div style="display: flex; gap: 10px;">
                <a id="modalCall" href="#" style="flex:1; text-align:center; padding:10px; background:#eff6ff; border-radius:10px; text-decoration:none; color:#1d4ed8; font-weight:bold;">전화</a>
                <a id="modalSms" href="#" style="flex:1; text-align:center; padding:10px; background:#f0fdf4; border-radius:10px; text-decoration:none; color:#16a34a; font-weight:bold;">문자</a>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "4560";
        let members = [];
        let calendarInstance = null;

        // 초기 샘플 데이터 (사용자 제공 데이터 기반)
        const initialMembers = [
            { name: "권영인", gender: "자매", cong: "강일", phone: "010-0000-0000", dates: ["2026-05-01", "2026-05-02", "2026-05-03", "2026-05-07"] },
            { name: "김지윤", gender: "자매", cong: "강일", phone: "010-0000-0000", dates: ["2026-05-01", "2026-05-02", "2026-05-03", "2026-05-07"] },
            { name: "황한빈", gender: "형제", cong: "강일", phone: "010-0000-0000", dates: ["2026-05-02", "2026-05-05", "2026-05-17", "2026-05-21", "2026-05-25"] }
        ];

        // 데이터 로드
        function loadData() {
            const saved = localStorage.getItem('scheduler_members');
            members = saved ? JSON.parse(saved) : initialMembers;
            renderCalendar();
        }

        function saveData() {
            localStorage.setItem('scheduler_members', JSON.stringify(members));
            renderCalendar();
        }

        // 달력 초기화
        function renderCalendar() {
            const calendarEl = document.getElementById('calendar');
            if (calendarInstance) calendarInstance.destroy();

            calendarInstance = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: '2026-05-01',
                locale: 'ko',
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                events: generateEvents(),
                dayCellDidMount: function(info) {
                    const dateStr = info.date.toISOString().split('T')[0];
                    const count = members.filter(m => m.dates.includes(dateStr)).length;
                    if (count > 0) {
                        const badge = document.createElement('span');
                        badge.className = 'day-count-badge';
                        badge.innerText = count + '명';
                        info.el.querySelector('.fc-daygrid-day-top').appendChild(badge);
                    }
                },
                eventClick: function(info) {
                    const data = info.event.extendedProps;
                    document.getElementById('modalName').innerText = `${info.event.title}`;
                    document.getElementById('modalDesc').innerText = `${data.cong} 회중 · ${data.phone}`;
                    document.getElementById('modalCall').href = `tel:${data.phone}`;
                    document.getElementById('modalSms').href = `sms:${data.phone}`;
                    document.getElementById('eventModalOverlay').style.display = 'flex';
                }
            });
            calendarInstance.render();
        }

        function generateEvents() {
            let events = [];
            members.forEach(m => {
                m.dates.forEach(d => {
                    events.push({
                        title: `${m.name} ${m.gender}`,
                        start: d,
                        className: m.gender === '자매' ? 'gender-sister' : 'gender-brother',
                        extendedProps: { phone: m.phone, cong: m.cong }
                    });
                });
            });
            return events;
        }

        // 뷰 전환
        let pendingView = '';
        function requestView(viewId) {
            if (viewId === 'calendar-view') {
                showView(viewId);
            } else {
                pendingView = viewId;
                showView('login-view');
            }
        }

        function showView(viewId) {
            document.querySelectorAll('.container > div').forEach(div => div.style.display = 'none');
            document.getElementById(viewId).style.display = 'block';
            document.querySelectorAll('.header-btns button').forEach(btn => btn.classList.remove('active'));
            const btnId = 'hbtn-' + viewId.replace('-view', '');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
            
            if (viewId === 'calendar-view' && calendarInstance) calendarInstance.render();
            if (viewId === 'daily-view') initDailyDateGrid();
            if (viewId === 'admin-view') renderAdminTable();
        }

        function checkPin() {
            if (document.getElementById('pinInput').value === ADMIN_PIN) {
                showView(pendingView);
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // 명단 복사 로직
        function initDailyDateGrid() {
            const grid = document.getElementById('dailyDateGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const btn = document.createElement('button');
                btn.className = 'date-btn';
                btn.innerText = i;
                btn.onclick = () => {
                    document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('selected-daily'));
                    btn.classList.add('selected-daily');
                    generateDailySummary(`2026-05-${String(i).padStart(2, '0')}`);
                };
                grid.appendChild(btn);
            }
        }

        function generateDailySummary(date) {
            const list = members.filter(m => m.dates.includes(date));
            let text = `[ ${date} 참여 명단 ]\n인원: ${list.length}명\n\n`;
            list.forEach((m, idx) => {
                text += `${idx+1}. ${m.name} (${m.gender}) / ${m.cong}\n`;
            });
            document.getElementById('dailySummaryText').value = text;
        }

        function copyDailySummary() {
            const el = document.getElementById('dailySummaryText');
            navigator.clipboard.writeText(el.value);
            const noti = document.getElementById('copyNoti');
            noti.style.display = 'block';
            setTimeout(() => noti.style.display = 'none', 2000);
        }

        // 인원 관리 테이블
        function renderAdminTable() {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '';
            members.forEach((m, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${m.cong}</td><td>${m.name}</td><td>${m.gender}</td><td>${m.phone}</td>
                <td><button onclick="deleteMember(${idx})">삭제</button></td>`;
                tbody.appendChild(tr);
            });
        }

        function deleteMember(idx) {
            if(confirm('삭제하시겠습니까?')) {
                members.splice(idx, 1);
                saveData();
                renderAdminTable();
            }
        }

        function addNewMember() {
            const name = prompt("이름을 입력하세요");
            if(name) {
                members.push({ name, gender: "자매", cong: "강일", phone: "010-0000-0000", dates: [] });
                saveData();
                renderAdminTable();
            }
        }

        function closeModalBtn(id) { document.getElementById(id).style.display = 'none'; }
        function closeModal(id, e) { if(e.target.id === id) closeModalBtn(id); }

        window.onload = loadData;
    </script>
</body>
</html>
