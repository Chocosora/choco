<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강일 회중 서울 캠페인 스케줄러</title>

    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ko.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0; padding: 0;
            background: #f5f4f0;
            color: #1a1a1a;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden; /* 가로 스크롤 원천 차단 */
        }

        /* ── 헤더 ── */
        header {
            background: #1a1a1a;
            color: #fff;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }
        h2 .accent { color: #a8ff78; }

        .header-btns { display: flex; gap: 4px; }
        .header-btns button {
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 15px;
            cursor: pointer;
            font-weight: 500;
            font-size: 11px;
            background: transparent;
            color: rgba(255,255,255,.75);
            white-space: nowrap;
            font-family: inherit;
        }
        .header-btns button.active {
            background: #fff;
            color: #1a1a1a;
            font-weight: 700;
        }

        /* ── 컨테이너 ── */
        .container {
            max-width: 1400px;
            margin: 10px auto;
            padding: 0 10px 40px; /* 모바일 여백 축소 */
            width: 100%;
        }

        #login-view, #admin-view, #sms-view, #daily-view { display: none; }

        /* ── 달력 ── */
        #calendar-view {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 15px rgba(0,0,0,.05);
        }

        .cal-legend-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 15px 5px;
            font-size: 11px;
            color: #888;
        }
        .cal-legend-bar i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .legend-s { background: #f43f5e; }
        .legend-b { background: #3b82f6; }

        /* ── FullCalendar 모바일 최적화 스타일 ── */
        .fc { font-family: inherit; width: 100% !important; }
        
        /* 테이블 레이아웃 고정으로 짤림 방지 */
        .fc-scrollgrid, .fc-col-header, .fc-daygrid-body, .fc-daygrid-body table {
            width: 100% !important;
            table-layout: fixed !important;
        }

        .fc .fc-toolbar {
            padding: 10px 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
        }
        .fc .fc-toolbar-title {
            font-size: 14px !important;
            font-weight: 700;
        }
        .fc .fc-button {
            padding: 4px 8px !important;
            font-size: 11px !important;
            border-radius: 6px !important;
        }

        .fc .fc-col-header-cell-cushion {
            font-size: 10px !important;
            padding: 5px 0 !important;
        }

        /* 날짜 칸 높이 조절 */
        .fc .fc-daygrid-day-frame { 
            padding: 2px !important; 
            min-height: 65px !important; 
        }
        .fc .fc-daygrid-day-top { 
            flex-direction: column !important; /* 숫자와 배지를 세로로 배치하여 가로공간 확보 */
            align-items: center; 
            gap: 2px; 
        }
        .fc .fc-daygrid-day-number {
            font-size: 11px !important;
            padding: 2px !important;
        }

        /* 총 인원 배지 간소화 */
        .day-count-badge {
            font-size: 8px;
            font-weight: 800;
            background: #f0efeb;
            color: #1a1a1a;
            border-radius: 4px;
            padding: 0px 3px;
            line-height: 1.2;
            transform: scale(0.9);
        }

        /* 이벤트 칩 모바일 최적화 */
        .fc-event {
            padding: 1px 2px !important;
            font-size: 9px !important;
            margin-bottom: 1px !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* 이름 길면 생략 */
            border-radius: 3px !important;
        }
        .fc-event-title {
            text-overflow: ellipsis;
        }

        /* 일요일/토요일 색상 강화 */
        .fc-day-sun .fc-col-header-cell-cushion,
        .fc-day-sun .fc-daygrid-day-number { color: #f43f5e !important; }
        .fc-day-sat .fc-col-header-cell-cushion,
        .fc-day-sat .fc-daygrid-day-number { color: #3b82f6 !important; }

        /* ── 모바일 환경 미세 조정 ── */
        @media (max-width: 768px) {
            .container { margin-top: 5px; }
            .fc .fc-view-harness { height: 450px !important; } /* 높이 고정으로 가독성 확보 */
        }

        /* 기존 나머지 스타일 유지 (팝업, 관리자 페이지 등) */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,10,.45); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); padding: 20px; }
        .modal-content { background: #fff; border-radius: 20px; width: 100%; max-width: 340px; box-shadow: 0 24px 60px rgba(0,0,0,.18); position: relative; overflow: hidden; }
        .modal-close { position: absolute; top: 14px; right: 14px; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; background: #f0efeb; border: none; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #666; }
        .event-modal-header { padding: 28px 24px 20px; border-bottom: 1px solid #f0efeb; }
        .event-modal-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 14px; }
        .event-modal-avatar.sister { background: #fff0f2; }
        .event-modal-avatar.brother { background: #eff6ff; }
        .event-modal-name { font-size: 18px; font-weight: 700; margin: 0; color: #1a1a1a; }
        .event-modal-meta { font-size: 13px; color: #888; }
        .event-modal-actions { display: grid; grid-template-columns: 1fr 1fr; }
        .event-action-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 15px; text-decoration: none; border: none; background: transparent; font-family: inherit; }
        .event-action-btn:first-child { border-right: 1px solid #f0efeb; }
        .event-action-label { font-size: 12px; font-weight: 600; color: #1a1a1a; }
        
        .login-box { text-align: center; padding: 40px 20px; background: #fff; border-radius: 16px; }
        .login-box input { padding: 12px; font-size: 20px; width: 100%; max-width: 180px; text-align: center; border: 1.5px solid #e5e3dd; border-radius: 10px; margin-bottom: 15px; }
        .login-box button { padding: 12px 20px; background: #1a1a1a; color: #fff; border: none; border-radius: 10px; font-weight: 700; width: 100%; max-width: 180px; }

        .panel-wrap { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 20px rgba(0,0,0,.06); }
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 10px; border: 1px solid #f0efeb; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
        th, td { border-bottom: 1px solid #f0efeb; padding: 10px 8px; text-align: center; }
        
        .date-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px; background: #faf9f6; }
        .date-btn { padding: 8px 0; font-size: 11px; border: 1px solid #e5e3dd; background: white; border-radius: 4px; }
        .date-btn.selected { background: #1a1a1a; color: white; }

        .template-box { background: #faf9f6; padding: 15px; border-radius: 12px; border: 1px solid #f0efeb; margin-bottom: 15px; }
        textarea { width: 100%; padding: 12px; border: 1.5px solid #e5e3dd; border-radius: 10px; font-size: 13px; font-family: inherit; }
        .member-sms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .sms-item-btn { padding: 12px 8px; border: 1px solid #f0efeb; border-radius: 10px; text-align: center; background: #fff; }
        .sms-name { font-size: 13px; font-weight: 700; display: block; }
        .sms-gender { font-size: 10px; }
    </style>
</head>
<body>

    <header>
        <h2>✦ <span class="accent">강일</span> 스케줄러</h2>
        <div class="header-btns">
            <button id="hbtn-calendar" onclick="requestView('calendar-view')">달력</button>
            <button id="hbtn-daily" onclick="requestView('daily-view')">복사</button>
            <button id="hbtn-admin" onclick="requestView('admin-view')">관리</button>
            <button id="hbtn-sms" onclick="requestView('sms-view')">문자</button>
        </div>
    </header>

    <div class="container">
        <div id="calendar-view">
            <div class="cal-legend-bar">
                <span><i class="legend-s"></i>자매</span>
                <span><i class="legend-b"></i>형제</span>
            </div>
            <div id="calendar"></div>
        </div>

        <div id="login-view" class="login-box">
            <h3>보안 구역</h3>
            <p style="font-size:13px; color:#888;">관리자 PIN을 입력하세요.</p>
            <input type="password" id="pinInput" placeholder="····" maxlength="4" inputmode="numeric">
            <br>
            <button onclick="checkPin()">인증하기</button>
            <p id="loginError" style="color: #f43f5e; display: none; margin-top: 10px; font-weight: 700; font-size: 12px;">오답입니다.</p>
        </div>

        <div id="admin-view" class="panel-wrap">
            <p style="font-weight:700; margin-bottom:5px;">인원 관리</p>
            <button style="background:#1a1a1a; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-size:12px; margin-bottom:10px;" onclick="addNewMember()">+ 추가</button>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>회중</th><th>이름</th><th>성별</th><th>참여일</th><th>관리</th></tr>
                    </thead>
                    <tbody id="memberTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="sms-view" class="panel-wrap">
            <div class="template-box">
                <p style="font-weight:700; margin-bottom:10px;">문자 템플릿</p>
                <select id="templateSelect" onchange="loadSelectedTemplate()" style="width:100%; padding:8px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
                    <option value="new">+ 새 템플릿</option>
                </select>
                <textarea id="smsTextarea" placeholder="내용 입력"></textarea>
                <button class="btn-save" style="width:100%; margin-top:10px; padding:10px; border-radius:8px; background:#1a1a1a; color:#fff; border:none;" onclick="saveTemplateToFirebase()">템플릿 저장</button>
            </div>
            <div class="member-sms-grid" id="smsGrid"></div>
        </div>

        <div id="daily-view" class="panel-wrap">
            <p style="font-weight:700; margin-bottom:10px;">일자별 명단 복사</p>
            <div id="dailyDateGrid" class="date-grid" style="max-width:300px; margin:0 auto 15px;"></div>
            <textarea id="dailySummaryText" style="height:150px;" readonly></textarea>
            <button onclick="copyDailySummary()" style="width:100%; padding:12px; margin-top:10px; background:#1a1a1a; color:#fff; border:none; border-radius:8px; font-weight:700;">텍스트 복사</button>
            <div id="copyNoti" style="display:none; text-align:center; color:green; font-weight:700; margin-top:5px;">복사 완료!</div>
        </div>
    </div>

    <div class="modal-overlay" id="eventModalOverlay" onclick="closeModal('eventModalOverlay', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalBtn('eventModalOverlay')">✕</button>
            <div class="event-modal-header">
                <div class="event-modal-avatar" id="modalAvatar">👤</div>
                <p class="event-modal-name" id="modalName">이름</p>
                <p class="event-modal-meta" id="modalDesc">회중 정보</p>
            </div>
            <div class="event-modal-actions">
                <a href="#" class="event-action-btn" id="modalCall">📞 <span class="event-action-label">전화</span></a>
                <a href="#" class="event-action-btn" id="modalSms">💬 <span class="event-action-label">문자</span></a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="smsSendModalOverlay" onclick="closeModal('smsSendModalOverlay', event)">
        <div class="modal-content" onclick="event.stopPropagation()" style="padding:20px;">
            <button class="modal-close" onclick="closeModalBtn('smsSendModalOverlay')">✕</button>
            <h3 id="smsSendTargetName" style="font-size:15px; margin-bottom:10px;">메시지 보내기</h3>
            <select id="sendModalTemplateSelect" onchange="updateSmsPreview()" style="width:100%; padding:8px; margin-bottom:10px;"></select>
            <textarea id="smsPreviewText" style="height:120px;" readonly></textarea>
            <button onclick="executeSmsSend()" style="width:100%; margin-top:10px; padding:12px; background:#1a1a1a; color:#fff; border:none; border-radius:8px;">문자 앱 열기</button>
        </div>
    </div>

    <script>
        // Firebase 설정 및 기존 로직 (변경 없음)
        const firebaseConfig = {
            apiKey: "AIzaSyC4FWP-jskItmNA4SVP-kDGA1gL_U85asw",
            authDomain: "chocosora-ad4df.firebaseapp.com",
            databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com",
            projectId: "chocosora-ad4df",
            storageBucket: "chocosora-ad4df.firebasestorage.app",
            messagingSenderId: "798065461606",
            appId: "1:798065461606:web:fcc2308eae7a71e8f360a7"
        };

        let db = null;
        try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

        const ADMIN_PIN = "4560";
        const SECRET_KEY = "GuestRoster_Secret_V5_Secure";
        let calendarInstance = null;
        let members = [];
        let smsTemplates = [];
        let currentSmsUserIndex = null;
        let pendingView = '';

        // 초기 데이터 (동일)
        const initialData = [
            { cong: '경기이천부발', name: '진보람', gender: '자매', birth: '1994', phone: '010-2572-4132', dates: ['2026-05-14', '2026-05-15'] },
            { cong: '경기이천부발', name: '김지윤', gender: '형제', birth: '1990', phone: '010-2439-5207', dates: ['2026-05-14', '2026-05-15'] }
        ];

        // 유틸리티 함수
        function encryptData(data) { return CryptoJS.AES.encrypt(JSON.stringify(data), SECRET_KEY).toString(); }
        function decryptData(ciphertext) { try { return JSON.parse(CryptoJS.AES.decrypt(ciphertext, SECRET_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) { return null; } }

        // 데이터 로드 및 달력 초기화
        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            const isMobile = window.innerWidth <= 768;

            calendarInstance = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: '2026-05-01',
                locale: 'ko',
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'today'
                },
                dayMaxEvents: isMobile ? 2 : 4, // 모바일에서 너무 많은 이벤트 방지
                events: generateCalendarEvents(),
                dayCellDidMount: function(info) {
                    const dateStr = info.date.toISOString().split('T')[0];
                    const count = members.filter(m => m.dates && m.dates.includes(dateStr)).length;
                    if (count > 0) {
                        const top = info.el.querySelector('.fc-daygrid-day-top');
                        if (top) {
                            const badge = document.createElement('span');
                            badge.className = 'day-count-badge';
                            badge.textContent = count; // '명' 제외하고 숫자만 표시하여 공간확보
                            top.appendChild(badge);
                        }
                    }
                },
                eventClick: function(info) {
                    const data = info.event.extendedProps;
                    const isSister = data.gender === '자매';
                    document.getElementById('modalAvatar').textContent = isSister ? '👩' : '👨';
                    document.getElementById('modalAvatar').className = 'event-modal-avatar ' + (isSister ? 'sister' : 'brother');
                    document.getElementById('modalName').textContent = `${data.name} (${data.gender})`;
                    document.getElementById('modalDesc').textContent = `${data.cong} · ${2026-data.birth}세`;
                    document.getElementById('modalCall').href = `tel:${data.phone}`;
                    document.getElementById('modalSms').href = `sms:${data.phone}`;
                    document.getElementById('eventModalOverlay').style.display = 'flex';
                }
            });
            calendarInstance.render();
        }

        // 기존 기능 함수들 (원본 로직 유지)
        function generateCalendarEvents() {
            let events = [];
            members.forEach(m => {
                if (m.dates) {
                    m.dates.forEach(d => {
                        events.push({
                            title: m.name,
                            start: d,
                            className: m.gender === '자매' ? 'gender-sister' : 'gender-brother',
                            extendedProps: m,
                            backgroundColor: m.gender === '자매' ? '#fff0f2' : '#eff6ff',
                            textColor: m.gender === '자매' ? '#c0132b' : '#1d4ed8',
                            borderColor: 'transparent'
                        });
                    });
                }
            });
            return events;
        }

        function requestView(viewId) {
            if (viewId !== 'calendar-view') { pendingView = viewId; showView('login-view'); }
            else showView('calendar-view');
        }

        function showView(viewId) {
            ['calendar-view','login-view','admin-view','sms-view','daily-view'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById(viewId).style.display = 'block';
            if (viewId === 'calendar-view' && calendarInstance) {
                setTimeout(() => calendarInstance.render(), 50); // 렌더링 타이밍 보정
            }
            if (viewId === 'sms-view') renderSmsGrid();
            if (viewId === 'daily-view') initDailyView();
            
            // 헤더 버튼 활성화
            document.querySelectorAll('.header-btns button').forEach(b => b.classList.remove('active'));
            const btnId = 'hbtn-' + (viewId === 'login-view' ? pendingView.replace('-view','') : viewId.replace('-view',''));
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
        }

        function checkPin() {
            if (document.getElementById('pinInput').value === ADMIN_PIN) {
                if (pendingView === 'admin-view') renderAdminTable();
                showView(pendingView);
            } else { document.getElementById('loginError').style.display = 'block'; }
        }

        function renderAdminTable() {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '';
            members.forEach((m, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${m.cong}</td><td>${m.name}</td><td>${m.gender}</td><td style="font-size:10px;">${m.dates.length}일</td>
                <td><button onclick="editRow(${i})">수정</button></td>`;
                tbody.appendChild(tr);
            });
        }

        // 초기 실행
        window.onload = () => {
            const saved = localStorage.getItem('encryptedMembersDataV5');
            members = saved ? (decryptData(saved) || initialData) : initialData;
            initCalendar();
            showView('calendar-view');
        };

        // 모달 닫기용
        function closeModal(id, e) { if (e.target.id === id) document.getElementById(id).style.display = 'none'; }
        function closeModalBtn(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
