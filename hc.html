            { title: '방문 전날', body: '안녕하세요, 하수구의 제왕입니다.\n예약 확인 차 안내 문자 드립니다.\n문자를 확인하셨다면 짧게라도 회신 부탁드립니다.\n\n일시: {월}/{일}({요일}) {시간} 사이\n주소: {주소}\n남겨주신 주소가 정확한지 다시 한번 확인 부탁드립니다.\n\n원활한 작업을 위해 아래 두 가지를 부탁드립니다.\n✔ 싱크대 하부 공간을 미리 정리해 주시면 감사하겠습니다.\n✔ 문제가 있는 현장 사진을 문자로 한 장 전송 부탁드립니다.\n(이미 보내주셨다면 생략하셔도 괜찮습니다.)\n\n또한 단지 내 차량 등록이 필요하신 경우, 아래 차량 번호 등록을 요청드립니다.\n차량 번호: 63가 7072\n\n믿고 맡겨주신 만큼 꼼꼼하고 책임감 있게 작업해 드리겠습니다.\n{요일}요일에 뵙겠습니다. 감사합니다.' },

            { title: '리뷰 작성 요청', body: '고객님, 오늘 막힌 하수구는 시원하게 잘 해결해 드렸습니다!\n믿고 맡겨주셔서 감사합니다.\n\n작업 결과에 만족하셨다면, 앞서 약속해주신 구글 리뷰 작성을 조심스럽게 부탁드리고자 합니다.\n아래 내용을 참고해 작성해 주시면 저희가 지역 내에서 더 신뢰받는 업체로 성장하는 데 큰 도움이 됩니다.\n\n[리뷰 작성 팁!]\n✔ 검색 키워드 포함\n\'{지역} 하수구 업체 하수구의제왕\' 문구를 포함해 주시면 정말 감사하겠습니다.\n(예: 송파 하수구 업체 하수구의제왕 덕분에 해결했어요!)\n\n✔ 느낀 점 공유\n저희의 친절함이나 전문적인 작업 과정에 대해 짧게 언급해 주시면 저희 팀원들에게 큰 격려가 됩니다.\n\n[리뷰 작성 링크]\nhttps://g.page/r/Cbpx5qL6PxIsEBM/review\n\n혹시 이용 중 불편하신 점이 있었다면 언제든 말씀해 주세요.\n늘 전문성을 바탕으로 책임감 있게 사후 관리까지 책임지는 하수구의제왕이 되겠습니다.\n감사합니다!' }

        const App = () => {
            const today = new Date();
            today.setHours(0,0,0,0);

            const [rawInput, setRawInput] = useState('');
            const [parsedAddress, setParsedAddress] = useState('');

            const [isProcessing, setIsProcessing] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [jobs, setJobs] = useState({});

            const [offDayForm, setOffDayForm] = useState({ type: 'full', startTime: '09:00', endTime: '18:00', reason: '' });
            const [showOffDayPanel, setShowOffDayPanel] = useState(false);

            const [currentDateView, setCurrentDateView] = useState(new Date(today));
            
            const [editingId, setEditingId] = useState(null);
            const [smsModal, setSmsModal] = useState(null); 
            const [timeModalOpen, setTimeModalOpen] = useState(false);
            const [offTimeModalField, setOffTimeModalField] = useState(null);

            const [assignDateModal, setAssignDateModal] = useState(null);
            const [assignDateVal, setAssignDateVal] = useState(todayStr);

            const inputSectionRef = useRef(null);

            const timeOptions = ['08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00'];
            const addressInputRef = useRef(null);
            const detailsInputRef = useRef(null);

            useEffect(() => {
                const jobsRef = ref(database, 'homecare_jobs');
                const unsubJobs = onValue(jobsRef, (snapshot) => setJobs(snapshot.val() || {}));

                const offDaysRef = ref(database, 'homecare_offdays');
                const unsubOffDays = onValue(offDaysRef, (snapshot) => setOffDays(snapshot.val() || {}));

                const templatesRef = ref(database, 'homecare_settings/sms_templates');
                const unsubTemplates = onValue(templatesRef, (snapshot) => {
                    const data = snapshot.val();

                });

                return () => {
                    unsubJobs();
                    unsubOffDays();
                    unsubTemplates();
                };
            }, []);

            const jobsByDate = useMemo(() => {
                const map = {};
                Object.entries(jobs).forEach(([key, job]) => {
                    if(job.dates) {
                        job.dates.forEach(d => {
                            if(!map[d]) map[d] = [];
                            map[d].push({ key, ...job });
                        });
                    }
                });
                return map;
            }, [jobs]);

            const offDaysByDate = useMemo(() => {
                const map = {};
                Object.entries(offDays).forEach(([key, offDay]) => {
                    if (!offDay.date) return;
                    if (!map[offDay.date]) map[offDay.date] = [];
                    map[offDay.date].push({ key, ...offDay });
                });
                Object.keys(map).forEach(date => {
                    map[date].sort((a, b) => (a.startTime || '00:00').localeCompare(b.startTime || '00:00'));
                });
                return map;
            }, [offDays]);

            const activeDateOffDays = useMemo(() => {
                return Object.entries(offDays)
                    .map(([key, offDay]) => ({ key, ...offDay }))
                    .filter(offDay => offDay.date === activeDate)
                    .sort((a, b) => (a.startTime || '00:00').localeCompare(b.startTime || '00:00'));
            }, [offDays, activeDate]);

            const activeDateJobs = useMemo(() => {
                const jobList = Object.entries(jobs)
                    .map(([key, job]) => ({ key, ...job }))
                    .filter(job => job.dates && job.dates.includes(activeDate));

                return jobList.sort((a, b) => {
                    const timeA = a.visitTime || '23:59';
                    const timeB = b.visitTime || '23:59';
                    return timeA.localeCompare(timeB);
                });
            }, [jobs, activeDate]);

            const activeFullOffDays = useMemo(() => {
                return activeDateOffDays.filter(offDay => (offDay.type || 'full') === 'full');
            }, [activeDateOffDays]);

            const activeDateTimeline = useMemo(() => {
                const jobItems = activeDateJobs.map(job => ({
                    itemType: 'job',
                    key: `job-${job.key}`,
                    sortTime: job.visitTime || '23:59',
                    job
                }));

                const timedOffItems = activeDateOffDays
                    .filter(offDay => (offDay.type || 'full') === 'time')
                    .map(offDay => ({
                        itemType: 'off',
                        key: `off-${offDay.key}`,
                        sortTime: offDay.startTime || '00:00',
                        offDay
                    }));

                return [...jobItems, ...timedOffItems].sort((a, b) => {
                    const timeCompare = a.sortTime.localeCompare(b.sortTime);
                    if (timeCompare !== 0) return timeCompare;
                    if (a.itemType === b.itemType) return 0;
                    return a.itemType === 'off' ? -1 : 1;
                });
            }, [activeDateJobs, activeDateOffDays]);

            const consultationJobs = useMemo(() => {
                return Object.entries(jobs)
                    .map(([key, job]) => ({ key, ...job }))
                    .filter(job => job.dates && job.dates.includes('waiting'))
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }, [jobs]);

            const monthlyStats = useMemo(() => {
                const year = currentDateView.getFullYear();
                const month = String(currentDateView.getMonth() + 1).padStart(2, '0');
                const prefix = `${year}-${month}-`;

                let totalRev = 0;
                let totalMat = 0;
                let totalNet = 0;
                let completedCount = 0;
                const monthJobs = [];

                Object.entries(jobs).forEach(([key, job]) => {
                    if (job.status === 'completed' && job.dates) {
                        const hasCurrentMonthDate = job.dates.some(d => d.startsWith(prefix));
                        if (hasCurrentMonthDate) {
                            totalRev += (job.totalAmount || 0);
                            totalMat += (job.totalMaterialCost || 0);
                            const net = job.netIncome !== undefined ? job.netIncome : ((job.totalAmount || 0) - (job.totalMaterialCost || 0));
                            totalNet += net;
                            completedCount++;
                            monthJobs.push({ key, ...job });
                        }
                    }
                });

                const fee = totalNet * 0.3; 
                const finalProfit = totalNet - fee;

                return {
                    totalRev,
                    totalMat,
                    totalNet,
                    fee,
                    finalProfit,
                    completedCount,
                    monthJobs: monthJobs.sort((a,b) => {
                        const dateA = a.dates.find(d => d.startsWith(prefix)) || a.dates[0];
                        const dateB = b.dates.find(d => d.startsWith(prefix)) || b.dates[0];
                        return dateA.localeCompare(dateB);
                    })
                };
            }, [jobs, currentDateView]);

            const handleTaskChange = (index, field, value) => {
                const newTasks = [...tasks];
                newTasks[index][field] = value;
                setTasks(newTasks);
            };

            const addTask = () => setTasks([...tasks, { description: '', amount: '', materialCost: '' }]);
            const removeTask = (index) => setTasks(tasks.filter((_, i) => i !== index));

            const displayWorkCost = tasks.reduce((sum, task) => sum + (Number(task.amount) || 0), 0) * 10000;
            const displayMaterialCost = tasks.reduce((sum, task) => sum + (Number(task.materialCost) || 0), 0) * 10000;
            const netIncome = displayWorkCost - displayMaterialCost;

            const handleHybridSearch = async () => {
                if (!rawInput.trim()) return;
                setIsProcessing(true);

                try {
                    const prompt = `
                        너는 전문적인 주소 텍스트 분석기야. 입력된 문장에서 "지도 검색용 핵심 키워드"와 "상세 정보"를 정확히 분리해줘.
                        
                        [규칙]
                        1. search_query: 지도 API가 인식할 수 있는 핵심 주소 (지번, 아파트명, 도로명). 동/호수나 "층", "입니다" 같은 불필요한 말은 절대 넣지 마.
                        2. details: 나머지 상세 정보 (건물명, 동, 호수, 층수 등).
                        3. 절대로 주소를 창조하거나 추측해서 도로명 주소를 만들지 마. 있는 그대로 분리만 해.

                        [예시]
                        입력: "순천시 조례동 1598-1 나라타워 8층입니다"
                        출력: { "search_query": "순천시 조례동 1598-1", "details": "나라타워 8층" }
                        
                        입력: "서울 서초구 방배삼호 1차 2동 716호"
                        출력: { "search_query": "서울 서초구 방배삼호 1차", "details": "2동 716호" }

                        입력: "${rawInput}"
                        출력 포맷: JSON
                    `;

                    const geminiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const geminiData = await geminiResponse.json();
                    if (geminiData.error) throw new Error("AI 분석 오류: " + geminiData.error.message);

                    let aiText = geminiData.candidates[0].content.parts[0].text;
                    const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                    const parsedAI = JSON.parse(jsonMatch ? jsonMatch[0] : aiText);

                    const searchQuery = parsedAI.search_query;
                    const detailsFromAI = parsedAI.details;

                    const kakaoResponse = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(searchQuery)}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `KakaoAK ${KAKAO_API_KEY}`
                        }
                    });

                    const kakaoData = await kakaoResponse.json();

                    if (kakaoData.documents && kakaoData.documents.length > 0) {
                        const bestMatch = kakaoData.documents[0];
                        const officialAddress = bestMatch.road_address_name || bestMatch.address_name;
                        const placeName = bestMatch.place_name;

                        setParsedAddress(officialAddress);

                        let finalDetails = detailsFromAI;

                        if (placeName && !finalDetails.includes(placeName) && !searchQuery.includes(placeName)) {
                            finalDetails = `${placeName} ${finalDetails}`;
                        }

            const parseSmsTemplate = (templateBody, job) => {
                const targetDateStr = (job.dates && job.dates[0] !== 'waiting') ? job.dates[0] : todayStr;
                const dateObj = new Date(targetDateStr);
                const month = String(dateObj.getMonth() + 1);
                const date = String(dateObj.getDate());
                const dayStr = ['일', '월', '화', '수', '목', '금', '토'][dateObj.getDay()];
                
                const startTime = job.visitTime || '09:00';
                const [hour, min] = startTime.split(':').map(Number);
                const endDateObj = new Date();
                endDateObj.setHours(hour, min + 30);
                const endHour = String(endDateObj.getHours()).padStart(2, '0');
                const endMin = String(endDateObj.getMinutes()).padStart(2, '0');
                const formattedTimeRange = `${startTime} ~ ${endHour}:${endMin}`;
                
                const fullAddress = `${job.address || ''} ${job.details || ''}`.trim();

                let regionStr = '지역';
                if (job.address) {
                    const parts = job.address.split(' ');
                    const gu = parts.find(p => p.endsWith('구'));
                    const si = parts.find(p => p.endsWith('시'));
                    if (gu) {
                        regionStr = gu.slice(0, -1);
                    } else if (si) {
                        regionStr = si.slice(0, -1);
                    }
                }

                const workNames = job.tasks && job.tasks.length > 0 
                    ? job.tasks.map(t => {
                        const cost = (Number(t.amount) || 0) * 10000;
                        const costText = cost > 0 ? ` - ${cost.toLocaleString()}원` : '';
                        return `- ${t.description || '내용 없음'}${costText}`;
                    }).join('\n') 
                    : '- 작업 내용 없음';
                    
                const totalAmt = (job.totalAmount || 0) + (job.totalMaterialCost || 0);

                return templateBody
                    .replace(/{월}/g, month)
                    .replace(/{일}/g, date)
                    .replace(/{요일}/g, dayStr)
                    .replace(/{시간}/g, formattedTimeRange)
                    .replace(/{주소}/g, fullAddress)
                    .replace(/{지역}/g, regionStr)
                    .replace(/{작업내역}/g, workNames)
                    .replace(/{총금액}/g, totalAmt.toLocaleString());
            };

                        const dateStr = (job.dates.find(d => d.startsWith(prefix)) || '').slice(5).replace('-', '/');
                        const tasksStr = job.tasks?.map(t => t.description || '').filter(Boolean).join(', ') || '-';
                        const net = job.netIncome !== undefined ? job.netIncome : ((job.totalAmount || 0) - (job.totalMaterialCost || 0));
                        const finalPr = net - (net * 0.3);

                        const rowData = [
                            dateStr,
                            truncate(job.address || '', 20),
                            truncate(tasksStr, 22),
                            (job.totalAmount || 0).toLocaleString(),
                            (job.totalMaterialCost || 0).toLocaleString(),
                            Math.round(finalPr).toLocaleString(),
                        ];

                        const bgColor = idx % 2 === 0 ? [255,255,255] : [248,250,252];
                        let x = marginL;
                        rowData.forEach((val, ci) => {
                            pdf.setFillColor(...bgColor);
                            pdf.rect(x, curY, colWidths[ci], rowH, 'FD');
                            pdf.setFontSize(7);
                            pdf.setFont('NanumGothic', ci === 5 ? 'bold' : 'normal');
                            pdf.setTextColor(ci === 5 ? 67 : ci === 4 ? 180 : 30,
                                             ci === 5 ? 56 : 30,
                                             ci === 5 ? 202 : 30);
                            const align = (ci >= 3) ? 'right' : (ci === 0 ? 'center' : 'left');
                            const textX = align === 'right' ? x + colWidths[ci] - 2
                                        : align === 'center' ? x + colWidths[ci] / 2
                                        : x + 2;
                            pdf.text(String(val), textX, curY + 5.2, { align });
                            x += colWidths[ci];
                        });
                        pdf.setTextColor(0, 0, 0);
                        curY += rowH;
                    });

                    // 합계 행
                    if (curY + rowH > pageH - 15) { pdf.addPage(); curY = 15; }
                    const sumData = ['합계', '', '',
                        monthlyStats.totalRev.toLocaleString(),
                        monthlyStats.totalMat.toLocaleString(),
                        Math.round(monthlyStats.finalProfit).toLocaleString()
                    ];
                    let x = marginL;
                    sumData.forEach((val, ci) => {
                        pdf.setFillColor(238, 242, 255);
                        pdf.rect(x, curY, colWidths[ci], rowH, 'FD');
                        pdf.setFontSize(8);
                        pdf.setFont('NanumGothic', 'bold');
                        pdf.setTextColor(67, 56, 202);
                        const align = ci >= 3 ? 'right' : (ci === 0 ? 'center' : 'left');
                        const textX = align === 'right' ? x + colWidths[ci] - 2
                                    : align === 'center' ? x + colWidths[ci] / 2
                                    : x + 2;
                        pdf.text(val, textX, curY + 5.2, { align });
                        x += colWidths[ci];
                    });

                    const totalPages = pdf.internal.getNumberOfPages();

                        pdf.setPage(p);
                        pdf.setFontSize(8);
                        pdf.setFont('NanumGothic', 'normal');
                        pdf.setTextColor(150, 150, 150);
                        pdf.text(`${p} / ${totalPages}`, pageW / 2, pageH - 8, { align: 'center' });
                        pdf.text('HomeCarKing', pageW - marginR, pageH - 8, { align: 'right' });
                    }

                    pdf.save(`홈케어매출_${year}년_${monthNum}월.pdf`);

                                <div className="flex items-center gap-2 mb-4">
                                    <CalendarDays className="w-5 h-5 text-teal-500" />
                                    <h3 className="text-lg font-extrabold text-slate-800">예약 날짜 확정</h3>
                                </div>
                                <p className="text-sm text-slate-500 mb-4 leading-relaxed">
                                    선택한 고객의 방문 일정을 확정하고 캘린더로 이동시킵니다.
                                </p>
                                <input
                                    type="date"
                                    className="w-full p-4 bg-slate-50 rounded-xl text-slate-800 font-bold border border-slate-200 mb-6 outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-center"
                                    value={assignDateVal}
                                    onChange={(e) => setAssignDateVal(e.target.value)}
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setAssignDateModal(null)} className="flex-1 py-3.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl active:bg-slate-50">취소</button>
                                    <button
                                        onClick={handleAssignDate}
                                        className="flex-[2] py-3.5 bg-teal-600 text-white font-bold rounded-xl shadow-lg active:scale-95 hover:bg-teal-700"
                                    >
                                        일정 등록
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
