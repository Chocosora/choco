<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>둔촌회관 2층 배치도</title>
    <style>
        /* 기본 초기화 및 꽉 찬 화면 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            width: 100vw;
            height: 100vh; /* 화면 높이 100% 고정 */
            overflow: hidden; /* 스크롤 방지 */
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            width: 100%;
            height: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 상-중-하 배치 균등 분할 */
        }

        /* --- 상단: 확성부/마이크/안내부 --- */
        .special-section {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            height: 15%; /* 상단 영역 높이 비율 */
            min-height: 90px;
        }
        .special-area {
            background: #f8f8f8;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 5px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .special-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }
        .mic-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex: 0.8;
            align-items: center;
        }
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .mic-label { font-size: 11px; font-weight: bold; }
        
        /* 엠프 박스 스타일 */
        .amp-label {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: #444;
            color: white;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 0;
            border-radius: 4px;
        }

        /* --- 중단: 좌석 영역 --- */
        .seating-area {
            display: flex;
            justify-content: space-between;
            flex: 1; /* 남는 공간 모두 차지 */
            margin: 10px 0;
            overflow: hidden;
        }
        .section {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .section-title {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        /* 통로 */
        .aisle { width: 15px; }

        /* 좌석 행 스타일 */
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
            height: 32px; /* 좌석 높이 고정 */
        }

        /* 좌석 개별 스타일 */
        .seat {
            width: 100%; /* 부모 너비에 맞춤 */
            max-width: 55px; /* 최대 너비 제한 */
            height: 30px;
            background: white;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 2px;
            white-space: nowrap;
        }
        .seat.occupied { background: #e8e8e8; border-color: #999; }
        .seat.unused { background: #ffcccc; border-color: #ff6666; color: red; font-size: 16px; }

        .pillar {
            width: 35px; height: 30px;
            background: #888; color: white;
            font-size: 10px; display: flex;
            align-items: center; justify-content: center;
            border-radius: 4px;
            margin: 0 2px;
        }
        .row-label {
            width: 18px; font-size: 9px;
            text-align: center; color: #666;
            margin-right: 2px;
        }

        /* 우측 섹션 레이아웃 (메모장 + 좌석 하단 정렬) */
        #right-column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* 우측 좌석 컨테이너: 하단 정렬 */
        #right-section-seats {
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 좌석을 바닥으로 밀어버림 */
        }
        /* 메모장 컨테이너: 상단 남는 공간 차지 */
        .memo-container {
            flex: 1; /* 남는 공간 채우기 */
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            min-height: 0; /* Flexbox 축소 허용 */
        }
        .memo-title { font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 2px; }
        .memo-area {
            width: 100%;
            height: 100%; /* 부모 높이만큼 꽉 채움 */
            resize: none;
            border: 2px solid #81d4fa;
            border-radius: 6px;
            background: #e1f5fe;
            padding: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        /* --- 하단: 연단 --- */
        .stage-area {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .stage {
            width: 200px; height: 35px;
            background: #e0e0e0; border: 2px solid #ccc;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #333;
        }

        /* 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .modal-content { background: white; width: 300px; margin: 20% auto; padding: 20px; border-radius: 10px; text-align: center; }
        .modal input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        .btn-group { display: flex; gap: 5px; justify-content: center; }
        .btn { padding: 8px 15px; border: 1px solid #ccc; border-radius: 4px; background: white; cursor: pointer; font-weight: bold; }
        .btn-save { background: #333; color: white; }
        .btn-mark { background: #ff6666; color: white; border-color: #ff6666; }

    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <div class="special-section">
            <div class="special-area">
                <div class="special-title">확성부</div>
                <div class="row" id="broadcast-section" style="justify-content: center; height: 100%; align-items: center;"></div>
                <div class="amp-label">엠 프</div>
            </div>

            <div class="mic-section">
                <div class="mic-container">
                    <div class="mic-label">마이크 (좌)</div>
                    <div id="mic-left-container"></div>
                </div>
                <div class="mic-container">
                    <div class="mic-label">마이크 (우)</div>
                    <div id="mic-right-container"></div>
                </div>
            </div>

            <div class="special-area">
                <div class="special-title">안내부</div>
                <div class="row" id="info-section" style="justify-content: center; height: 100%; align-items: center;"></div>
            </div>
        </div>

        <div class="seating-area">
            <div class="section">
                <div class="section-title">청중석 (좌)</div>
                <div id="left-section"></div>
            </div>

            <div class="aisle"></div>

            <div class="section">
                <div class="section-title">청중석 (중)</div>
                <div id="center-section"></div>
            </div>

            <div class="aisle"></div>

            <div class="section" id="right-column">
                <div class="section-title">청중석 (우)</div>
                <div class="memo-container">
                    <div class="memo-title">실시간 전달 사항</div>
                    <textarea id="right-memo" class="memo-area" placeholder="내용을 입력하세요"></textarea>
                </div>
                <div id="right-section-seats"></div>
            </div>
        </div>

        <div class="stage-area">
            <div class="stage">연단</div>
        </div>
    </div>

    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h3>좌석 정보</h3>
            <input type="text" id="nameInput" placeholder="이름 입력" maxlength="10">
            <div class="btn-group">
                <button class="btn btn-save" onclick="saveName()">저장</button>
                <button class="btn btn-mark" onclick="toggleUnused()">X 표시</button>
                <button class="btn" onclick="clearName()">삭제</button>
                <button class="btn" onclick="closeModal()">취소</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4FWP-jskItmNA4SVP-kDGA1gL_U85asw",
            authDomain: "chocosora-ad4df.firebaseapp.com",
            databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com",
            projectId: "chocosora-ad4df",
            storageBucket: "chocosora-ad4df.firebasestorage.app",
            messagingSenderId: "798065461606",
            appId: "1:798065461606:web:fcc2308eae7a71e8f360a7",
            measurementId: "G-4FYC7HVNNV"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const seatsRef = db.ref('seatingChart/dunchon2f/seats');
        const memoRef = db.ref('seatingChart/dunchon2f/memo');

        let currentSeat = null;

        function createSeatElement(parent, id) {
            const seat = document.createElement('div');
            seat.className = 'seat';
            seat.id = id;
            seat.onclick = () => openModal(id);
            seat.oncontextmenu = (e) => { e.preventDefault(); toggleUnusedDirect(id); };
            parent.appendChild(seat);
        }

        function createRow(container, rowNum, seatsCount, prefix, hasPillar) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';

            // 기둥 (좌측 섹션용)
            if (hasPillar && prefix === 'L') {
                const pillar = document.createElement('div');
                pillar.className = 'pillar';
                pillar.textContent = '기둥';
                rowDiv.appendChild(pillar);
            }

            // 행 번호
            const label = document.createElement('div');
            label.className = 'row-label';
            label.textContent = rowNum;
            rowDiv.appendChild(label);

            // 좌석 생성
            for (let i = 1; i <= seatsCount; i++) {
                createSeatElement(rowDiv, `${prefix}${rowNum}-${i}`);
            }

            // 기둥 (우측 섹션용)
            if (hasPillar && prefix === 'R') {
                const pillar = document.createElement('div');
                pillar.className = 'pillar';
                pillar.textContent = '기둥';
                rowDiv.appendChild(pillar);
            }

            container.appendChild(rowDiv);
        }

        function init() {
            // 좌측 (13~1)
            const leftEl = document.getElementById('left-section');
            for(let r=13; r>=1; r--) {
                const hasPillar = (r===3 || r===8 || r===9);
                createRow(leftEl, r, 4, 'L', hasPillar);
            }

            // 중앙 (13~1)
            const centerEl = document.getElementById('center-section');
            for(let r=13; r>=1; r--) {
                createRow(centerEl, r, 5, 'C', false);
            }

            // 우측 (8~1) - 하단 정렬을 위해 Flex-end 컨테이너에 추가
            const rightEl = document.getElementById('right-section-seats');
            for(let r=8; r>=1; r--) {
                const hasPillar = (r===3);
                createRow(rightEl, r, 4, 'R', hasPillar);
            }

            // 상단 특수 좌석
            const broadcastEl = document.getElementById('broadcast-section');
            for(let i=1; i<=4; i++) createSeatElement(broadcastEl, `B${i}`);
            
            const infoEl = document.getElementById('info-section');
            for(let i=1; i<=4; i++) createSeatElement(infoEl, `I${i}`);

            createSeatElement(document.getElementById('mic-left-container'), 'MicL');
            createSeatElement(document.getElementById('mic-right-container'), 'MicR');

            // 리스너 등록
            seatsRef.on('value', snap => {
                const data = snap.val() || {};
                document.querySelectorAll('.seat').forEach(el => {
                    const info = data[el.id];
                    if (info && info.unused) {
                        el.textContent = 'X';
                        el.className = 'seat unused';
                    } else if (info && info.name) {
                        el.textContent = info.name;
                        el.className = 'seat occupied';
                    } else {
                        el.textContent = '';
                        el.className = 'seat';
                    }
                });
            });

            memoRef.on('value', snap => {
                const val = snap.val() || "";
                const el = document.getElementById('right-memo');
                if (document.activeElement !== el) el.value = val;
            });

            document.getElementById('right-memo').addEventListener('input', (e) => {
                memoRef.set(e.target.value);
            });
        }

        // 모달 관련 함수
        function openModal(id) {
            currentSeat = id;
            const modal = document.getElementById('nameModal');
            const input = document.getElementById('nameInput');
            db.ref(`seatingChart/dunchon2f/seats/${id}/name`).once('value', s => {
                input.value = s.val() || '';
            });
            modal.style.display = 'block';
            input.focus();
        }
        function closeModal() {
            document.getElementById('nameModal').style.display = 'none';
            currentSeat = null;
        }
        function saveName() {
            const name = document.getElementById('nameInput').value.trim();
            if(!currentSeat) return;
            if(name) db.ref(`seatingChart/dunchon2f/seats/${currentSeat}`).set({name, unused:false});
            else db.ref(`seatingChart/dunchon2f/seats/${currentSeat}`).remove();
            closeModal();
        }
        function toggleUnused() {
            if(!currentSeat) return;
            toggleUnusedDirect(currentSeat);
            closeModal();
        }
        function clearName() {
            if(currentSeat) db.ref(`seatingChart/dunchon2f/seats/${currentSeat}`).remove();
            closeModal();
        }
        function toggleUnusedDirect(id) {
            const ref = db.ref(`seatingChart/dunchon2f/seats/${id}`);
            ref.child('unused').once('value', s => {
                if(s.val()) ref.remove();
                else ref.set({unused:true});
            });
        }
        document.getElementById('nameModal').addEventListener('click', e => {
            if(e.target.id === 'nameModal') closeModal();
        });
        document.getElementById('nameInput').addEventListener('keypress', e => {
            if(e.key === 'Enter') saveName();
        });

        // 실행
        init();
    </script>
</body>
</html>
