<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>설비 작업 주소록</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.378.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"
        }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            font-family: 'Pretendard', sans-serif;
            background-color: #F3F4F6;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .transition-custom { transition: all 0.2s ease-in-out; }
        
        /* 구분선 스타일 */
        .dashed-line {
            background-image: linear-gradient(to right, #E5E7EB 50%, rgba(255,255,255,0) 0%);
            background-position: bottom;
            background-size: 8px 1px;
            background-repeat: repeat-x;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Calendar, MapPin, Navigation, Save, Trash2, Wand2, Loader2, Wrench, CheckCircle2, ClipboardList, CalendarClock, AlertCircle, Edit2, X, SearchCheck } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, push, onValue, remove, set } from 'firebase/database';

        // --- Firebase 설정 ---
        const firebaseConfig = {
            apiKey: "AIzaSyC4FWP-jskItmNA4SVP-kDGA1gL_U85asw",
            authDomain: "chocosora-ad4df.firebaseapp.com",
            databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com",
            projectId: "chocosora-ad4df",
            storageBucket: "chocosora-ad4df.firebasestorage.app",
            messagingSenderId: "798065461606",
            appId: "1:798065461606:web:fcc2308eae7a71e8f360a7",
            measurementId: "G-4FYC7HVNNV"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // --- API 설정 ---
        // 1. Gemini API (분석용)
        const geminiPartA = "AIzaSyBAhDBv";
        const geminiPartB = "Qror20VfT4vjygpKMh-lUejZhnM";
        const GEMINI_API_KEY = geminiPartA + geminiPartB;

        // 2. Kakao API (검색용 - REST API 키)
        const KAKAO_API_KEY = "faf0b7f3e2f5b11fa2f1bf1d492e3b2b";

        // --- 아이콘 컴포넌트 ---
        const NaverIcon = () => (
            <div className="w-6 h-6 rounded-md bg-[#03C75A] flex items-center justify-center overflow-hidden shadow-sm">
                <span className="text-white font-extrabold text-lg leading-none pt-0.5">N</span>
            </div>
        );

        const TMapIcon = () => (
            <div className="w-6 h-6 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6C4 4.89543 4.89543 4 6 4H18C19.1046 4 20 4.89543 20 6" stroke="url(#tmap_grad_h)" strokeWidth="5" strokeLinecap="round"/>
                    <path d="M12 4V20" stroke="url(#tmap_grad_v)" strokeWidth="5" strokeLinecap="round"/>
                    <defs>
                        <linearGradient id="tmap_grad_h" x1="4" y1="4" x2="20" y2="4" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#FF0050"/>
                            <stop offset="1" stopColor="#0075FF"/>
                        </linearGradient>
                        <linearGradient id="tmap_grad_v" x1="12" y1="4" x2="12" y2="20" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#FF0050"/>
                            <stop offset="1" stopColor="#0075FF"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        );

        const KakaoIcon = () => (
            <div className="w-6 h-6 rounded-full bg-[#FEE500] flex items-center justify-center overflow-hidden border border-[#FEE500] shadow-sm">
                <MapPin className="w-3.5 h-3.5 text-[#191919] fill-[#191919]" />
            </div>
        );

        // --- 헬퍼 함수 ---
        const getDayOfWeek = (year, month, day) => ['일', '월', '화', '수', '목', '금', '토'][new Date(year, month, day).getDay()];
        const getDayOfWeekFromStr = (dateStr) => ['일', '월', '화', '수', '목', '금', '토'][new Date(dateStr).getDay()];

        const App = () => {
            const today = new Date();
            today.setHours(0,0,0,0);
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            const [rawInput, setRawInput] = useState('');
            const [parsedAddress, setParsedAddress] = useState('');
            const [parsedDetails, setParsedDetails] = useState('');
            const [selectedDates, setSelectedDates] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [jobs, setJobs] = useState({});
            const [currentDateView, setCurrentDateView] = useState(new Date());
            
            const [editingId, setEditingId] = useState(null);
            const inputSectionRef = useRef(null);

            useEffect(() => {
                const jobsRef = ref(database, 'jobs');
                return onValue(jobsRef, (snapshot) => setJobs(snapshot.val() || {}));
            }, []);

            // --- 정렬 로직 ---
            const sortedJobs = useMemo(() => {
                const jobList = Object.entries(jobs).map(([key, job]) => {
                    const dates = job.dates || [];
                    const futureDates = dates.filter(d => d >= todayStr).sort();
                    
                    let type = 'other';
                    let sortKey = '';

                    if (futureDates.length > 0) {
                        type = 'active';
                        sortKey = futureDates[0];
                    } else if (dates.length === 0) {
                        type = 'undecided';
                        sortKey = '9999-99-99';
                    } else {
                        type = 'past';
                        sortKey = dates[dates.length - 1];
                    }

                    return { key, ...job, type, sortKey };
                });

                return jobList.sort((a, b) => {
                    if (a.type === 'active' && b.type !== 'active') return -1;
                    if (a.type !== 'active' && b.type === 'active') return 1;
                    if (a.type === 'active') return a.sortKey.localeCompare(b.sortKey);
                    return b.createdAt - a.createdAt;
                });
            }, [jobs, todayStr]);


            // =================================================================================
            // [핵심] Gemini + Kakao 하이브리드 주소 분석 함수
            // =================================================================================
            const handleHybridSearch = async () => {
                if (!rawInput.trim()) return;
                setIsProcessing(true);

                try {
                    // -----------------------------------------------------------
                    // 1단계: Gemini에게 "검색할 알맹이"와 "상세 정보" 분리시키기
                    // -----------------------------------------------------------
                    const prompt = `
                        너는 전문적인 주소 텍스트 분석기야. 입력된 문장에서 "지도 검색용 핵심 키워드"와 "상세 정보"를 정확히 분리해줘.
                        
                        [규칙]
                        1. search_query: 지도 API가 인식할 수 있는 핵심 주소 (지번, 아파트명, 도로명). 동/호수나 "층", "입니다" 같은 불필요한 말은 절대 넣지 마.
                        2. details: 나머지 상세 정보 (건물명, 동, 호수, 층수 등).
                        3. 절대로 주소를 창조하거나 추측해서 도로명 주소를 만들지 마. 있는 그대로 분리만 해.

                        [예시]
                        입력: "순천시 조례동 1598-1 나라타워 8층입니다"
                        출력: { "search_query": "순천시 조례동 1598-1", "details": "나라타워 8층" }
                        
                        입력: "서울 서초구 방배삼호 1차 2동 716호"
                        출력: { "search_query": "서울 서초구 방배삼호 1차", "details": "2동 716호" }

                        입력: "${rawInput}"
                        출력 포맷: JSON
                    `;

                    const geminiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const geminiData = await geminiResponse.json();
                    if (geminiData.error) throw new Error("AI 분석 오류: " + geminiData.error.message);

                    let aiText = geminiData.candidates[0].content.parts[0].text;
                    const jsonMatch = aiText.match(/\{[\s\S]*\}/); // JSON 부분만 추출
                    const parsedAI = JSON.parse(jsonMatch ? jsonMatch[0] : aiText);

                    const searchQuery = parsedAI.search_query;
                    const detailsFromAI = parsedAI.details;

                    // -----------------------------------------------------------
                    // 2단계: Kakao API로 정확한 도로명 주소 찾기 (검증)
                    // -----------------------------------------------------------
                    const kakaoResponse = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(searchQuery)}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `KakaoAK ${KAKAO_API_KEY}` // 제공해주신 REST API 키 사용
                        }
                    });

                    const kakaoData = await kakaoResponse.json();

                    // -----------------------------------------------------------
                    // 3단계: 결과 합치기
                    // -----------------------------------------------------------
                    if (kakaoData.documents && kakaoData.documents.length > 0) {
                        const bestMatch = kakaoData.documents[0];
                        
                        // 카카오가 알려준 정확한 도로명 주소 (없으면 지번 주소)
                        const officialAddress = bestMatch.road_address_name || bestMatch.address_name;
                        const placeName = bestMatch.place_name;

                        setParsedAddress(officialAddress);

                        // 상세 정보 조합하기
                        let finalDetails = detailsFromAI;

                        // 카카오가 찾은 장소명(예: 나라타워)이 상세정보에 빠져있다면 추가해줌
                        if (placeName && !finalDetails.includes(placeName) && !searchQuery.includes(placeName)) {
                            finalDetails = `${placeName} ${finalDetails}`;
                        }
                        // 원래 입력했던 내용이 너무 많이 생략됐다면 괄호로 참고용 추가
                        if (!finalDetails.trim()) {
                             finalDetails = rawInput.replace(searchQuery, "").trim();
                        }

                        setParsedDetails(finalDetails.trim());
                    } else {
                        // 검색 결과가 없을 때 (신축이거나 오타 등) -> AI가 분석한 그대로 입력
                        // alert("정확한 주소를 찾지 못해 입력된 내용을 기반으로 채웁니다.");
                        setParsedAddress(searchQuery);
                        setParsedDetails(detailsFromAI);
                    }

                } catch (error) {
                    console.error(error);
                    alert(`처리 중 문제가 발생했습니다: ${error.message}`);
                } finally {
                    setIsProcessing(false);
                }
            };

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const days = new Date(year, month + 1, 0).getDate();
                return Array.from({ length: days }, (_, i) => i + 1);
            };

            const toggleDate = (day) => {
                const dateStr = `${currentDateView.getFullYear()}-${String(currentDateView.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if (selectedDates.includes(dateStr)) setSelectedDates(selectedDates.filter(d => d !== dateStr));
                else setSelectedDates([...selectedDates, dateStr].sort());
            };

            const changeMonth = (offset) => setCurrentDateView(new Date(currentDateView.setMonth(currentDateView.getMonth() + offset)));

            const handleSaveJob = () => {
                if (!parsedAddress) return alert("주소를 입력해주세요.");
                
                const jobData = {
                    address: parsedAddress,
                    details: parsedDetails,
                    dates: selectedDates,
                    createdAt: editingId ? jobs[editingId].createdAt : Date.now()
                };

                if (editingId) {
                    set(ref(database, `jobs/${editingId}`), jobData)
                        .then(() => {
                            alert("수정이 완료되었습니다!");
                            resetForm();
                        })
                        .catch((error) => alert("수정 실패: " + error.message));
                } else {
                    push(ref(database, 'jobs'), jobData)
                        .then(() => {
                            alert("저장 완료!");
                            resetForm();
                        })
                        .catch((error) => alert("저장 실패: " + error.message));
                }
            };

            const handleEditStart = (job) => {
                setEditingId(job.key);
                setRawInput('');
                setParsedAddress(job.address);
                setParsedDetails(job.details || '');
                setSelectedDates(job.dates || []);
                if (inputSectionRef.current) {
                    inputSectionRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            };

            const resetForm = () => {
                setRawInput('');
                setParsedAddress('');
                setParsedDetails('');
                setSelectedDates([]);
                setEditingId(null);
            };

            const handleDeleteJob = (id) => {
                if (confirm("삭제하시겠습니까?")) {
                    remove(ref(database, `jobs/${id}`));
                    if (editingId === id) resetForm();
                }
            };

            const openMap = (type, address) => {
                const encodedAddr = encodeURIComponent(address);
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

                if (type === 'naver') {
                    if (isMobile) {
                        window.location.href = `nmap://search?query=${encodedAddr}&appname=com.plumber.addressbook`;
                    } else {
                        window.open(`https://map.naver.com/v5/search/${encodedAddr}`, '_blank');
                    }
                } 
                else if (type === 'tmap') {
                    if (isMobile) {
                        window.location.href = `tmap://search?name=${encodedAddr}`;
                    } else {
                        alert("티맵은 모바일에서만 가능합니다.");
                    }
                } 
                else if (type === 'kakao') {
                    const url = `https://map.kakao.com/link/search/${encodedAddr}`;
                    window.open(url, '_blank') || (window.location.href = url);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-50 pb-20">
                    <header className="bg-white px-6 py-5 sticky top-0 z-30 shadow-sm flex items-center justify-between">
                        <div>
                            <h1 className="text-xl font-extrabold text-slate-800 flex items-center gap-2.5 tracking-tight">
                                <div className="bg-blue-600 p-1.5 rounded-lg text-white shadow-blue-200 shadow-md">
                                    <Wrench className="w-5 h-5" />
                                </div>
                                설비 작업 주소록
                            </h1>
                        </div>
                    </header>

                    <main className="p-5 space-y-6">
                        <section className="space-y-4">
                            <h2 className="text-lg font-bold text-slate-800 px-1 flex items-center gap-2">
                                <ClipboardList className="w-5 h-5 text-slate-400" />
                                작업 일정 목록 <span className="text-slate-400 text-sm font-normal">({sortedJobs.length})</span>
                            </h2>
                            
                            {sortedJobs.length === 0 ? (
                                <div className="text-center py-12 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                                    <div className="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <Calendar className="w-6 h-6 text-slate-300" />
                                    </div>
                                    <p className="text-slate-400 text-sm">등록된 일정이 없습니다.</p>
                                </div>
                            ) : (
                                sortedJobs.map((job) => {
                                    const isInactive = job.type !== 'active';
                                    const isEditing = editingId === job.key;
                                    
                                    return (
                                    <div key={job.key} className={`rounded-2xl p-5 shadow-sm border transition-all ${isEditing ? 'ring-2 ring-blue-500 border-blue-500 bg-blue-50' : (isInactive ? 'bg-slate-50 border-slate-200 opacity-90' : 'bg-white border-blue-100 ring-1 ring-blue-50 hover:shadow-md')}`}>
                                        <div className="flex flex-wrap gap-1.5 mb-3 items-start">
                                            {(!job.dates || job.dates.length === 0) ? (
                                                <span className="inline-flex items-center px-2.5 py-1 rounded-md bg-slate-200 text-slate-500 text-xs font-bold">
                                                    <AlertCircle className="w-3 h-3 mr-1" /> 날짜 미정
                                                </span>
                                            ) : (
                                                job.dates.map((d, i) => {
                                                    const isPast = d < todayStr;
                                                    return (
                                                        <span key={i} className={`inline-flex items-center px-2 py-1 rounded-md text-xs font-bold ${isPast ? 'bg-slate-200 text-slate-500 line-through decoration-slate-400' : 'bg-slate-800 text-white'}`}>
                                                            <Calendar className="w-3 h-3 mr-1 opacity-70" />
                                                            {d.slice(5)} ({getDayOfWeekFromStr(d)})
                                                        </span>
                                                    )
                                                })
                                            )}
                                            <div className="ml-auto flex gap-1">
                                                <button onClick={() => handleEditStart(job)} className={`p-1.5 rounded-md transition-colors ${isEditing ? 'bg-blue-200 text-blue-700' : 'text-slate-400 hover:bg-slate-100 hover:text-blue-600'}`}>
                                                    <Edit2 className="w-3.5 h-3.5" />
                                                </button>
                                                <button onClick={() => handleDeleteJob(job.key)} className="p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors">
                                                    <Trash2 className="w-3.5 h-3.5" />
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="mb-4 pl-1">
                                            <h3 className={`text-base font-bold leading-tight mb-1.5 ${isInactive ? 'text-slate-600' : 'text-slate-800'}`}>{job.address}</h3>
                                            {job.details && (
                                                <p className="text-sm text-slate-500 bg-white p-2.5 rounded-lg border border-slate-100 leading-relaxed shadow-sm">
                                                    {job.details}
                                                </p>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => openMap('naver', job.address)} className="bg-white border border-slate-200 hover:bg-green-50 hover:border-green-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-sm group">
                                                <NaverIcon />
                                                <span className="text-[11px] font-bold text-slate-600 mt-1 group-hover:text-[#03C75A] transition-colors">네이버</span>
                                            </button>
                                            <button onClick={() => openMap('tmap', job.address)} className="bg-white border border-slate-200 hover:bg-red-50 hover:border-red-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-sm group">
                                                <TMapIcon />
                                                <span className="text-[11px] font-bold text-slate-600 mt-1 group-hover:text-[#E80048] transition-colors">티맵</span>
                                            </button>
                                            <button onClick={() => openMap('kakao', job.address)} className="bg-white border border-slate-200 hover:bg-yellow-50 hover:border-yellow-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-sm group">
                                                <KakaoIcon />
                                                <span className="text-[11px] font-bold text-slate-600 mt-1 group-hover:text-[#F9C000] transition-colors">카카오</span>
                                            </button>
                                        </div>
                                    </div>
                                    )
                                })
                            )}
                        </section>

                        <div className="dashed-line h-px w-full my-4"></div>

                        <section ref={inputSectionRef} className={`rounded-3xl p-5 shadow-sm border relative overflow-hidden transition-colors ${editingId ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100'}`}>
                            <div className={`absolute top-0 right-0 w-16 h-16 rounded-bl-full -mr-8 -mt-8 opacity-50 ${editingId ? 'bg-blue-200' : 'bg-blue-50'}`}></div>
                            
                            <h2 className={`text-sm font-bold mb-3 flex items-center gap-2 ${editingId ? 'text-blue-700' : 'text-slate-500'}`}>
                                {editingId ? (
                                    <>
                                        <span className="bg-blue-600 text-white px-2 py-0.5 rounded-md text-xs">EDIT</span>
                                        작업 내용 수정
                                    </>
                                ) : (
                                    <>
                                        <span className="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-md text-xs">NEW</span>
                                        새 작업 등록
                                    </>
                                )}
                            </h2>
                            
                            <label className="block text-xs font-bold text-slate-400 mb-2 ml-1">1. 주소 입력</label>
                            <textarea 
                                className="w-full p-4 bg-white rounded-2xl text-slate-700 text-sm border border-slate-200 focus:ring-2 focus:ring-blue-500 transition-all resize-none h-20 mb-3 leading-relaxed placeholder:text-slate-400 outline-none"
                                placeholder={editingId ? "수정할 때는 주소나 내용을 아래 칸에서 직접 고치셔도 됩니다." : "문자 내용을 여기에 붙여넣으세요."}
                                value={rawInput}
                                onChange={(e) => setRawInput(e.target.value)}
                            />
                            
                            <button 
                                onClick={handleHybridSearch}
                                disabled={isProcessing || !rawInput}
                                className="w-full py-3 bg-slate-800 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition-custom shadow-lg shadow-slate-200 disabled:opacity-50 mb-5"
                            >
                                {isProcessing ? <Loader2 className="animate-spin w-4 h-4" /> : <SearchCheck className="w-4 h-4" />}
                                {isProcessing ? "AI 분석 & 지도 검색 중..." : "AI 정밀 주소 변환"}
                            </button>

                            <div className="mb-5 space-y-2">
                                <div className="relative">
                                    <MapPin className="w-4 h-4 absolute left-3 top-3.5 text-blue-500" />
                                    <input 
                                        type="text" 
                                        className="w-full pl-9 pr-3 py-3 bg-white rounded-xl text-sm font-bold text-slate-800 border border-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                                        value={parsedAddress}
                                        onChange={(e) => setParsedAddress(e.target.value)}
                                        placeholder="주소 (도로명으로 자동 변환됩니다)"
                                    />
                                </div>
                                <div className="relative">
                                    <CheckCircle2 className="w-4 h-4 absolute left-3 top-3.5 text-slate-400" />
                                    <input 
                                        type="text" 
                                        className="w-full pl-9 pr-3 py-3 bg-white rounded-xl text-sm text-slate-600 border border-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                                        value={parsedDetails}
                                        onChange={(e) => setParsedDetails(e.target.value)}
                                        placeholder="상세 내용"
                                    />
                                </div>
                            </div>

                            <div className="h-px bg-slate-200 w-full mb-4"></div>

                            <label className="block text-xs font-bold text-slate-400 mb-2 ml-1">2. 날짜 선택 (선택사항)</label>
                            
                            <div className="mb-4 bg-white rounded-2xl p-3 border border-slate-200">
                                <div className="flex justify-between items-center mb-3 px-1">
                                    <button onClick={() => changeMonth(-1)} className="text-slate-400 hover:text-slate-800 p-1">◀</button>
                                    <span className="font-bold text-sm text-slate-700">
                                        {currentDateView.getFullYear()}.{String(currentDateView.getMonth() + 1).padStart(2, '0')}
                                    </span>
                                    <button onClick={() => changeMonth(1)} className="text-slate-400 hover:text-slate-800 p-1">▶</button>
                                </div>
                                <div className="grid grid-cols-7 gap-1 text-center">
                                    {['일','월','화','수','목','금','토'].map((d,i) => (
                                        <div key={d} className={`text-[10px] ${i===0?'text-red-400':i===6?'text-blue-400':'text-slate-400'}`}>{d}</div>
                                    ))}
                                    {Array.from({ length: new Date(currentDateView.getFullYear(), currentDateView.getMonth(), 1).getDay() }).map((_, i) => <div key={`e-${i}`} />)}
                                    {getDaysInMonth(currentDateView).map(day => {
                                        const dateStr = `${currentDateView.getFullYear()}-${String(currentDateView.getMonth() + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                                        const isSelected = selectedDates.includes(dateStr);
                                        const isToday = dateStr === todayStr;
                                        
                                        return (
                                            <button
                                                key={day}
                                                onClick={() => toggleDate(day)}
                                                className={`h-8 rounded-lg text-xs font-medium transition-all ${isSelected ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'} ${isToday && !isSelected ? 'text-blue-600 font-bold ring-1 ring-blue-200' : ''}`}
                                            >
                                                {day}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                            
                            {selectedDates.length > 0 && (
                                <div className="flex flex-wrap gap-1.5 mb-4">
                                    {selectedDates.map(date => (
                                        <span key={date} className="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded font-bold">
                                            {date.slice(5)}
                                        </span>
                                    ))}
                                </div>
                            )}

                            <div className="flex gap-3">
                                <button 
                                    onClick={resetForm} 
                                    className="flex-1 py-3 bg-white border border-slate-200 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-50 transition-colors flex items-center justify-center gap-1"
                                >
                                    {editingId ? <><X className="w-4 h-4"/> 취소</> : '초기화'}
                                </button>
                                <button 
                                    onClick={handleSaveJob} 
                                    className={`flex-[2] py-3 rounded-xl font-bold text-sm shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 ${editingId ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-200' : 'bg-slate-800 hover:bg-slate-900 text-white shadow-slate-200'}`}
                                >
                                    <Save className="w-4 h-4" /> 
                                    {editingId ? '수정 완료' : (selectedDates.length > 0 ? '일정 저장' : '날짜 미정 저장')}
                                </button>
                            </div>
                        </section>
                        
                        <div className="h-10"></div>
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
