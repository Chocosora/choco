<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>설비 작업 주소록</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.378.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"
        }
    }
    </script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            font-family: 'Pretendard', sans-serif;
            background-color: #F3F4F6;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .transition-custom { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Calendar, MapPin, Navigation, Save, Trash2, Wand2, Loader2, Wrench, CheckCircle2, ClipboardList } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, push, onValue, remove, set } from 'firebase/database';

        // --- Firebase 설정 ---
        const firebaseConfig = {
            apiKey: "AIzaSyC4FWP-jskItmNA4SVP-kDGA1gL_U85asw",
            authDomain: "chocosora-ad4df.firebaseapp.com",
            databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com",
            projectId: "chocosora-ad4df",
            storageBucket: "chocosora-ad4df.firebasestorage.app",
            messagingSenderId: "798065461606",
            appId: "1:798065461606:web:fcc2308eae7a71e8f360a7",
            measurementId: "G-4FYC7HVNNV"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const GEMINI_API_KEY = "AIzaSyAGWa2e3bhyn0zKyL8szNFS8-7XMwXrCl8";

        // --- 아이콘 컴포넌트 ---
        const NaverIcon = () => (
            <div className="w-6 h-6 rounded-md bg-[#03C75A] flex items-center justify-center overflow-hidden shadow-sm">
                <span className="text-white font-extrabold text-lg leading-none pt-0.5">N</span>
            </div>
        );

        // [수정됨] 깔끔한 그라데이션 T 모양으로 변경
        const TMapIcon = () => (
            <div className="w-6 h-6 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6C4 4.89543 4.89543 4 6 4H18C19.1046 4 20 4.89543 20 6" stroke="url(#tmap_grad_h)" strokeWidth="5" strokeLinecap="round"/>
                    <path d="M12 4V20" stroke="url(#tmap_grad_v)" strokeWidth="5" strokeLinecap="round"/>
                    <defs>
                        <linearGradient id="tmap_grad_h" x1="4" y1="4" x2="20" y2="4" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#FF0050"/>
                            <stop offset="1" stopColor="#0075FF"/>
                        </linearGradient>
                        <linearGradient id="tmap_grad_v" x1="12" y1="4" x2="12" y2="20" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#FF0050"/>
                            <stop offset="1" stopColor="#0075FF"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        );

        const KakaoIcon = () => (
            <div className="w-6 h-6 rounded-full bg-[#FEE500] flex items-center justify-center overflow-hidden border border-[#FEE500] shadow-sm">
                <MapPin className="w-3.5 h-3.5 text-[#191919] fill-[#191919]" />
            </div>
        );


        // --- 헬퍼 함수 ---
        const getDayOfWeek = (year, month, day) => ['일', '월', '화', '수', '목', '금', '토'][new Date(year, month, day).getDay()];
        const getDayOfWeekFromStr = (dateStr) => ['일', '월', '화', '수', '목', '금', '토'][new Date(dateStr).getDay()];

        const App = () => {
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            const [rawInput, setRawInput] = useState('');
            const [parsedAddress, setParsedAddress] = useState('');
            const [parsedDetails, setParsedDetails] = useState('');
            
            const [selectedDates, setSelectedDates] = useState([]); 
            
            const [isProcessing, setIsProcessing] = useState(false);
            const [jobs, setJobs] = useState({});
            const [currentDateView, setCurrentDateView] = useState(new Date());

            useEffect(() => {
                const jobsRef = ref(database, 'jobs');
                return onValue(jobsRef, (snapshot) => setJobs(snapshot.val() || {}));
            }, []);

            const handleAIParse = async () => {
                if (!rawInput.trim()) return;
                setIsProcessing(true);
                try {
                    const prompt = `
                        너는 전문적인 주소 분석기야. 입력된 텍스트에서 '네비게이션용 주소'와 '상세 정보'를 정확히 분리해줘.

                        [필수 규칙]
                        1. address (네비게이션용): 
                           - 오직 "시/도 + 시/군/구 + 읍/면/동 + 도로명/지번 + 건물번호" 까지만 추출해.
                           - 건물명, 호수, 층수는 절대 address에 포함하지 마. 네비게이션이 인식 못해.
                           - 예: "경기 양평군 서종면 북한강로 819 2층" -> "경기 양평군 서종면 북한강로 819"

                        2. details (상세 정보):
                           - address에 포함되지 않은 나머지 정보(상호명, 건물명, 층수, 호수, 고객 요청사항 등)를 모두 정리해서 적어줘.
                           - 주소 앞에 붙은 상호명(예: "대치 나 영어학원")도 여기에 포함시켜.

                        3. 출력은 오직 JSON 포맷으로만 해줘.

                        입력 텍스트:
                        ${rawInput}

                        JSON 포맷:
                        { "address": "...", "details": "..." }
                    `;
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    let text = data.candidates[0].content.parts[0].text;
                    const jsonMatch = text.match(/\{[\s\S]*\}/);
                    const result = JSON.parse(jsonMatch ? jsonMatch[0] : text);
                    setParsedAddress(result.address || "");
                    setParsedDetails(result.details || "");
                } catch (error) {
                    alert(`분석 실패: ${error.message}`);
                } finally {
                    setIsProcessing(false);
                }
            };

            // 달력 관련
            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const days = new Date(year, month + 1, 0).getDate();
                return Array.from({ length: days }, (_, i) => i + 1);
            };

            const toggleDate = (day) => {
                const dateStr = `${currentDateView.getFullYear()}-${String(currentDateView.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if (selectedDates.includes(dateStr)) setSelectedDates(selectedDates.filter(d => d !== dateStr));
                else setSelectedDates([...selectedDates, dateStr].sort());
            };

            const changeMonth = (offset) => setCurrentDateView(new Date(currentDateView.setMonth(currentDateView.getMonth() + offset)));

            const handleSaveJob = () => {
                if (!parsedAddress || selectedDates.length === 0) return alert("주소와 날짜를 확인해주세요.");
                push(ref(database, 'jobs'), {
                    address: parsedAddress,
                    details: parsedDetails,
                    dates: selectedDates,
                    createdAt: Date.now()
                }).then(() => {
                    alert("저장 완료!");
                    setRawInput(''); setParsedAddress(''); setParsedDetails(''); setSelectedDates([]);
                });
            };

            const handleDeleteJob = (id) => confirm("삭제하시겠습니까?") && remove(ref(database, `jobs/${id}`));

            const openMap = (type, address) => {
                let url = '';
                const encodedAddr = encodeURIComponent(address);
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

                if (type === 'naver') {
                    url = `https://map.naver.com/v5/search/${encodedAddr}`;
                } else if (type === 'tmap') {
                    url = isMobile ? `tmap://search?name=${encodedAddr}` : '';
                    if (!isMobile) return alert("티맵은 모바일에서만 가능합니다.");
                } else if (type === 'kakao') {
                    // 카카오맵 URL 스킴 (모바일) 또는 웹 검색
                    url = `https://map.kakao.com/link/search/${encodedAddr}`;
                }
                
                window.open(url, '_blank') || (window.location.href = url);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-50 pb-20">
                    {/* 헤더 */}
                    <header className="bg-white px-6 py-5 sticky top-0 z-30 shadow-sm flex items-center justify-between">
                        <div>
                            <h1 className="text-xl font-extrabold text-slate-800 flex items-center gap-2.5 tracking-tight">
                                <div className="bg-blue-600 p-1.5 rounded-lg text-white shadow-blue-200 shadow-md">
                                    <Wrench className="w-5 h-5" />
                                </div>
                                설비 작업 주소록
                            </h1>
                        </div>
                    </header>

                    <main className="p-5 space-y-6">
                        
                        {/* 1. 입력 카드 */}
                        <section className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                            <h2 className="text-sm font-bold text-slate-500 mb-3 flex items-center gap-2">
                                <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-xs">STEP 1</span>
                                주소 입력
                            </h2>
                            
                            <textarea 
                                className="w-full p-4 bg-slate-50 rounded-2xl text-slate-700 text-sm border-0 focus:ring-2 focus:ring-blue-500 transition-all resize-none h-24 mb-3 leading-relaxed placeholder:text-slate-400"
                                placeholder="문자 내용을 여기에 붙여넣으세요."
                                value={rawInput}
                                onChange={(e) => setRawInput(e.target.value)}
                            />
                            
                            <button 
                                onClick={handleAIParse}
                                disabled={isProcessing || !rawInput}
                                className="w-full py-3.5 bg-slate-800 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition-custom shadow-lg shadow-slate-200 disabled:opacity-50 disabled:shadow-none"
                            >
                                {isProcessing ? <Loader2 className="animate-spin w-4 h-4" /> : <Wand2 className="w-4 h-4" />}
                                {isProcessing ? "분석 중..." : "AI 주소 자동 분석"}
                            </button>

                            {(parsedAddress || parsedDetails) && (
                                <div className="mt-4 space-y-2 animate-[fadeIn_0.3s_ease-in-out]">
                                    <div className="relative">
                                        <MapPin className="w-4 h-4 absolute left-3 top-3.5 text-blue-500" />
                                        <input 
                                            type="text" 
                                            className="w-full pl-9 pr-3 py-3 bg-blue-50 rounded-xl text-sm font-bold text-slate-800 border border-blue-100 focus:outline-none"
                                            value={parsedAddress}
                                            onChange={(e) => setParsedAddress(e.target.value)}
                                            placeholder="주소"
                                        />
                                    </div>
                                    <div className="relative">
                                        <CheckCircle2 className="w-4 h-4 absolute left-3 top-3.5 text-slate-400" />
                                        <input 
                                            type="text" 
                                            className="w-full pl-9 pr-3 py-3 bg-white rounded-xl text-sm text-slate-600 border border-slate-200 focus:outline-none"
                                            value={parsedDetails}
                                            onChange={(e) => setParsedDetails(e.target.value)}
                                            placeholder="상세 내용"
                                        />
                                    </div>
                                </div>
                            )}
                        </section>

                        {/* 2. 달력 카드 */}
                        <section className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                            <h2 className="text-sm font-bold text-slate-500 mb-3 flex items-center gap-2">
                                <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-xs">STEP 2</span>
                                날짜 선택
                            </h2>

                            <div className="mb-4">
                                <div className="flex justify-between items-center mb-4 px-2">
                                    <button onClick={() => changeMonth(-1)} className="text-slate-400 hover:text-slate-800 p-1">◀</button>
                                    <span className="font-extrabold text-lg text-slate-800">
                                        {currentDateView.getFullYear()}.{String(currentDateView.getMonth() + 1).padStart(2, '0')}
                                    </span>
                                    <button onClick={() => changeMonth(1)} className="text-slate-400 hover:text-slate-800 p-1">▶</button>
                                </div>

                                <div className="grid grid-cols-7 gap-y-3 gap-x-1 text-center">
                                    {['일','월','화','수','목','금','토'].map((d,i) => (
                                        <div key={d} className={`text-xs font-medium ${i===0?'text-red-400':i===6?'text-blue-400':'text-slate-400'}`}>{d}</div>
                                    ))}
                                    
                                    {Array.from({ length: new Date(currentDateView.getFullYear(), currentDateView.getMonth(), 1).getDay() }).map((_, i) => <div key={`e-${i}`} />)}
                                    
                                    {getDaysInMonth(currentDateView).map(day => {
                                        const dateStr = `${currentDateView.getFullYear()}-${String(currentDateView.getMonth() + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                                        const isSelected = selectedDates.includes(dateStr);
                                        const isToday = dateStr === todayStr;
                                        const dow = getDayOfWeek(currentDateView.getFullYear(), currentDateView.getMonth(), day);
                                        
                                        return (
                                            <button
                                                key={day}
                                                onClick={() => toggleDate(day)}
                                                className="flex flex-col items-center justify-center relative h-10"
                                            >
                                                <div className={`
                                                    w-8 h-8 flex items-center justify-center rounded-full text-sm font-medium transition-all
                                                    ${isSelected ? 'bg-blue-600 text-white shadow-md scale-110 z-10' : 'text-slate-600 hover:bg-slate-100'}
                                                    ${!isSelected && isToday ? 'ring-2 ring-blue-300 text-blue-600 font-bold' : ''}
                                                `}>
                                                    {day}
                                                </div>
                                                <span className={`text-[9px] mt-0.5 leading-none ${isSelected ? 'text-blue-600 font-bold' : 'text-slate-300'}`}>
                                                    {dow}
                                                </span>
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>

                            {selectedDates.length > 0 && (
                                <div className="flex flex-wrap gap-2 mb-4">
                                    {selectedDates.map(date => (
                                        <span key={date} className="text-xs bg-blue-50 text-blue-600 border border-blue-100 px-2 py-1 rounded-lg font-bold">
                                            {date.split('-').slice(1).join('/')}({getDayOfWeekFromStr(date)})
                                        </span>
                                    ))}
                                </div>
                            )}

                            <div className="flex gap-3">
                                <button 
                                    onClick={() => { setRawInput(''); setParsedAddress(''); setParsedDetails(''); setSelectedDates([]); }} 
                                    className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-200 transition-colors"
                                >
                                    초기화
                                </button>
                                <button 
                                    onClick={handleSaveJob} 
                                    className="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-bold text-sm hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-2"
                                >
                                    <Save className="w-4 h-4" /> 일정 저장
                                </button>
                            </div>
                        </section>

                        {/* 3. 목록 리스트 */}
                        <section className="space-y-4">
                            <h2 className="text-lg font-bold text-slate-800 px-1 flex items-center gap-2">
                                <ClipboardList className="w-5 h-5 text-slate-400" />
                                저장된 일정 <span className="text-slate-400 text-sm font-normal">({Object.keys(jobs).length})</span>
                            </h2>
                            
                            {Object.entries(jobs).length === 0 ? (
                                <div className="text-center py-12 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                                    <div className="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <Calendar className="w-6 h-6 text-slate-300" />
                                    </div>
                                    <p className="text-slate-400 text-sm">아직 저장된 작업이 없습니다.</p>
                                </div>
                            ) : (
                                Object.entries(jobs).sort((a, b) => b[1].createdAt - a[1].createdAt).map(([key, job]) => (
                                    <div key={key} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition-all">
                                        {/* 날짜 뱃지 */}
                                        <div className="flex flex-wrap gap-1.5 mb-3">
                                            {job.dates && job.dates.map((d, i) => (
                                                <span key={i} className="inline-flex items-center px-2 py-1 rounded-md bg-slate-800 text-white text-xs font-bold">
                                                    <Calendar className="w-3 h-3 mr-1 opacity-70" />
                                                    {d.slice(5)} ({getDayOfWeekFromStr(d)})
                                                </span>
                                            ))}
                                            <button onClick={() => handleDeleteJob(key)} className="ml-auto text-slate-300 hover:text-red-500 p-1">
                                                <Trash2 className="w-4 h-4" />
                                            </button>
                                        </div>
                                        
                                        {/* 내용 */}
                                        <div className="mb-4 pl-1">
                                            <h3 className="text-base font-bold text-slate-800 leading-tight mb-1.5">{job.address}</h3>
                                            {job.details && (
                                                <p className="text-sm text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-100 leading-relaxed">
                                                    {job.details}
                                                </p>
                                            )}
                                        </div>

                                        {/* 지도 버튼 그룹 (3분할) */}
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => openMap('naver', job.address)} className="bg-white border border-slate-200 hover:bg-green-50 hover:border-green-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-sm group">
                                                <NaverIcon />
                                                <span className="text-[11px] font-bold text-slate-600 mt-1 group-hover:text-[#03C75A] transition-colors">네이버</span>
                                            </button>
                                            <button onClick={() => openMap('tmap', job.address)} className="bg-white border border-slate-200 hover:bg-red-50 hover:border-red-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-sm group">
                                                <TMapIcon />
                                                <span className="text-[11px] font-bold text-slate-600 mt-1 group-hover:text-[#E80048] transition-colors">티맵</span>
                                            </button>
                                            <button onClick={() => openMap('kakao', job.address)} className="bg-white border border-slate-200 hover:bg-yellow-50 hover:border-yellow-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-sm group">
                                                <KakaoIcon />
                                                <span className="text-[11px] font-bold text-slate-600 mt-1 group-hover:text-[#F9C000] transition-colors">카카오</span>
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </section>
                        <div className="h-10"></div>
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
