<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역대회 버스 출석부</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #6c7b8a 0%, #8a94a6 100%);
            padding: 25px 20px;
            text-align: center;
            color: white;
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            padding: 25px 20px;
        }
        .session-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }
        .session-tab {
            padding: 15px 12px;
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .session-tab:hover {
            border-color: #8a94a6;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 148, 166, 0.2);
        }
        .session-tab.active {
            background: linear-gradient(135deg, #8a94a6 0%, #9ca6b8 100%);
            border-color: #8a94a6;
            color: white;
        }
        .session-info {
            font-weight: 700;
            font-size: 16px;
            line-height: 1.3;
            white-space: nowrap;
        }
        .session-count {
            position: absolute;
            top: 4px;
            right: 6px;
            background: rgba(255,255,255,0.9);
            color: #333;
            border-radius: 10px;
            padding: 2px 5px;
            font-size: 10px;
            font-weight: 600;
        }
        .session-tab.active .session-count {
            background: rgba(255,255,255,0.9);
            color: #8a94a6;
        }
        .attendance-section {
            margin-top: 20px;
        }
        .session-header {
            background: linear-gradient(135deg, #8a94a6 0%, #9ca6b8 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(138, 148, 166, 0.3);
        }
        .session-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .session-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .stat-number.total { color: #333; }
        .stat-number.boarded { color: #00b894; }
        .stat-number.not-boarded { color: #e84393; }
        .stat-label {
            font-size: 11px;
            color: #666;
            font-weight: 500;
        }
        .not-boarded-names-container {
            background: #fff8f8;
            border: 1px solid #ffe0e0;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }
        .not-boarded-title {
            font-weight: 600;
            font-size: 14px;
            color: #d63031;
            margin-bottom: 8px;
        }
        .names-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .name-tag {
            background: #ffe0e0;
            color: #c23616;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }
        .checklist-container {
            background: white;
            border-radius: 12px;
            border: 1px solid #e1e5e9;
        }
        .checklist-header {
            display: grid;
            grid-template-columns: 1fr 80px;
            gap: 10px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e1e5e9;
            border-radius: 12px 12px 0 0;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .checklist-item {
            display: grid;
            grid-template-columns: 1fr 80px;
            gap: 10px;
            padding: 12px 20px;
            border-bottom: 1px solid #f1f3f4;
            align-items: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .checklist-item:last-child {
            border-bottom: none;
            border-radius: 0 0 12px 12px;
        }
        .checklist-item:hover {
            background: #f8f9fa;
        }
        .checklist-item.boarded {
            background: linear-gradient(90deg, #e6fff9 0%, rgba(0,184,148,0.05) 100%);
            border-left: 4px solid #00b894;
        }
        .student-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .student-name {
            font-weight: 500;
            font-size: 15px;
            color: #333;
        }
        .leader-name {
            color: #007bff;
            font-weight: 700;
        }
        .checklist-item.boarded .student-name {
            color: #333;
            font-weight: 600;
        }
        .call-btn {
            text-decoration: none;
            font-size: 18px;
            padding: 4px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }
        .call-btn:hover {
            background-color: #e0e0e0;
        }
        .checkbox-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .attendance-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: white;
        }
        .attendance-checkbox.boarded {
            background: #00b894;
            border-color: #00b894;
            color: white;
        }
        .checkbox-icon {
            font-size: 12px;
            font-weight: bold;
        }
        .no-session {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .no-session h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }
            .content {
                padding: 20px 15px;
            }
            .session-tabs {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                margin-bottom: 20px;
            }
            .session-tab {
                padding: 12px 8px;
            }
            .session-info {
                font-size: 15px;
                font-weight: 700;
            }
            .session-count {
                top: 3px;
                right: 5px;
                font-size: 11px;
                padding: 2px 6px;
            }
            .session-header {
                padding: 12px 15px;
                margin-bottom: 15px;
            }
            .session-title {
                font-size: 16px;
            }
            .session-subtitle {
                font-size: 13px;
            }
            .stats-bar {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 12px;
            }
            .checklist-header,
            .checklist-item {
                grid-template-columns: 1fr 70px;
                gap: 8px;
                padding: 12px 15px;
            }
            .student-name {
                font-size: 16px;
            }
            .call-btn {
                font-size: 16px;
                width: 28px;
                height: 28px;
            }
            .attendance-checkbox {
                width: 22px;
                height: 22px;
            }
        }

        /* 더 작은 모바일 화면 */
        @media (max-width: 480px) {
            .session-tabs {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .session-tab {
                padding: 12px 10px;
            }
            .session-info {
                font-size: 14px;
                font-weight: 700;
            }
            .checklist-header,
            .checklist-item {
                grid-template-columns: 1fr 60px;
                gap: 6px;
                padding: 10px 12px;
            }
            .student-name {
                font-size: 15px;
            }
        }
    </style>
</head>

            { name: '이명희 자매', phone: '010-5612-7753' },
            { name: '이상옥 자매', phone: '010-2371-3747' },
            { name: '이철호 형제', phone: '010-3930-6573' },
            { name: '정윤두 형제', phone: '010-2381-2635' },

        ].sort((a, b) => a.name.localeCompare(b.name, 'ko-KR'));

        const returnOnlyRoster = [
            { name: '강소영 자매', phone: '010-4473-7795' },
            { name: '서존 형제', phone: '010-9510-7795' }
        ].sort((a, b) => a.name.localeCompare(b.name, 'ko-KR'));

        const schedule = {
            '8/15': ['권오훈 형제', '김춘옥 자매', '이우혁 형제', '정영휘 자매', '조병일 형제', '지부연 자매', '최승연 자매', '강진원 형제', '계은경 자매', '곽영희 자매', '노남숙 자매', '노연화 자매', '박동준 형제', '이명희 자매', '이상옥 자매', '이철호 형제', '정윤두 형제', '최성은 자매', '최화순 자매', '현진선 자매'],
            '8/16': ['권오훈 형제', '김춘옥 자매', '이우혁 형제', '정영휘 자매', '조병일 형제', '지부연 자매', '최승연 자매', '강진원 형제', '곽영희 자매', '노남숙 자매', '신동순 자매', '이명희 자매', '정윤두 형제', '최성은 자매', '최화순 자매', '현진선 자매', '서존 형제'],
            '8/17': ['권오훈 형제', '김춘옥 자매', '정영휘 자매', '조병일 형제', '지부연 자매', '최승연 자매', '강진원 형제', '계은경 자매', '곽영희 자매', '노남숙 자매', '신동순 자매', '이명희 자매', '이철호 형제', '정윤두 형제', '최성은 자매', '최화순 자매', '현진선 자매', '강소영 자매']
        };

        const leaders = {
            '강일주민센터': '조병일 형제',
            '미사역': '정윤두 형제'
        };

        let attendanceData = {};
        let currentSession = null;
        const attendanceDbRef = ref(database, 'bus-attendance');

        window.selectSession = selectSession;
        window.toggleAttendance = toggleAttendance;

        function getRoster(sessionId) {
            const session = sessions.find(s => s.id === sessionId);
            if (!session) return [];
            const date = session.date.split(' ')[0];
            const scheduledPeople = schedule[date] || [];
            let baseRoster = [];
            if (session.location === '강일주민센터') baseRoster = gangilRoster;
            else if (session.location === '미사역') baseRoster = misaRoster;
            else if (session.location === '복귀') baseRoster = [...gangilRoster, ...misaRoster, ...returnOnlyRoster];
            return baseRoster.filter(person => scheduledPeople.includes(person.name)).sort((a, b) => a.name.localeCompare(b.name, 'ko-KR'));
        }

        function renderSessionTabs() {
            const tabsContainer = document.getElementById('sessionTabs');
            tabsContainer.innerHTML = '';
            sessions.forEach(session => {
                const stats = getAttendanceStats(session.id);
                const tab = document.createElement('div');
                tab.className = `session-tab ${session.id === currentSession ? 'active' : ''}`;
                tab.onclick = () => selectSession(session.id);
                const icon = session.type === 'departure' ? '🚌' : '🏠';
                
                let sessionText;
                if (session.type === 'departure') {
                    if (session.location === '강일주민센터') {
                        sessionText = `${icon} ${session.date} 출발 강일 주민센터`;
                    } else if (session.location === '미사역') {
                        sessionText = `${icon} ${session.date} 출발 미사역`;
                    } else {
                        sessionText = `${icon} ${session.date} ${session.time} ${session.location}`;
                    }
                } else {
                    sessionText = `${icon} ${session.date} ${session.location}`;
                }
                
                tab.innerHTML = `
                    <div class="session-info">${sessionText}</div>
                    <div class="session-count">${stats.boarded}/${stats.total}</div>
                `;
                tabsContainer.appendChild(tab);
            });
        }

        function selectSession(sessionId) {
            currentSession = sessionId;
            renderSessionTabs();
            renderAttendanceSection();
            
            setTimeout(() => {
                const attendanceSection = document.getElementById('attendanceSection');
                if (attendanceSection) {
                    attendanceSection.scrollIntoView({ 
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            }, 100); 
        }

        // =================================================================
        // === 여기가 수정된 함수입니다 (renderAttendanceSection) ===
        // =================================================================
        function renderAttendanceSection() {
            if (!currentSession) return;

            const roster = getRoster(currentSession); // 명단 (이름순 정렬)
            const attendanceSection = document.getElementById('attendanceSection');
            const session = sessions.find(s => s.id === currentSession);
            const leaderName = leaders[session.location];

            if (roster.length === 0) {
                attendanceSection.innerHTML = `<div class="no-session"><h3>📋 명단이 없습니다</h3><p>해당 세션의 참가자 명단을 확인해주세요.</p></div>`;
                return;
            }

            const stats = getAttendanceStats(currentSession);
            // 미탑승자 명단은 기존 순서(이름순)를 유지합니다.
            const notBoardedList = roster.filter(person => getAttendanceStatus(currentSession, person.name) !== 'boarded');

            const icon = session.type === 'departure' ? '🚌' : '🏠';
            let sessionTitle, sessionSubtitle;
            
            if (session.type === 'departure') {
                if (session.location === '강일주민센터') {
                    sessionTitle = `${icon} ${session.date}`;
                    sessionSubtitle = '출발 강일 주민센터';
                } else if (session.location === '미사역') {
                    sessionTitle = `${icon} ${session.date}`;
                    sessionSubtitle = '출발 미사역';
                } else {
                    sessionTitle = `${icon} ${session.date} ${session.time}`;
                    sessionSubtitle = session.location;
                }
            } else {
                sessionTitle = `${icon} ${session.date} ${session.time}`;
                sessionSubtitle = session.location;
            }
            
            const sessionHeaderHtml = `
                <div class="session-header">
                    <div class="session-title">${sessionTitle}</div>
                    <div class="session-subtitle">${sessionSubtitle}</div>
                </div>
            `;

            let notBoardedHtml = '';
            if (notBoardedList.length > 0) {
                notBoardedHtml = `
                    <div class="not-boarded-names-container">
                        <p class="not-boarded-title">미탑승 명단 (${notBoardedList.length}명)</p>
                        <div class="names-list">
                            ${notBoardedList.map(person => {
                                const isLeader = person.name === leaderName;
                                return `<span class="name-tag ${isLeader ? 'leader-name' : ''}">${person.name}${isLeader ? ' (인도자)' : ''}</span>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            
            // --- 코드 수정 부분 ---
            // 출석 체크리스트를 위한 명단 정렬: 미탑승자 우선, 그 다음 탑승자 순으로 정렬합니다.
            // 각 그룹 내에서는 이름순을 유지합니다.
            roster.sort((a, b) => {
                const aIsBoarded = getAttendanceStatus(currentSession, a.name) === 'boarded';
                const bIsBoarded = getAttendanceStatus(currentSession, b.name) === 'boarded';

                if (aIsBoarded !== bIsBoarded) {
                    return aIsBoarded ? 1 : -1; // false(미탑승)가 앞으로, true(탑승)가 뒤로 갑니다.
                }
                
                // 출석 상태가 같을 경우 이름순으로 정렬합니다.
                return a.name.localeCompare(b.name, 'ko-KR');
            });
            // --- 코드 수정 끝 ---

            const listItemsHtml = roster.map(person => {
                const status = getAttendanceStatus(currentSession, person.name);
                const callButtonHtml = person.phone ? `<a href="tel:${person.phone}" class="call-btn" onclick="event.stopPropagation()">📞</a>` : '';
                const checkIcon = status === 'boarded' ? '<span class="checkbox-icon">✓</span>' : '';
                const safeName = person.name.replace(/'/g, "\\'");
                const isLeader = person.name === leaderName;
                const displayName = `${person.name}${isLeader ? ' (인도자)' : ''}`;

                return `
                    <div class="checklist-item ${status}" onclick="toggleAttendance('${safeName}')">
                        <div class="student-info">
                            <span class="student-name ${isLeader ? 'leader-name' : ''}">${displayName}</span>
                            ${callButtonHtml}
                        </div>
                        <div class="checkbox-wrapper">
                            <div class="attendance-checkbox ${status}">${checkIcon}</div>
                        </div>
                    </div>
                `;
            }).join('');

            attendanceSection.innerHTML = `
                ${sessionHeaderHtml}
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-number total">${stats.total}</div><div class="stat-label">총 인원</div></div>
                    <div class="stat-item"><div class="stat-number boarded">${stats.boarded}</div><div class="stat-label">탑승</div></div>
                    <div class="stat-item"><div class="stat-number not-boarded">${stats.not_boarded}</div><div class="stat-label">미탑승</div></div>
                </div>
                ${notBoardedHtml}
                <div class="checklist-container">
                    <div class="checklist-header"><div>이름</div><div>탑승</div></div>
                    ${listItemsHtml}
                </div>
            `;
        }
        // =================================================================
        // === 함수 수정 끝 ===
        // =================================================================

        function toggleAttendance(name) {
            if (!currentSession) return;
            const personRef = ref(database, `bus-attendance/${currentSession}/${name}`);
            const currentStatus = getAttendanceStatus(currentSession, name);
            set(personRef, currentStatus === 'boarded' ? null : 'boarded');
        }

        function getAttendanceStatus(sessionId, name) {
            return attendanceData[sessionId]?.[name] === 'boarded' ? 'boarded' : 'not-boarded';
        }

        function getAttendanceStats(sessionId) {
            const roster = getRoster(sessionId);
            const total = roster.length;
            if (!attendanceData[sessionId] || total === 0) {
                return { total, boarded: 0, not_boarded: total };
            }
            const boarded = Object.keys(attendanceData[sessionId]).length;
            return { total, boarded, not_boarded: total - boarded };
        }

        document.addEventListener('DOMContentLoaded', function() {
            onValue(attendanceDbRef, (snapshot) => {
                attendanceData = snapshot.val() || {};
                console.log("Data updated from Firebase. Re-rendering...");
                renderSessionTabs(); 
                if (currentSession) {
                    renderAttendanceSection();
                }
            });
        });
    </script>
</body>
</html>
