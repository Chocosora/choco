<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>다중 원고 프롬프터</title>
<style>
    :root { --accent: #0d6efd; --bg: #f8f9fa; --card-bg: #ffffff; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; padding-bottom: 100px; }

    /* --- 공통 UI --- */
    button { border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    .hidden { display: none !important; }

    /* --- 목록 화면 (List View) --- */
    #list-view { padding: 20px; max-width: 800px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-top: env(safe-area-inset-top); }
    .header h1 { font-size: 24px; margin: 0; color: #333; }
    #btn-new { background: var(--accent); color: white; padding: 10px 20px; font-size: 16px; border-radius: 20px;}

    .script-list { list-style: none; padding: 0; margin: 0; }
    .script-item { 
        background: var(--card-bg); margin-bottom: 15px; padding: 20px; 
        border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        display: flex; justify-content: space-between; align-items: center;
        cursor: pointer; border: 1px solid transparent;
    }
    .script-item:hover { border-color: var(--accent); }
    .script-info h3 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
    .script-info p { margin: 0; font-size: 14px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;}
    .offline-button { background: #e7f1ff; color: #084298; padding: 10px 12px; }
    .script-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .offline-tools { display:flex; gap:8px; margin-bottom:12px; }
    #controls { flex-wrap:wrap; gap:8px; }
    button:disabled { opacity:0.5; cursor:default; }
    .btn-delete { background: #fee2e2; color: #dc2626; padding: 8px 12px; font-size: 14px; margin-left: 10px; }

    /* --- 프롬프터 화면 (Prompter View) --- */
    #prompter-view { display: none; }
    
    #controls {
        position: fixed; top: 0; left: 0; right: 0;
        background: rgba(255,255,255,0.95); border-bottom: 1px solid #ddd;
        padding: 10px 15px; z-index: 1000;
        display: flex; justify-content: space-between; align-items: center;
        padding-top: calc(10px + env(safe-area-inset-top));
    }
    
    #btn-back { background: #e9ecef; color: #333; padding: 8px 15px; border-radius: 20px; margin-right: 10px; }
    #btn-reset { background: #dc3545; color: white; padding: 8px 15px; border-radius: 20px; }
    #btn-edit { background: #198754; color: white; padding: 8px 15px; border-radius: 20px; }

    .font-controls { display: flex; gap: 5px; align-items: center; background: #eee; padding: 5px; border-radius: 20px; margin-right: 10px; }
    .btn-font { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; background: white; border-radius: 50%; border: 1px solid #ddd; }

    #script-container {
        margin-top: 80px; padding: 20px; font-size: 26px; line-height: 1.2;
        white-space: pre-wrap; word-break: keep-all; min-height: 500px;
    }

    /* --- 편집기 (Modal) --- */
    #editor-modal {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: white; z-index: 2000; padding: 20px; display: none;
        flex-direction: column;
        padding-top: calc(20px + env(safe-area-inset-top));
    }
    #editor-title { width: 100%; padding: 15px; font-size: 20px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; font-weight: bold; }
    #editor-content { flex-grow: 1; width: 100%; font-size: 18px; padding: 15px; border: 1px solid #ddd; border-radius: 10px; resize: none; font-family: inherit; box-sizing: border-box; line-height: 1.6;}
    .edit-btns { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
    #btn-save { background: #0d6efd; color: white; padding: 12px 24px; font-size: 16px; }
    #btn-cancel { background: #6c757d; color: white; padding: 12px 24px; font-size: 16px; }

    /* 하이라이트 효과 - 단락 단위 */
    .paragraph { 
        padding: 10px; 
        margin-bottom: 13.333px; 
        border-radius: 8px; 
        transition: all 0.3s ease; 
        border-left: 4px solid transparent;
        cursor: pointer;
        user-select: none;
        background: transparent;
    }
    .paragraph.active { 
        background: #fff3cd !important; 
        border-left-color: #ffc107; 
        box-shadow: 0 2px 8px rgba(255,193,7,0.3); 
    }
    .paragraph.passed { opacity: 0.5; }
    .paragraph:hover:not(.active) { background: #f8f9fa; }
    
    @keyframes pulse { 0% {box-shadow: 0 0 0 0 #dc354540;} 70% {box-shadow: 0 0 0 10px transparent;} }
</style>
</head>
<body>

    <div id="list-view">
        <div class="header">
            <h1>내 원고 보관함</h1>
            <button id="btn-new">+ 새 원고</button>
        </div>
        <div class="offline-tools"><button id="show-all" class="offline-button">전체 원고</button><button id="show-saved" class="offline-button">저장한 원고</button></div>
        <p style="font-size:14px;color:#555;line-height:1.5">강연 전에 ‘오프라인 저장’을 누르세요. 인터넷이 없어도 같은 주소에서 ‘저장한 원고’를 열 수 있습니다. 저장한 기기와 브라우저에서 사용하세요.</p>
        <p id="offline-status" role="status" aria-live="polite"></p>
        <ul class="script-list" id="script-list-container">
            <li style="text-align:center; color:#888; padding:20px;">불러오는 중...</li>
        </ul>
        <p id="load-status" role="status" aria-live="polite"></p>
        <button id="btn-retry" hidden>다시 불러오기</button>
        <button id="btn-more" hidden>더 보기</button>
    </div>

    <div id="prompter-view">
        <div id="controls">
            <div style="display:flex; align-items:center;">
                <button id="btn-back">← 목록</button>
                <button id="btn-reset">초기화</button>
            </div>
            <div style="display: flex; align-items: center;">
                <div class="font-controls">
                    <button class="btn-font" id="btn-dec">-</button>
                    <button class="btn-font" id="btn-inc">+</button>
                </div>
                <button id="btn-align" class="offline-button" aria-pressed="false">가운데 정렬</button>
                <button id="save-current" class="offline-button">오프라인 저장</button>
                <button id="btn-edit">수정</button>
            </div>
        </div>
        <div id="script-container"></div>
    </div>

    <div id="editor-modal">
        <h3>원고 작성/수정</h3>
        <input type="text" id="editor-title" placeholder="원고 제목을 입력하세요 (예: 149번 연설)">
        <textarea id="editor-content" placeholder="여기에 원고 내용을 입력하세요."></textarea>
        <div class="edit-btns">
            <button id="btn-cancel">취소</button>
            <button id="btn-save">저장하기</button>
        </div>
    </div>

    <script>
        window.addEventListener('error', (event) => {
            if (event.target && event.target.tagName === 'SCRIPT') {
                document.getElementById('load-status').textContent = '프로그램을 불러오지 못했습니다. 연결을 확인한 뒤 새로고침해주세요.';
            }
        }, true);
    </script>
    <script type="module">
        let initializeApp, initializeFirestore, persistentLocalCache, persistentMultipleTabManager;
        let collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, limit;
        const firebaseConfig = {
            apiKey: "AIzaSyBoEKTcBVRqsrWeSNEOd_2nDQGiZxYqo3U",
            authDomain: "chocosora-ad4df.firebaseapp.com",
            databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com",
            projectId: "chocosora-ad4df",
            storageBucket: "chocosora-ad4df.firebasestorage.app",
            messagingSenderId: "798065461606",
            appId: "1:798065461606:web:c8587cf10077c804f360a7",
            measurementId: "G-TNZYEM90TP"
        };

        let db, cloudPromise;
        function ensureCloud() {
            if (!navigator.onLine) return Promise.reject(new Error('인터넷 연결이 필요합니다.'));
            if (!cloudPromise) cloudPromise = (async () => {
        try {
            const modules = await Promise.all([
                import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"),
                import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js")
            ]);
            ({ initializeApp } = modules[0]);
            ({ initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
                collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, limit } = modules[1]);
        } catch (error) { cloudPromise = null; throw error; }
                const app = initializeApp(firebaseConfig);
                db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
            })();
            return cloudPromise;
        }

        // --- DOM 요소 ---
        const listView = document.getElementById('list-view');
        const prompterView = document.getElementById('prompter-view');
        const editorModal = document.getElementById('editor-modal');
        const listContainer = document.getElementById('script-list-container');
        const scriptContainer = document.getElementById('script-container');

        const editorTitle = document.getElementById('editor-title');
        const editorContent = document.getElementById('editor-content');

        // 상태 변수
        let currentDocId = null;
        let currentScriptData = {};

        // --- 1. 원고 목록 불러오기 ---
        const status = document.getElementById('load-status');
        const retryButton = document.getElementById('btn-retry');
        const moreButton = document.getElementById('btn-more');
        let generation = 0;
        const scriptData = new Map();

        let nextPageToken = '';
        const REST_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/scripts`;
        function decodeDocument(item) {
            const fields = item.fields || {};
            return { id: item.name.split('/').pop(), data: {
                title: fields.title?.stringValue || '제목 없음',
                content: fields.content?.stringValue || ''
            }};
        }
        const STORAGE_KEY = 'choco-prom-offline-v1:' + location.pathname;
        const offlineStatus = document.getElementById('offline-status');
        let savedScripts = new Map();
        try {
            const entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            savedScripts = new Map(entries.filter(([id, d]) => typeof id === 'string' && d && typeof d.title === 'string' && typeof d.content === 'string'));
        } catch (error) { offlineStatus.textContent = '기기 저장소를 읽지 못했습니다. 브라우저 저장소 설정을 확인해주세요.'; }
        let savedMode = !navigator.onLine;
        function updateMode() {
            document.getElementById('show-all').setAttribute('aria-pressed', String(!savedMode));
            document.getElementById('show-saved').setAttribute('aria-pressed', String(savedMode));
            document.getElementById('btn-new').disabled = !navigator.onLine || savedMode;
            document.getElementById('btn-edit').disabled = !navigator.onLine || savedMode;
            document.getElementById('save-current').hidden = savedMode || !navigator.onLine;
            moreButton.hidden = savedMode || !nextPageToken;
            retryButton.hidden = savedMode;
        }
        function showSaved() {
            savedMode = true; ++generation;
            updateMode(); drawList();
            status.textContent = `저장한 원고 ${savedScripts.size}개 · ${navigator.onLine ? '기기 저장본' : '오프라인 모드'}`;
        }
        document.getElementById('show-saved').onclick = showSaved;
        document.getElementById('show-all').onclick = () => {
            if (!navigator.onLine) { showSaved(); return; }
            savedMode = false; updateMode(); drawList(); listenToScripts();
        };
        function withTimeout(promise, ms = 15000) {
            let timer;
            return Promise.race([promise, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('오프라인 준비 시간이 초과됐습니다. 연결을 확인하고 다시 시도해주세요.')), ms); })]).finally(() => clearTimeout(timer));
        }
        async function prepareOffline() {
            if (!isSecureContext || !('serviceWorker' in navigator)) throw new Error('HTTPS 주소와 오프라인 기능을 지원하는 브라우저가 필요합니다.');
            await withTimeout(navigator.serviceWorker.register('./sw.js', { scope: './' }));
            const registration = await withTimeout(navigator.serviceWorker.ready);
            await withTimeout(new Promise((resolve, reject) => {
                const channel = new MessageChannel();
                channel.port1.onmessage = ({data}) => { channel.port1.close(); data.ok ? resolve() : reject(new Error(data.error)); };
                registration.active.postMessage({ type: 'CACHE_PAGE', url: location.href.split('#')[0] }, [channel.port2]);
            }));
        }
        async function saveOffline(id, data, button) {
            button.disabled = true;
            offlineStatus.textContent = '오프라인 사용을 준비하고 있습니다...';
            try {
                await prepareOffline();
                const next = new Map(savedScripts);
                next.set(id, { title: data.title || '제목 없음', content: data.content || '', savedAt: new Date().toISOString() });
                localStorage.setItem(STORAGE_KEY, JSON.stringify([...next]));
                savedScripts = next;
                button.textContent = '✓ 저장 완료';
                drawList();
                offlineStatus.textContent = '✓ 오프라인 저장 완료. 인터넷 없이 같은 주소의 ‘저장한 원고’에서 볼 수 있습니다.';
                if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
            } catch (error) { offlineStatus.textContent = '저장하지 못했습니다: ' + error.message; alert(offlineStatus.textContent); }
            finally { button.disabled = false; }
        }
        document.getElementById('save-current').onclick = event => saveOffline(currentDocId, currentScriptData, event.currentTarget);
        function drawList() {
            const fragment = document.createDocumentFragment();
            for (const [id, data] of (savedMode ? savedScripts : scriptData)) fragment.appendChild(renderScriptItem(id, data));
            if (!(savedMode ? savedScripts : scriptData).size) {
                const empty = document.createElement('li');
                empty.textContent = savedMode ? '오프라인 저장한 원고가 없습니다. 인터넷 연결 후 전체 원고에서 저장해주세요.' : '저장된 원고가 없습니다. 새 원고를 만들어보세요.';
                fragment.appendChild(empty);
            }
            listContainer.replaceChildren(fragment);
        }
        async function listenToScripts(append = false) {
            if (!navigator.onLine) { showSaved(); return; }
            const activeGeneration = ++generation;
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 12000);
            const started = performance.now();
            moreButton.disabled = true;
            retryButton.hidden = false;
            retryButton.textContent = '새로 불러오기';
            status.textContent = scriptData.size ? '기존 목록을 표시하며 서버 확인 중...' : '서버에서 목록을 불러오는 중...';
            try {
                const url = new URL(REST_BASE);
                url.searchParams.set('pageSize', '20');
                url.searchParams.set('orderBy', 'createdAt desc');
                if (append && nextPageToken) url.searchParams.set('pageToken', nextPageToken);
                const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error?.message || `HTTP ${response.status}`);
                if (activeGeneration !== generation) return;
                if (!append) scriptData.clear();
                for (const item of result.documents || []) {
                    const record = decodeDocument(item);
                    scriptData.set(record.id, record.data);
                }
                nextPageToken = result.nextPageToken || '';
                drawList();
                moreButton.hidden = !nextPageToken;
                status.textContent = `${scriptData.size}개 원고 · ${((performance.now() - started) / 1000).toFixed(2)}초에 불러옴`;
                if (currentDocId && scriptData.has(currentDocId)) currentScriptData = scriptData.get(currentDocId);
            } catch (error) {
                if (activeGeneration !== generation) return;
                console.error('목록 조회 오류', error);
                if (!scriptData.size) listContainer.replaceChildren();
                if (savedScripts.size) showSaved();
                status.textContent = error.name === 'AbortError'
                    ? '서버 응답이 12초 이상 지연됐습니다. 다시 불러오기를 눌러주세요.'
                    : `목록 조회 실패: ${error.message}`;
            } finally {
                clearTimeout(timer);
                if (activeGeneration === generation) moreButton.disabled = false;
            }
        }

        retryButton.onclick = () => listenToScripts();
        moreButton.onclick = () => listenToScripts(true);
        window.addEventListener('online', () => { updateMode(); if (!savedMode) listenToScripts(); });
        window.addEventListener('offline', showSaved);
        drawList();
        updateMode();
        if (navigator.onLine) listenToScripts(); else showSaved();

        function renderScriptItem(id, data) {
            const li = document.createElement('li');
            li.className = 'script-item';
            li.dataset.id = id;
            const info = document.createElement('div');
            info.className = 'script-info';
            info.style.flexGrow = '1';
            const title = document.createElement('h3');
            title.textContent = data.title || '제목 없음';
            const preview = document.createElement('p');
            preview.textContent = data.content ? data.content.slice(0, 30) + (data.content.length > 30 ? '...' : '') : '내용 없음';
            info.append(title, preview);
            info.onclick = () => openPrompter(id, data);
            const remove = document.createElement('button');
            remove.className = 'btn-delete';
            remove.textContent = '삭제';
            remove.onclick = async event => {
                event.stopPropagation();
                const latest = scriptData.get(id) || data;
                if (!confirm(`'${latest.title}' 원고를 삭제하시겠습니까?`)) return;
                remove.disabled = true;
                try { await ensureCloud(); await deleteDoc(doc(db, 'scripts', id)); await listenToScripts(); }
                catch (error) {
                    console.error('삭제 오류:', error);
                    alert(`삭제하지 못했습니다. (${error.code || 'unknown'})`);
                } finally { remove.disabled = false; }
            };
            remove.hidden = savedMode;
            remove.disabled = !navigator.onLine;
            const save = document.createElement('button');
            save.className = 'offline-button';
            save.textContent = savedScripts.has(id) ? '저장본 갱신' : '오프라인 저장';
            save.hidden = savedMode;
            save.onclick = () => saveOffline(id, data, save);
            const unsave = document.createElement('button');
            unsave.className = 'offline-button';
            unsave.textContent = '기기 저장 해제';
            unsave.hidden = !savedScripts.has(id);
            unsave.onclick = () => {
                if (!confirm('이 기기의 저장본만 지울까요? 서버 원고는 유지됩니다.')) return;
                try {
                    const next = new Map(savedScripts); next.delete(id);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify([...next]));
                    savedScripts = next; drawList();
                } catch (error) { offlineStatus.textContent = '저장본을 지우지 못했습니다: ' + error.message; }
            };
            if (savedScripts.has(id)) {
                const badge = document.createElement('p');
                badge.textContent = '✓ 오프라인 저장됨'; info.append(badge);
            }
            const actions = document.createElement('div'); actions.className = 'script-actions';
            actions.append(save, unsave, remove); li.append(info, actions);
            return li;
        }

        // --- 2. 화면 전환 로직 ---
        function openPrompter(id, data) {
            currentDocId = id;
            currentScriptData = data;
            updateMode();
            
            listView.classList.add('hidden');
            prompterView.style.display = 'block';
            
            renderScript(data.content);
            window.scrollTo(0, 0);
        }

        document.getElementById('btn-back').onclick = () => {
            prompterView.style.display = 'none';
            listView.classList.remove('hidden');
            currentDocId = null;
            resetHighlight();
        };

        // --- 3. 새 원고 / 수정 / 저장 로직 ---
        
        document.getElementById('btn-new').onclick = () => {
            currentDocId = null;
            editorTitle.value = "";
            editorContent.value = "";
            editorModal.style.display = 'flex';
        };

        document.getElementById('btn-edit').onclick = () => {
            editorTitle.value = currentScriptData.title || "";
            editorContent.value = currentScriptData.content || "";
            editorModal.style.display = 'flex';
        };

        document.getElementById('btn-cancel').onclick = () => {
            editorModal.style.display = 'none';
        };

        document.getElementById('btn-save').onclick = async () => {
            const title = editorTitle.value.trim();
            const content = editorContent.value;

            if (!title) { alert("제목을 입력해주세요."); return; }

            const saveButton = document.getElementById('btn-save');
            saveButton.disabled = true;
            try {
                await ensureCloud();
                if (currentDocId) {
                    await updateDoc(doc(db, "scripts", currentDocId), {
                        title: title,
                        content: content,
                        updatedAt: serverTimestamp()
                    });
                    currentScriptData = { title, content };
                    renderScript(content);
                } else {
                    await addDoc(collection(db, "scripts"), {
                        title: title,
                        content: content,
                        createdAt: serverTimestamp()
                    });
                }
                editorModal.style.display = 'none';
                await listenToScripts();
                offlineStatus.textContent = '서버에 저장했습니다. 오프라인 저장본은 다시 저장해야 갱신됩니다.';
            } catch (e) {
                console.error("Error:", e);
                alert(`저장 중 오류가 발생했습니다. (${e.code || 'unknown'})`);
            } finally {
                saveButton.disabled = false;
            }
        };

        // --- 4. 프롬프터 렌더링 및 기능 (터치 기반) ---
        let paragraphElements = [];
        let currentParagraphIndex = -1;
        let isStarted = false; // 프롬프터 시작 여부

        document.getElementById('btn-reset').onclick = () => {
            resetHighlight();
        };

        const alignmentButton = document.getElementById('btn-align');
        const alignmentKey = 'choco-prom-alignment:' + location.pathname;
        let centered = false;
        try { centered = localStorage.getItem(alignmentKey) === 'center'; } catch (_) {}
        function applyAlignment() {
            scriptContainer.style.textAlign = centered ? 'center' : 'left';
            alignmentButton.textContent = centered ? '왼쪽 정렬' : '가운데 정렬';
            alignmentButton.setAttribute('aria-pressed', String(centered));
        }
        alignmentButton.onclick = () => {
            centered = !centered;
            applyAlignment();
            try { localStorage.setItem(alignmentKey, centered ? 'center' : 'left'); } catch (_) {}
        };
        applyAlignment();

        let fontSize = 26;
        document.getElementById('btn-inc').onclick = () => { fontSize+=2; scriptContainer.style.fontSize = fontSize+'px'; };
        document.getElementById('btn-dec').onclick = () => { if(fontSize>14) fontSize-=2; scriptContainer.style.fontSize = fontSize+'px'; };

        // 스크린 터치 및 문단 선택 로직
        scriptContainer.addEventListener('click', (e) => {
            // 1. 특정 문단을 직접 클릭한 경우 (점프)
            if(e.target.classList.contains('paragraph') && e.target.dataset.idx !== undefined) {
                const idx = parseInt(e.target.dataset.idx);
                
                // 언제든지 해당 문단으로 점프하여 활성화
                currentParagraphIndex = idx;
                isStarted = true;
                updateHighlight();
            } 
            // 2. 빈 공간을 클릭한 경우 (다음 문단으로 진행)
            else {
                handleNextParagraph();
            }
        });

        function handleNextParagraph() {
            if(currentParagraphIndex < paragraphElements.length - 1) {
                currentParagraphIndex++;
                updateHighlight();
            }
        }

        // [수정됨] 성구 등 괄호가 있어도 무조건 일반 문단으로 처리
        function renderScript(text) {
            scriptContainer.innerHTML = '';
            paragraphElements = [];
            currentParagraphIndex = -1;
            isStarted = false;
            if(!text) return;

            const paragraphs = text.split('\n');
            
            paragraphs.forEach((para, idx) => {
                if(!para.trim()) { 
                    scriptContainer.appendChild(document.createElement('br')); 
                    return; 
                }
                
                const div = document.createElement('div');
                div.className = 'paragraph';
                
                // 괄호 체크 로직(if문)을 제거하고 무조건 일반 처리
                div.textContent = para;
                div.dataset.idx = paragraphElements.length;
                paragraphElements.push(div);
                
                scriptContainer.appendChild(div);
            });
        }

        function resetHighlight() {
            currentParagraphIndex = -1;
            isStarted = false;
            paragraphElements.forEach(para => {
                para.classList.remove('active', 'passed');
            });
        }

        function updateHighlight() {
            paragraphElements.forEach((para, i) => {
                para.classList.remove('active', 'passed');
                if(i === currentParagraphIndex) {
                    para.classList.add('active');
                    // 상단으로 스크롤 (화면 중앙보다는 약간 위쪽이 읽기 편함)
                    const rect = para.getBoundingClientRect();
                    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                    const targetPosition = rect.top + scrollTop - 100;
                    window.scrollTo({
                        top: targetPosition,
                        behavior: 'smooth'
                    });
                } else if(i < currentParagraphIndex) {
                    para.classList.add('passed');
                }
            });
        }
    </script>
</body>
</html>
