<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>다중 원고 프롬프터</title>
<style>
    :root { --accent: #0d6efd; --bg: #f8f9fa; --card-bg: #ffffff; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; padding-bottom: 100px; }

    /* --- 공통 UI --- */
    button { border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    .hidden { display: none !important; }

    /* --- 목록 화면 (List View) --- */
    #list-view { padding: 20px; max-width: 800px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-top: env(safe-area-inset-top); }
    .header h1 { font-size: 24px; margin: 0; color: #333; }
    #btn-new { background: var(--accent); color: white; padding: 10px 20px; font-size: 16px; border-radius: 20px;}

    .script-list { list-style: none; padding: 0; margin: 0; }
    .script-item { 
        background: var(--card-bg); margin-bottom: 15px; padding: 20px; 
        border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        display: flex; justify-content: space-between; align-items: center;
        cursor: pointer; border: 1px solid transparent;
    }
    .script-item:hover { border-color: var(--accent); }
    .script-info h3 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
    .script-info p { margin: 0; font-size: 14px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;}
    .btn-delete { background: #fee2e2; color: #dc2626; padding: 8px 12px; font-size: 14px; margin-left: 10px; }

    /* --- 프롬프터 화면 (Prompter View) --- */
    #prompter-view { display: none; }
    
    #controls {
        position: fixed; top: 0; left: 0; right: 0;
        background: rgba(255,255,255,0.95); border-bottom: 1px solid #ddd;
        padding: 10px 15px; z-index: 1000;
        display: flex; justify-content: space-between; align-items: center;
        padding-top: calc(10px + env(safe-area-inset-top));
    }
    
    #btn-back { background: #e9ecef; color: #333; padding: 8px 15px; border-radius: 20px; margin-right: 10px; }
    #btn-reset { background: #dc3545; color: white; padding: 8px 15px; border-radius: 20px; }
    #btn-edit { background: #198754; color: white; padding: 8px 15px; border-radius: 20px; }

    .font-controls { display: flex; gap: 5px; align-items: center; background: #eee; padding: 5px; border-radius: 20px; margin-right: 10px; }
    .btn-font { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; background: white; border-radius: 50%; border: 1px solid #ddd; }

    #script-container {
        margin-top: 80px; padding: 20px; font-size: 26px; line-height: 1.8;
        white-space: pre-wrap; word-break: keep-all; min-height: 500px;
    }

    /* --- 편집기 (Modal) --- */
    #editor-modal {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: white; z-index: 2000; padding: 20px; display: none;
        flex-direction: column;
        padding-top: calc(20px + env(safe-area-inset-top));
    }
    #editor-title { width: 100%; padding: 15px; font-size: 20px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; font-weight: bold; }
    #editor-content { flex-grow: 1; width: 100%; font-size: 18px; padding: 15px; border: 1px solid #ddd; border-radius: 10px; resize: none; font-family: inherit; box-sizing: border-box; line-height: 1.6;}
    .edit-btns { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
    #btn-save { background: #0d6efd; color: white; padding: 12px 24px; font-size: 16px; }
    #btn-cancel { background: #6c757d; color: white; padding: 12px 24px; font-size: 16px; }

    /* 하이라이트 효과 - 단락 단위 */
    .paragraph { 
        padding: 15px; 
        margin-bottom: 20px; 
        border-radius: 8px; 
        transition: all 0.3s ease; 
        border-left: 4px solid transparent;
        cursor: pointer;
        user-select: none;
        background: transparent;
    }
    .paragraph.active { 
        background: #fff3cd !important; 
        border-left-color: #ffc107; 
        box-shadow: 0 2px 8px rgba(255,193,7,0.3); 
    }
    .paragraph.passed { opacity: 0.5; }
    .paragraph:hover:not(.active) { background: #f8f9fa; }
    
    @keyframes pulse { 0% {box-shadow: 0 0 0 0 #dc354540;} 70% {box-shadow: 0 0 0 10px transparent;} }
</style>
</head>
<body>

    <div id="list-view">
        <div class="header">
            <h1>내 원고 보관함</h1>
            <button id="btn-new">+ 새 원고</button>
        </div>
        <ul class="script-list" id="script-list-container">
            <li style="text-align:center; color:#888; padding:20px;">불러오는 중...</li>
        </ul>
        <p id="load-status" role="status" aria-live="polite"></p>
        <button id="btn-retry" hidden>다시 불러오기</button>
        <button id="btn-more" hidden>더 보기</button>
    </div>

    <div id="prompter-view">
        <div id="controls">
            <div style="display:flex; align-items:center;">
                <button id="btn-back">← 목록</button>
                <button id="btn-reset">초기화</button>
            </div>
            <div style="display: flex; align-items: center;">
                <div class="font-controls">
                    <button class="btn-font" id="btn-dec">-</button>
                    <button class="btn-font" id="btn-inc">+</button>
                </div>
                <button id="btn-edit">수정</button>
            </div>
        </div>
        <div id="script-container"></div>
    </div>

    <div id="editor-modal">
        <h3>원고 작성/수정</h3>
        <input type="text" id="editor-title" placeholder="원고 제목을 입력하세요 (예: 149번 연설)">
        <textarea id="editor-content" placeholder="여기에 원고 내용을 입력하세요."></textarea>
        <div class="edit-btns">
            <button id="btn-cancel">취소</button>
            <button id="btn-save">저장하기</button>
        </div>
    </div>

    <script>
        window.addEventListener('error', (event) => {
            if (event.target && event.target.tagName === 'SCRIPT') {
                document.getElementById('load-status').textContent = '프로그램을 불러오지 못했습니다. 연결을 확인한 뒤 새로고침해주세요.';
            }
        }, true);
    </script>
    <script type="module">
        let initializeApp, initializeFirestore, persistentLocalCache, persistentMultipleTabManager;
        let collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, limit;
        try {
            const modules = await Promise.all([
                import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"),
                import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js")
            ]);
            ({ initializeApp } = modules[0]);
            ({ initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
                collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, limit } = modules[1]);
        } catch (error) {
            document.getElementById('script-list-container').textContent = '';
            document.getElementById('load-status').textContent = '프로그램 로딩 실패: 연결을 확인하고 다시 시도해주세요.';
            const retry = document.getElementById('btn-retry');
            retry.hidden = false;
            retry.onclick = () => location.reload();
            console.error('Firebase 모듈 로딩 실패', error);
            throw error;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBoEKTcBVRqsrWeSNEOd_2nDQGiZxYqo3U",
            authDomain: "chocosora-ad4df.firebaseapp.com",
            databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com",
            projectId: "chocosora-ad4df",
            storageBucket: "chocosora-ad4df.firebasestorage.app",
            messagingSenderId: "798065461606",
            appId: "1:798065461606:web:c8587cf10077c804f360a7",
            measurementId: "G-TNZYEM90TP"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });

        // --- DOM 요소 ---
        const listView = document.getElementById('list-view');
        const prompterView = document.getElementById('prompter-view');
        const editorModal = document.getElementById('editor-modal');
        const listContainer = document.getElementById('script-list-container');
        const scriptContainer = document.getElementById('script-container');

        const editorTitle = document.getElementById('editor-title');
        const editorContent = document.getElementById('editor-content');

        // 상태 변수
        let currentDocId = null;
        let currentScriptData = {};

        // --- 1. 원고 목록 불러오기 ---
        const status = document.getElementById('load-status');
        const retryButton = document.getElementById('btn-retry');
        const moreButton = document.getElementById('btn-more');
        let visibleLimit = 20;
        let unsubscribe = null;
        let loadTimer = null;
        let generation = 0;
        const scriptData = new Map();

        function safeData(snapshot) {
            const value = snapshot.data();
            return { ...value,
                title: typeof value.title === 'string' ? value.title : '제목 없음',
                content: typeof value.content === 'string' ? value.content : '' };
        }

        function listenToScripts() {
            const activeGeneration = ++generation;
            if (unsubscribe) unsubscribe();
            clearTimeout(loadTimer);
            retryButton.hidden = true;
            moreButton.disabled = true;
            status.textContent = '목록을 확인하는 중...';
            loadTimer = setTimeout(() => {
                if (activeGeneration !== generation) return;
                status.textContent = '연결이 지연되고 있습니다. 저장된 목록을 확인하거나 다시 시도해주세요.';
                retryButton.hidden = false;
            }, 12000);
            const q = query(collection(db, 'scripts'), orderBy('createdAt', 'desc'), limit(visibleLimit));
            unsubscribe = onSnapshot(q, { includeMetadataChanges: true }, snapshot => {
                if (activeGeneration !== generation) return;
                const cached = snapshot.metadata.fromCache;
                // An empty cache is not proof that the server has no manuscripts.
                if (!cached || !snapshot.empty) {
                    const fragment = document.createDocumentFragment();
                    scriptData.clear();
                    snapshot.forEach(item => {
                        const data = safeData(item);
                        scriptData.set(item.id, data);
                        fragment.appendChild(renderScriptItem(item.id, data));
                    });
                    if (snapshot.empty) {
                        const empty = document.createElement('li');
                        empty.textContent = '저장된 원고가 없습니다. 새 원고를 만들어보세요.';
                        fragment.appendChild(empty);
                    }
                    listContainer.replaceChildren(fragment);
                    if (currentDocId && scriptData.has(currentDocId)) {
                        currentScriptData = scriptData.get(currentDocId);
                    }
                }
                if (!cached) {
                    clearTimeout(loadTimer);
                    retryButton.hidden = true;
                }
                status.textContent = cached
                    ? '저장된 목록을 표시 중입니다. 서버 연결을 확인하고 있습니다.'
                    : `${snapshot.size}개 원고 표시 중${snapshot.metadata.hasPendingWrites ? ' · 변경사항 동기화 중' : ''}`;
                moreButton.hidden = snapshot.size < visibleLimit;
                moreButton.disabled = cached;
            }, error => {
                if (activeGeneration !== generation) return;
                clearTimeout(loadTimer);
                console.error('목록 불러오기 오류:', error);
                const reason = {
                    'permission-denied': '조회 권한이 없습니다. Firebase 보안 규칙과 인증 설정을 확인해주세요.',
                    'failed-precondition': '조회 설정을 확인해야 합니다. 콘솔 오류의 인덱스 안내를 확인해주세요.',
                    'unavailable': '서버에 연결할 수 없습니다. 네트워크를 확인해주세요.',
                    'resource-exhausted': '서비스 사용 한도에 도달했습니다. Firebase 할당량을 확인해주세요.'
                }[error.code] || '목록을 불러오지 못했습니다.';
                status.textContent = `${reason} (${error.code || 'unknown'})`;
                retryButton.hidden = false;
                moreButton.disabled = true;
                if (!scriptData.size) listContainer.replaceChildren();
            });
        }

        retryButton.onclick = listenToScripts;
        moreButton.onclick = () => { visibleLimit += 20; listenToScripts(); };
        window.addEventListener('online', listenToScripts);
        window.addEventListener('offline', () => {
            status.textContent = '인터넷 연결이 끊겼습니다. 저장된 목록을 표시합니다.';
        });
        listenToScripts();

        function renderScriptItem(id, data) {
            const li = document.createElement('li');
            li.className = 'script-item';
            li.dataset.id = id;
            const info = document.createElement('div');
            info.className = 'script-info';
            info.style.flexGrow = '1';
            const title = document.createElement('h3');
            title.textContent = data.title || '제목 없음';
            const preview = document.createElement('p');
            preview.textContent = data.content ? data.content.slice(0, 30) + (data.content.length > 30 ? '...' : '') : '내용 없음';
            info.append(title, preview);
            info.onclick = () => openPrompter(id, scriptData.get(id) || data);
            const remove = document.createElement('button');
            remove.className = 'btn-delete';
            remove.textContent = '삭제';
            remove.onclick = async event => {
                event.stopPropagation();
                const latest = scriptData.get(id) || data;
                if (!confirm(`'${latest.title}' 원고를 삭제하시겠습니까?`)) return;
                remove.disabled = true;
                try { await deleteDoc(doc(db, 'scripts', id)); }
                catch (error) {
                    console.error('삭제 오류:', error);
                    alert(`삭제하지 못했습니다. (${error.code || 'unknown'})`);
                } finally { remove.disabled = false; }
            };
            li.append(info, remove);
            return li;
        }

        // --- 2. 화면 전환 로직 ---
        function openPrompter(id, data) {
            currentDocId = id;
            currentScriptData = data;
            
            listView.classList.add('hidden');
            prompterView.style.display = 'block';
            
            renderScript(data.content);
            window.scrollTo(0, 0);
        }

        document.getElementById('btn-back').onclick = () => {
            prompterView.style.display = 'none';
            listView.classList.remove('hidden');
            currentDocId = null;
            resetHighlight();
        };

        // --- 3. 새 원고 / 수정 / 저장 로직 ---
        
        document.getElementById('btn-new').onclick = () => {
            currentDocId = null;
            editorTitle.value = "";
            editorContent.value = "";
            editorModal.style.display = 'flex';
        };

        document.getElementById('btn-edit').onclick = () => {
            editorTitle.value = currentScriptData.title || "";
            editorContent.value = currentScriptData.content || "";
            editorModal.style.display = 'flex';
        };

        document.getElementById('btn-cancel').onclick = () => {
            editorModal.style.display = 'none';
        };

        document.getElementById('btn-save').onclick = async () => {
            const title = editorTitle.value.trim();
            const content = editorContent.value;

            if (!title) { alert("제목을 입력해주세요."); return; }

            const saveButton = document.getElementById('btn-save');
            saveButton.disabled = true;
            try {
                if (currentDocId) {
                    await updateDoc(doc(db, "scripts", currentDocId), {
                        title: title,
                        content: content,
                        updatedAt: serverTimestamp()
                    });
                    currentScriptData = { title, content };
                    renderScript(content);
                } else {
                    await addDoc(collection(db, "scripts"), {
                        title: title,
                        content: content,
                        createdAt: serverTimestamp()
                    });
                }
                editorModal.style.display = 'none';
            } catch (e) {
                console.error("Error:", e);
                alert(`저장 중 오류가 발생했습니다. (${e.code || 'unknown'})`);
            } finally {
                saveButton.disabled = false;
            }
        };

        // --- 4. 프롬프터 렌더링 및 기능 (터치 기반) ---
        let paragraphElements = [];
        let currentParagraphIndex = -1;
        let isStarted = false; // 프롬프터 시작 여부

        document.getElementById('btn-reset').onclick = () => {
            resetHighlight();
        };

        let fontSize = 26;
        document.getElementById('btn-inc').onclick = () => { fontSize+=2; scriptContainer.style.fontSize = fontSize+'px'; };
        document.getElementById('btn-dec').onclick = () => { if(fontSize>14) fontSize-=2; scriptContainer.style.fontSize = fontSize+'px'; };

        // 스크린 터치 및 문단 선택 로직
        scriptContainer.addEventListener('click', (e) => {
            // 1. 특정 문단을 직접 클릭한 경우 (점프)
            if(e.target.classList.contains('paragraph') && e.target.dataset.idx !== undefined) {
                const idx = parseInt(e.target.dataset.idx);
                
                // 언제든지 해당 문단으로 점프하여 활성화
                currentParagraphIndex = idx;
                isStarted = true;
                updateHighlight();
            } 
            // 2. 빈 공간을 클릭한 경우 (다음 문단으로 진행)
            else {
                handleNextParagraph();
            }
        });

        function handleNextParagraph() {
            if(currentParagraphIndex < paragraphElements.length - 1) {
                currentParagraphIndex++;
                updateHighlight();
            }
        }

        // [수정됨] 성구 등 괄호가 있어도 무조건 일반 문단으로 처리
        function renderScript(text) {
            scriptContainer.innerHTML = '';
            paragraphElements = [];
            currentParagraphIndex = -1;
            isStarted = false;
            if(!text) return;

            const paragraphs = text.split('\n');
            
            paragraphs.forEach((para, idx) => {
                if(!para.trim()) { 
                    scriptContainer.appendChild(document.createElement('br')); 
                    return; 
                }
                
                const div = document.createElement('div');
                div.className = 'paragraph';
                
                // 괄호 체크 로직(if문)을 제거하고 무조건 일반 처리
                div.textContent = para;
                div.dataset.idx = paragraphElements.length;
                paragraphElements.push(div);
                
                scriptContainer.appendChild(div);
            });
        }

        function resetHighlight() {
            currentParagraphIndex = -1;
            isStarted = false;
            paragraphElements.forEach(para => {
                para.classList.remove('active', 'passed');
            });
        }

        function updateHighlight() {
            paragraphElements.forEach((para, i) => {
                para.classList.remove('active', 'passed');
                if(i === currentParagraphIndex) {
                    para.classList.add('active');
                    // 상단으로 스크롤 (화면 중앙보다는 약간 위쪽이 읽기 편함)
                    const rect = para.getBoundingClientRect();
                    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                    const targetPosition = rect.top + scrollTop - 100;
                    window.scrollTo({
                        top: targetPosition,
                        behavior: 'smooth'
                    });
                } else if(i < currentParagraphIndex) {
                    para.classList.add('passed');
                }
            });
        }
    </script>
</body>
</html>
