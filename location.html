<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업 주소 관리</title>
    <!-- Firebase & SortableJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-database-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        /* --- Base Styles & Variables --- */
        :root {
            --primary-color: #4263eb;
            --secondary-color: #f8f9fa;
            --border-color: #ced4da;
            --text-color: #343a40;
            --light-gray: #e9ecef;
            --naver-color: #03C75A;
            --tmap-color: #ED1846;
            --kakao-color: #FEE500;
            --kakao-text: #3C1E1E;
            --box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            max-width: 800px; margin: 0 auto; padding: 15px;
            background: var(--secondary-color); color: var(--text-color);
            line-height: 1.6;
        }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 26px; margin-bottom: 8px; }
        .subtitle { color: #6c757d; font-size: 15px; }
        .container, .address-card {
            background: #fff; border-radius: 8px; padding: 20px;
            margin-bottom: 25px; box-shadow: var(--box-shadow);
        }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #495057; }
        textarea, input[type="text"], input[type="date"], #searchInput {
            width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px;
            font-size: 15px;
        }
        .button-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        .btn-primary { background: var(--primary-color); color: #fff; }
        .nav-buttons, .action-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .nav-btn, .action-btn {
            flex: 1; padding: 8px; text-align: center; border-radius: 4px;
            font-size: 13px; font-weight: 500; text-decoration: none;
            color: #fff;
        }
        .naver-btn { background: var(--naver-color); }
        .tmap-btn { background: var(--tmap-color); }
        .kakao-btn { background: var(--kakao-color); color: var(--kakao-text); }
        .address-info { font-size: 13px; color: #495057; margin-bottom: 8px; }
        .day-of-week { margin-left: 4px; font-size: 12px; color: #6c757d; }
        .address-text { font-size: 15px; word-break: break-all; }
        .notification {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 15px; border-radius: 6px;
            text-align: center; opacity: 0;
            transform: translateY(120px); transition: transform .3s, opacity .3s;
            z-index: 1000;
        }
        .notification.show { transform: translateY(0); opacity: 1; }
        .drag-handle { position: absolute; right: 10px; top: 10px; cursor: grab; font-size: 18px; color: #adb5bd; }
        .drag-handle:active { cursor: grabbing; }
    </style>
</head>
<body>
    <header>
        <h1>작업 주소 관리</h1>
        <p class="subtitle">주소, 현장, 작업일을 관리하고 내비게이션으로 연결</p>
    </header>

    <div class="container">
        <div class="input-group">
            <label for="addressInput">주소</label>
            <textarea id="addressInput" placeholder="예: 서울 양천구 목동 962 이스턴 5층"></textarea>
        </div>
        <div class="input-group">
            <label for="siteNameInput">현장이름 (선택)</label>
            <input type="text" id="siteNameInput" placeholder="예: 목동 아파트 현장">
        </div>
        <div class="input-group">
            <label for="workDateInput">작업일자 (선택)</label>
            <input type="date" id="workDateInput">
        </div>
        <div class="button-group">
            <button id="saveButton" class="btn btn-primary">저장하기</button>
        </div>
    </div>

    <div class="input-group">
        <label for="searchInput">주소 검색</label>
        <input type="search" id="searchInput" placeholder="주소 또는 현장이름으로 검색...">
    </div>

    <h2>저장된 주소 (핸들 드래그하여 순서 변경)</h2>
    <div id="savedAddresses" class="container">
        <div id="emptyState" style="text-align:center; padding:30px 0; color:#6c757d;">
            <div style="font-size:40px;">📂</div>
            <p>저장된 주소가 없습니다.</p>
            <p id="noSearchResult" style="font-size:13px; color:#868e96; display:none;">검색 결과가 없습니다.</p>
        </div>
        <div id="addressCards"></div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        // Firebase 설정
        const firebaseConfig = { databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dataKey = 'addresses/my-secret-addr-key-april2025';

        // DOM 요소
        const addressInput = document.getElementById('addressInput');
        const siteNameInput = document.getElementById('siteNameInput');
        const workDateInput = document.getElementById('workDateInput');
        const saveButton = document.getElementById('saveButton');
        const searchInput = document.getElementById('searchInput');
        const addressCards = document.getElementById('addressCards');
        const emptyState = document.getElementById('emptyState');
        const noSearch = document.getElementById('noSearchResult');
        const notification = document.getElementById('notification');
        let savedAddresses = [];
        let sortable = null;

        // 알림 표시
        function showNotification(msg, type='success') {
            notification.textContent = msg;
            notification.className = `notification ${type} show`;
            setTimeout(() => notification.classList.remove('show'), 2500);
        }

        // 작업일 파싱
        function parseWorkDate(d) {
            if (!d) return null;
            const date = new Date(d);
            return isNaN(date) ? null : date;
        }

        // 주소 정제
        function cleanAddr(addr) {
            let txt = addr.trim().replace(/^(주소|address|위치|location)\s*[:：]?/i, '').trim();
            const parts = txt.split(/\s+/);
            let idx = -1;
            parts.forEach((p,i) => { if (/^\d+([-]\d+)?$/.test(p) && i>0 && /[로길가동리]$/.test(parts[i-1])) idx = i; });
            return idx >=0 ? parts.slice(0,idx+1).join(' ') : txt;
        }

        // URL 생성
        function createNaverUrl(a) { return `https://map.naver.com/v5/search/${encodeURIComponent(cleanAddr(a))}`; }
        function createTmapUrl(a) { return `tmap://search?name=${encodeURIComponent(cleanAddr(a))}`; }

        // 정렬: 미래0, 과거1, 없음2
        function sortList() {
            const now = new Date();
            savedAddresses.sort((a,b) => {
                const da = parseWorkDate(a.workDate);
                const db = parseWorkDate(b.workDate);
                const ca = !da?2:(da>=now?0:1);
                const cb = !db?2:(db>=now?0:1);
                if(ca!==cb) return ca-cb;
                if(ca===0) return da-db;
                if(ca===1) return db-da;
                return 0;
            });
        }

        // Firebase
        function saveToFb() {
            if(navigator.onLine) database.ref(dataKey).set(savedAddresses);
        }
        function loadFromFb() {
            database.ref(dataKey).once('value').then(s => { savedAddresses = Array.isArray(s.val())?s.val():[]; render(); });
        }

        // 저장
        function addAddr() {
            const txt = addressInput.value.trim();
            if(!txt) return showNotification('주소를 입력해주세요','warning');
            if(savedAddresses.some(x=>x.text===txt&&x.siteName===siteNameInput.value&&x.workDate===workDateInput.value)) return showNotification('중복된 주소입니다','warning');
            savedAddresses.unshift({ id:Date.now(), text:txt, siteName:siteNameInput.value, workDate:workDateInput.value });
            addressInput.value=siteNameInput.value=workDateInput.value='';
            saveToFb(); render(); showNotification('저장되었습니다');
        }
        function removeAddr(id) {
            if(!confirm('삭제하시겠습니까?')) return;
            savedAddresses=savedAddresses.filter(x=>x.id!==id);
            saveToFb(); render(); showNotification('삭제되었습니다');
        }

        // 렌더링
        function render() {
            sortList(); const term=searchInput.value.trim().toLowerCase();
            addressCards.innerHTML='';
            const list=savedAddresses.filter(x=>!term||x.text.toLowerCase().includes(term)||x.siteName.toLowerCase().includes(term));
            if(!list.length){ emptyState.style.display='block'; noSearch.style.display=term?'block':'none'; if(sortable){sortable.destroy();sortable=null;} return;} 
            emptyState.style.display='none';
            list.forEach(x=>{
                const card=document.createElement('div');card.className='address-card';card.dataset.id=x.id;
                const handle=document.createElement('span');handle.className='drag-handle';handle.innerHTML='&#9776;';card.appendChild(handle);
                const info=document.createElement('div');info.className='address-info';
                if(x.siteName) info.innerHTML+=`<span><strong>현장:</strong> ${x.siteName}</span>`;
                if(x.workDate){ const d=parseWorkDate(x.workDate); const wd=d?d.toLocaleDateString('ko-KR',{weekday:'short'}):''; info.innerHTML+=`<span><strong>작업일:</strong> ${x.workDate} <span class='day-of-week'>(${wd})</span></span>`;}                
                card.appendChild(info);
                const addrTxt=document.createElement('div');addrTxt.className='address-text';addrTxt.textContent=x.text;card.appendChild(addrTxt);
                const navs=document.createElement('div');navs.className='nav-buttons';
                navs.innerHTML=`
                    <a href='${createNaverUrl(x.text)}' target='_blank' class='nav-btn naver-btn'>네이버 지도</a>
                    <a href='${createTmapUrl(x.text)}' target='_blank' class='nav-btn tmap-btn'>T맵</a>
                    <a href='https://map.kakao.com/link/search/${encodeURIComponent(cleanAddr(x.text))}' target='_blank' class='nav-btn kakao-btn'>카카오맵</a>
                `;
                card.appendChild(navs);
                const acts=document.createElement('div');acts.className='action-buttons';
                const del=document.createElement('button');del.className='action-btn';del.textContent='삭제';del.onclick=()=>removeAddr(x.id);
                acts.appendChild(del);card.appendChild(acts);
                addressCards.appendChild(card);
            });
            if(!sortable){ sortable=new Sortable(addressCards,{ handle:'.drag-handle', animation:150, onEnd:saveToFb }); }
        }

        // 이벤트
        saveButton.addEventListener('click',addAddr);
        addressInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addAddr();}});
        searchInput.addEventListener('input',render);

        // 초기화
        loadFromFb();
    </script>
</body>
</html>
