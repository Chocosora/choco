<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업 주소 관리</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-database-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        /* :root, *, body, header, h1, h2, .subtitle, .container 등 기본 스타일 (이전과 동일) */
        :root {
            --primary-color: #4263eb; /* ... */ --error-color: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { /* ... */ line-height: 1.6; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { /* ... */ font-size: 26px; }
        h2 { /* ... */ font-size: 20px; margin-top: 30px; }
        .subtitle { /* ... */ font-size: 15px; }
        .container { /* ... */ margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { /* ... */ font-size: 14px; }
        textarea, .input-group input[type="text"], .input-group input[type="date"],
        #searchInput /* 검색창 스타일 추가 */ {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
            border-radius: 4px; font-size: 15px; transition: border-color 0.2s;
            font-family: inherit; -webkit-appearance: none; appearance: none;
        }
        textarea { /* ... */ min-height: 80px; }
        textarea:focus, .input-group input[type="text"]:focus, .input-group input[type="date"]:focus,
        #searchInput:focus { /* 검색창 포커스 스타일 추가 */
            outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(66, 99, 235, 0.2);
        }
        /* .btn, .button-group 등 버튼 스타일 (이전과 동일) */
        .btn { /* ... */ min-height: 40px; }
        .btn:active { transform: scale(0.98); }
        /* ... */
        .button-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }

        /* 검색창 컨테이너 스타일 */
        .search-container {
            margin-bottom: 20px; /* 목록과의 간격 */
        }

        .saved-addresses { margin-top: 15px; }
        /* .address-card, .sortable-ghost 등 카드 스타일 (이전과 동일) */
        .address-card { /* ... */ cursor: grab; }
        .address-card:active { /* ... */ cursor: grabbing; }
        .sortable-ghost { /* ... */ opacity: 0.4; }
        .address-info { /* ... */ font-size: 13px; }
        .address-info strong { /* ... */ margin-right: 4px; }
        .address-info span + span::before { /* ... */ margin: 0 6px; }
        .day-of-week { /* ... */ font-size: 12px; }
        .address-text { /* ... */ font-size: 15px; }
        .nav-buttons { /* ... */ gap: 8px; margin-bottom: 12px; }
        .nav-btn { /* ... */ font-size: 13px; min-height: 38px; }
        .nav-btn:hover { opacity: 0.85; }
        /* ... */
        .naver-btn { background-color: var(--naver-color); color: white; }
        .tmap-btn { background-color: var(--tmap-color); color: white; }
        .kakao-btn { background-color: var(--kakao-color); color: var(--kakao-text); }
        .action-buttons { /* ... */ gap: 10px; margin-top: 10px; }
        .action-btn { /* ... */ font-size: 13px; min-height: 36px; }
        .action-btn:hover { background-color: #dee2e6; }
        /* Edit Mode 스타일 (이전과 동일) */
        .edit-mode .address-display { display: none; }
        .address-edit { display: none; }
        .edit-mode .address-edit { display: block; }
        .edit-mode .address-card { cursor: default; }
        .edit-input-group { margin-bottom: 10px; }
        .edit-input-group label { font-size: 13px; }
        .edit-input, .edit-site-name-input, .edit-work-date-input { /* ... */ font-size: 14px; }
        .edit-input:focus, .edit-site-name-input:focus, .edit-work-date-input:focus { /* ... */ }
        /* 알림, Empty State, Sync Status 스타일 (이전과 동일) */
        .notification { /* ... */ }
        .notification.show { /* ... */ }
        /* ... */
        .empty-state { text-align: center; padding: 30px 0; color: #6c757d; }
        .empty-state-icon { font-size: 40px; margin-bottom: 10px; }
        .sync-status { display: flex; align-items: center; height: 14px; margin-bottom: 15px; }
        .sync-indicator { width: 10px; height: 10px; border-radius: 50%; }
        .sync-indicator.online { background-color: var(--success-color); }
        .sync-indicator.offline { background-color: var(--error-color); }
        /* Media Query (이전과 동일) */
        @media (max-width: 600px) { /* ... */ }
    </style>
</head>
<body>
    <header>
        <h1>작업 주소 관리</h1>
        <p class="subtitle">주소, 현장, 작업일을 관리하고 내비게이션으로 연결</p>
    </header>

    <div class="container">
        <div class="sync-status">
            <div id="syncIndicator" class="sync-indicator offline"></div>
            <span id="syncStatus"></span> </div>

        <div class="input-group">
             <label for="addressInput">주소</label>
             <textarea id="addressInput" placeholder="예: 서울 양천구 목동 962 이스턴 5층"></textarea>
        </div>
        <div class="input-group">
             <label for="siteNameInput">현장이름 (선택)</label>
             <input type="text" id="siteNameInput" placeholder="예: 목동 아파트 현장">
        </div>
        <div class="input-group">
             <label for="workDateInput">작업일자 (선택)</label>
             <input type="date" id="workDateInput">
        </div>
        <div class="button-group">
            <button id="saveButton" class="btn btn-primary">저장하기</button>
        </div>
    </div>

    <div class="search-container">
         <label for="searchInput" style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #495057;">주소 검색</label>
         <input type="search" id="searchInput" placeholder="주소 또는 현장이름으로 검색...">
    </div>

    <h2>저장된 주소 (드래그하여 순서 변경)</h2>
    <div id="savedAddresses" class="saved-addresses">
        <div id="emptyState" class="empty-state">
            <div class="empty-state-icon">📂</div>
            <p>저장된 주소가 없습니다.</p>
        </div>
        <div id="addressCards"></div> </div>

    <div id="notification" class="notification">알림 메시지</div>

    <script>
        // Firebase 초기화
        const firebaseConfig = {
            databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com" // 실제 URL로 변경하세요
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 고정 식별자
        const sharedDataKey = "my-secret-addr-key-april2025"; // 예시 값, 필요시 변경

        // DOM 요소
        const addressInput = document.getElementById('addressInput');
        const siteNameInput = document.getElementById('siteNameInput');
        const workDateInput = document.getElementById('workDateInput');
        const saveButton = document.getElementById('saveButton');
        const searchInput = document.getElementById('searchInput'); // 검색창 추가
        const addressCardsContainer = document.getElementById('addressCards');
        const emptyState = document.getElementById('emptyState');
        const notification = document.getElementById('notification');
        const syncIndicator = document.getElementById('syncIndicator');

        let savedAddresses = []; // 메모리에 저장된 전체 주소 목록
        let sortableInstance = null;

        // --- Firebase 연결 상태 (이전과 동일) ---
        const connectedRef = database.ref(".info/connected");
        connectedRef.on("value", (snap) => { /* ... */ });

        // --- 알림 (이전과 동일) ---
        function showNotification(message, type = 'success') { /* ... */ }

        // --- 주소 처리 (이전과 동일) ---
        function extractAddress(text) { return text.trim(); }
        function getCleanAddressForNavigation(fullAddress) { /* ... 이전과 동일 ... */ }

        // --- 내비 URL (이전과 동일) ---
        function createNaverMapUrl(addr) { /* ... */ }
        function createTmapUrl(addr) { /* ... */ }
        function createKakaoNaviUrl(addr) { /* ... */ }

        // --- Firebase 데이터 경로 참조 (이전과 동일) ---
        const firebaseDataPath = 'addresses/' + sharedDataKey;

        // --- Firebase 데이터 쓰기/읽기 (이전과 동일) ---
        function backupToFirebase() { /* ... */ }
        function restoreFromFirebase() { /* ... */ }

        // --- 주소 저장/삭제/편집 (이전과 동일) ---
        function saveAddress() { /* ... */ }
        function deleteAddress(id) { /* ... */ }
        function enableEditMode(card, address) { /* ... */ }
        function cancelEditMode(card) { /* ... */ }
        function saveEdit(id) { /* ... */ }

        // --- 날짜 파싱 헬퍼 함수 (이전과 동일) ---
        function parseWorkDate(dateString) { /* ... */ }


        // --- 주소 렌더링 (정렬 및 필터링 로직 추가) ---
        function renderAddresses() {
            const currentSearchTerm = searchInput.value.trim().toLowerCase(); // 현재 검색어 가져오기

            addressCardsContainer.innerHTML = ''; // 목록 비우기

            // 1. 기본 정렬 적용 (작업일자 기준)
            const today = new Date();
            today.setUTCHours(0, 0, 0, 0);
            const sortedAddresses = [...savedAddresses].sort((a, b) => {
                const dateA = parseWorkDate(a.workDate);
                const dateB = parseWorkDate(b.workDate);
                const categoryA = (dateA && dateA.getTime() >= today.getTime()) ? 1 : 2;
                const categoryB = (dateB && dateB.getTime() >= today.getTime()) ? 1 : 2;
                if (categoryA !== categoryB) return categoryA - categoryB;
                if (categoryA === 1) return (dateA.getTime() === dateB.getTime()) ? b.id - a.id : dateA.getTime() - dateB.getTime();
                else return b.id - a.id;
            });

            // 2. 검색어 필터링 적용
            const filteredAddresses = sortedAddresses.filter(address => {
                if (!currentSearchTerm) return true; // 검색어 없으면 모두 통과
                const textMatch = address.text.toLowerCase().includes(currentSearchTerm);
                const siteMatch = address.siteName && address.siteName.toLowerCase().includes(currentSearchTerm);
                return textMatch || siteMatch;
            });

            // 3. 결과 렌더링 및 Empty State 처리
            if (filteredAddresses.length === 0) {
                emptyState.style.display = 'block';
                // 검색 결과 없을 때 메시지 변경
                if (currentSearchTerm) {
                    emptyState.querySelector('p').textContent = '검색 결과가 없습니다.';
                } else {
                    emptyState.querySelector('p').textContent = '저장된 주소가 없습니다.';
                }
                if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
            } else {
                emptyState.style.display = 'none';
                filteredAddresses.forEach((address) => {
                    // ... (카드 생성 로직 - 이전과 동일) ...
                    const card = document.createElement('div');
                    card.className = 'address-card'; card.dataset.id = address.id;

                    // Display Area
                    const addressDisplay = document.createElement('div');
                    addressDisplay.className = 'address-display';
                    const addressInfo = document.createElement('div');
                    addressInfo.className = 'address-info';
                    let infoHtml = '';
                    if (address.siteName) { infoHtml += `<span><strong>현장:</strong> ${address.siteName}</span>`; }
                    if (address.workDate) {
                        let dateStr = address.workDate; let dayOfWeek = '';
                        try {
                            const dateParts = dateStr.split('-');
                            if (dateParts.length === 3) {
                                const year = parseInt(dateParts[0], 10), month = parseInt(dateParts[1], 10) - 1, day = parseInt(dateParts[2], 10);
                                const dateObj = new Date(Date.UTC(year, month, day));
                                if (!isNaN(dateObj)) { dayOfWeek = dateObj.toLocaleDateString('ko-KR', { weekday: 'short', timeZone: 'Asia/Seoul' }); }
                            }
                        } catch (e) { console.error("날짜 파싱 오류:", e); }
                        infoHtml += `<span><strong>작업일:</strong> ${dateStr} <span class="day-of-week">(${dayOfWeek || '요일?'})</span></span>`;
                    }
                    addressInfo.innerHTML = infoHtml;

                    const addressText = document.createElement('div');
                    addressText.className = 'address-text'; addressText.textContent = address.text;

                    const navButtons = document.createElement('div');
                    navButtons.className = 'nav-buttons';
                    navButtons.innerHTML = `
                        <a href="${createNaverMapUrl(address.text)}" target="_blank" class="nav-btn naver-btn" title="네이버 지도로 열기">네이버 지도</a>
                        <a href="${createTmapUrl(address.text)}" target="_blank" class="nav-btn tmap-btn" title="T맵으로 열기">T맵</a>
                        <a href="${createKakaoNaviUrl(address.text)}" target="_blank" class="nav-btn kakao-btn" title="카카오맵으로 열기">카카오맵</a>`;

                    const actionButtons = document.createElement('div');
                    actionButtons.className = 'action-buttons';
                    actionButtons.innerHTML = `<button class="action-btn edit-btn">수정</button><button class="action-btn delete-btn">삭제</button>`;
                    actionButtons.querySelector('.edit-btn').onclick = () => enableEditMode(card, address);
                    actionButtons.querySelector('.delete-btn').onclick = () => deleteAddress(address.id);

                    if (infoHtml) { addressDisplay.appendChild(addressInfo); }
                    addressDisplay.appendChild(addressText); addressDisplay.appendChild(navButtons); addressDisplay.appendChild(actionButtons);

                    // Edit Area
                    const addressEdit = document.createElement('div');
                    addressEdit.className = 'address-edit';
                    addressEdit.innerHTML = `
                        <div class="edit-input-group"><label>주소</label><input type="text" class="edit-input"></div>
                        <div class="edit-input-group"><label>현장이름</label><input type="text" class="edit-site-name-input"></div>
                        <div class="edit-input-group"><label>작업일자</label><input type="date" class="edit-work-date-input"></div>
                        <div class="button-group">
                            <button class="btn btn-primary save-edit-btn">저장</button>
                            <button class="btn btn-secondary cancel-edit-btn">취소</button>
                        </div>`;
                    addressEdit.querySelector('.save-edit-btn').onclick = () => saveEdit(address.id);
                    addressEdit.querySelector('.cancel-edit-btn').onclick = () => cancelEditMode(card);

                    card.appendChild(addressDisplay); card.appendChild(addressEdit);
                    addressCardsContainer.appendChild(card);

                });

                // 4. SortableJS 초기화/업데이트 및 활성화/비활성화
                const isSearchActive = currentSearchTerm.length > 0;
                if (!sortableInstance) {
                    initializeSortable();
                }
                // 검색 중일 때는 드래그 비활성화, 아닐 때는 활성화
                if (sortableInstance) {
                    sortableInstance.option("disabled", isSearchActive);
                }
            }
        }

        // --- SortableJS 초기화 (이전과 동일) ---
        function initializeSortable() {
             if (sortableInstance) sortableInstance.destroy();
             sortableInstance = new Sortable(addressCardsContainer, {
                animation: 150, ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', disabled: false,
                onEnd: function (evt) {
                    const orderedIds = Array.from(addressCardsContainer.children).map(card => parseInt(card.dataset.id, 10));
                    // !!! 중요: 검색 상태에서 순서 변경 시 전체 savedAddresses 배열 업데이트 주의 !!!
                    // 현재 로직은 표시된 ID 기준으로 전체 배열을 재구성하므로,
                    // 검색 상태에서 순서를 바꾸면 필터링되지 않은 항목의 순서도 영향받을 수 있음.
                    // 위에서 검색 중 sortable을 비활성화했으므로 이 문제는 발생하지 않음.
                    savedAddresses = orderedIds.map(id => savedAddresses.find(addr => addr.id === id)).filter(Boolean);
                    backupToFirebase();
                    console.log('주소 순서 업데이트됨');
                },
            });
        }

        // --- Event Listeners ---
        saveButton.addEventListener('click', saveAddress);
        addressInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveAddress(); } });
        // 검색창 입력 이벤트 리스너 추가
        searchInput.addEventListener('input', renderAddresses);

        // --- Initial Load ---
        restoreFromFirebase(); // Firebase에서 데이터 로드 후 renderAddresses 호출

    </script>
</body>
</html>
