        .drag-handle {
            position: absolute;
            top: 5px; /* 위치 조정 */
            right: 5px; /* 위치 조정 */
            padding: 10px; /* 터치 영역 확보 */

            color: #adb5bd; /* 연한 색상 */

            touch-action: none; /* 핸들 터치 시 스크롤 방지 */
            user-select: none; /* 텍스트 선택 방지 */
            -webkit-user-drag: none; /* 기본 드래그 방지 */
        }
        .address-card:active .drag-handle { /* 드래그 시작 시 커서 */
             cursor: grabbing;

        /* 수정 모드에서는 핸들 숨기기 */

    </style>

            const currentSearchTerm = searchInput.value.trim().toLowerCase();

            // 3. 결과 렌더링 및 Empty State 처리

                    addressDisplay.className = 'address-display';

                    addressDisplay.appendChild(navButtons);
                    addressDisplay.appendChild(actionButtons);

                    addressEdit.className = 'address-edit';

                // 4. SortableJS 초기화/업데이트 (이전과 동일 - handle 옵션은 initializeSortable에서 설정)
                const isSearchActive = currentSearchTerm.length > 0;
                if (!sortableInstance) { initializeSortable(); }
                if (sortableInstance) { sortableInstance.option("disabled", isSearchActive); }
            }
        }

        // --- SortableJS 초기화 (handle 옵션 추가) ---
        function initializeSortable() {
             if (sortableInstance) sortableInstance.destroy();
             sortableInstance = new Sortable(addressCardsContainer, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                handle: '.drag-handle', // *** 핸들 클래스 지정 ***
                disabled: false, // 초기 상태는 활성화
                onEnd: function (evt) {
                    // 검색 상태 아닐 때만 순서 저장 (disabled 상태면 onEnd 호출 안됨)
                    const orderedIds = Array.from(addressCardsContainer.children).map(card => parseInt(card.dataset.id, 10));
                    savedAddresses = orderedIds.map(id => savedAddresses.find(addr => addr.id === id)).filter(Boolean);
                    backupToFirebase(); // 순서 변경 후 Firebase에 즉시 저장
                    console.log('주소 순서 업데이트됨');
                },
            });
        }

        // --- Event Listeners (이전과 동일) ---
        saveButton.addEventListener('click', saveAddress);
        addressInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveAddress(); } });
        searchInput.addEventListener('input', renderAddresses);

        // --- Initial Load (이전과 동일) ---
        restoreFromFirebase();

    </script>
