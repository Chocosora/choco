<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업 주소 관리</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-database-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        /* --- Base Styles & Variables --- */
        :root {
            --primary-color: #4263eb; --primary-hover: #364fc7; --secondary-color: #f8f9fa;
            --border-color: #ced4da; --text-color: #343a40; --light-gray: #e9ecef;
            --naver-color: #03C75A; --tmap-color: #ED1846; --kakao-color: #FEE500;
            --kakao-text: #3C1E1E; --box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            --success-color: #4caf50; --warning-color: #ff9800; --error-color: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            max-width: 800px; margin: 0 auto; padding: 15px;
            background-color: var(--secondary-color); color: var(--text-color);
            line-height: 1.6;
        }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 26px; margin-bottom: 8px; }
        h2 { font-size: 20px; margin: 30px 0 15px; }
        .subtitle { color: #6c757d; font-size: 15px; }
        .container, .address-card {
            background: #fff; border-radius: 8px; padding: 20px;
            margin-bottom: 25px; box-shadow: var(--box-shadow);
        }
        .address-card { position: relative; }
        .drag-handle {
            position: absolute; right: 10px; top: 10px;
            cursor: grab; font-size: 18px; color: #adb5bd;
        }
        .drag-handle:active { cursor: grabbing; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px;
            font-weight: bold; font-size: 14px; color: #495057;
        }
        textarea, input[type="text"], input[type="date"], #searchInput {
            width: 100%; padding: 10px;
            border: 1px solid var(--border-color); border-radius: 4px;
            font-size: 15px;
        }
        .button-group { display: flex; justify-content: flex-end;
            gap: 10px; margin-top: 15px;
        }
        .btn { padding: 10px 15px; border: none; border-radius: 4px;
            font-size: 15px; cursor: pointer; min-height: 40px;
        }
        .btn-primary { background: var(--primary-color); color: #fff; }
        .btn-secondary { background: var(--light-gray); color: var(--text-color); }
        .nav-buttons, .action-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .nav-btn, .action-btn {
            flex: 1; padding: 8px; text-align: center;
            border-radius: 4px; font-size: 13px; cursor: pointer;
            font-weight: 500; text-decoration: none;
        }
        .naver-btn { background: var(--naver-color); color: #fff; }
        .tmap-btn  { background: var(--tmap-color); color: #fff; }
        .kakao-btn { background: var(--kakao-color); color: var(--kakao-text); }
        .address-info { font-size: 13px; color: #495057; margin-bottom: 8px; }
        .address-text { font-size: 15px; word-break: break-all; }
        .notification {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 15px; border-radius: 6px;
            text-align: center; opacity: 0;
            transition: transform .3s, opacity .3s;
            transform: translateY(120px); z-index: 1000;
        }
        .notification.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <header>
        <h1>작업 주소 관리</h1>
        <p class="subtitle">주소, 현장, 작업일을 관리하고 내비게이션으로 연결</p>
    </header>

    <div class="container">
        <div class="input-group">
            <label for="addressInput">주소</label>
            <textarea id="addressInput" placeholder="예: 서울 양천구 목동 962 이스턴 5층"></textarea>
        </div>
        <div class="input-group">
            <label for="siteNameInput">현장이름 (선택)</label>
            <input type="text" id="siteNameInput" placeholder="예: 목동 아파트 현장">
        </div>
        <div class="input-group">
            <label for="workDateInput">작업일자 (선택)</label>
            <input type="date" id="workDateInput">
        </div>
        <div class="button-group">
            <button id="saveButton" class="btn btn-primary">저장하기</button>
        </div>
    </div>

    <div class="input-group">
        <label for="searchInput">주소 검색</label>
        <input type="search" id="searchInput" placeholder="주소 또는 현장이름으로 검색...">
    </div>

    <h2>저장된 주소 (핸들 드래그하여 순서 변경)</h2>
    <div id="savedAddresses" class="container">
        <div id="emptyState" style="text-align:center; padding:30px 0; color:#6c757d;">
            <div style="font-size:40px;">📂</div>
            <p>저장된 주소가 없습니다.</p>
            <p id="noSearchResult" style="font-size:13px;color:#868e96;display:none;">검색 결과가 없습니다.</p>
        </div>
        <div id="addressCards"></div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        // Firebase 설정
        const firebaseConfig = { databaseURL: "https://chocosora-ad4df-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const sharedDataKey = "my-secret-addr-key-april2025";
        const firebaseDataPath = 'addresses/' + sharedDataKey;

        // DOM 엘리먼트
        const addressInput = document.getElementById('addressInput');
        const siteNameInput = document.getElementById('siteNameInput');
        const workDateInput = document.getElementById('workDateInput');
        const saveButton = document.getElementById('saveButton');
        const searchInput = document.getElementById('searchInput');
        const addressCardsContainer = document.getElementById('addressCards');
        const emptyState = document.getElementById('emptyState');
        const noSearchResultMsg = document.getElementById('noSearchResult');
        const notification = document.getElementById('notification');
        let savedAddresses = [];
        let sortableInstance = null;

        // 알림 함수
        function showNotification(msg, type='success') {
            notification.textContent = msg;
            notification.className = `notification ${type} show`;
            setTimeout(() => notification.classList.remove('show'), 2500);
        }

        // 주소 정제
        function getCleanAddressForNavigation(fullAddress) {
            let text = fullAddress.trim()
                .replace(/^(주소|address|위치|location)\s*[:：]?/i, '').trim();
            const parts = text.split(/\s+/);
            let idx = -1;
            for (let i=0; i<parts.length; i++) {
                if (/^\d+([-]\d+)?$/.test(parts[i]) && i>0 && /[로길가동리]$/.test(parts[i-1])) idx = i;
            }
            return idx !== -1 ? parts.slice(0, idx+1).join(' ') : text;
        }

        // 네이버/T맵 URL
        function createNaverMapUrl(addr) { 
            return `https://map.naver.com/v5/search/${encodeURIComponent(getCleanAddressForNavigation(addr))}`; 
        }
        function createTmapUrl(addr) {  
            return `tmap://search?name=${encodeURIComponent(getCleanAddressForNavigation(addr))}`; 
        }

        // Firebase 저장/로드
        function backupToFirebase() {
            if (!navigator.onLine) return;
            database.ref(firebaseDataPath).set(savedAddresses).catch(console.error);
        }
        function restoreFromFirebase() {
            database.ref(firebaseDataPath).once('value')
                .then(snap => {
                    savedAddresses = Array.isArray(snap.val()) ? snap.val() : [];
                    renderAddresses();
                })
                .catch(e => { console.error(e); savedAddresses = []; renderAddresses(); });
        }

        // 주소 저장
        function saveAddress() {
            const text = addressInput.value.trim();
            if (!text) return showNotification('주소를 입력하세요.', 'warning');
            if (savedAddresses.some(a => a.text===text && a.siteName===siteNameInput.value && a.workDate===workDateInput.value))
                return showNotification('이미 저장된 주소입니다.', 'warning');
            savedAddresses.unshift({ id:Date.now(), text, siteName:siteNameInput.value, workDate:workDateInput.value });
            addressInput.value = siteNameInput.value = workDateInput.value = '';
            backupToFirebase(); renderAddresses(); showNotification('주소가 저장되었습니다.');
        }
        function deleteAddress(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            savedAddresses = savedAddresses.filter(a => a.id !== id);
            backupToFirebase(); renderAddresses(); showNotification('주소가 삭제되었습니다.');
        }

        // 렌더링 및 Sortable
        function renderAddresses() {
            const term = searchInput.value.trim().toLowerCase();
            addressCardsContainer.innerHTML = '';
            const list = savedAddresses.filter(a => {
                if (!term) return true;
                return a.text.toLowerCase().includes(term) || (a.siteName||'').toLowerCase().includes(term);
            });
            if (!list.length) {
                emptyState.style.display = 'block';
                noSearchResultMsg.style.display = term ? 'block' : 'none';
                if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
                return;
            }
            emptyState.style.display = 'none';
            list.forEach(a => {
                const card = document.createElement('div');
                card.className = 'address-card';
                card.dataset.id = a.id;

                // 드래그 핸들
                const dragHandle = document.createElement('span');
                dragHandle.className = 'drag-handle';
                dragHandle.innerHTML = '&#9776;';
                card.appendChild(dragHandle);

                // 주소/정보
                const info = document.createElement('div');
                info.className = 'address-info';
                if (a.siteName) info.innerHTML += `<span><strong>현장:</strong> ${a.siteName}</span> `;
                if (a.workDate) info.innerHTML += `<span><strong>작업일:</strong> ${a.workDate}</span>`;
                card.appendChild(info);

                const text = document.createElement('div');
                text.className = 'address-text';
                text.textContent = a.text;
                card.appendChild(text);

                // 내비게이션 버튼
                const navs = document.createElement('div');
                navs.className = 'nav-buttons';
                navs.innerHTML = `
                    <a href="${createNaverMapUrl(a.text)}" target="_blank" class="nav-btn naver-btn">네이버 지도</a>
                    <a href="${createTmapUrl(a.text)}" target="_blank" class="nav-btn tmap-btn">T맵</a>
                    <a href="https://map.kakao.com/link/search/${encodeURIComponent(getCleanAddressForNavigation(a.text))}" target="_blank" class="nav-btn kakao-btn">카카오맵</a>
                `;
                card.appendChild(navs);

                // 삭제 버튼
                const actions = document.createElement('div');
                actions.className = 'action-buttons';
                const delBtn = document.createElement('button');
                delBtn.className = 'action-btn delete-btn';
                delBtn.textContent = '삭제';
                delBtn.onclick = () => deleteAddress(a.id);
                actions.appendChild(delBtn);
                card.appendChild(actions);

                addressCardsContainer.appendChild(card);
            });

            // Sortable 설정
            if (!sortableInstance) {
                sortableInstance = new Sortable(addressCardsContainer, {
                    handle: '.drag-handle',
                    animation: 150,
                    onEnd: () => { backupToFirebase(); }
                });
            }
        }

        // 이벤트 등록
        saveButton.addEventListener('click', saveAddress);
        addressInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveAddress(); }});
        searchInput.addEventListener('input', renderAddresses);

        // 초기 로드
        restoreFromFirebase();
    </script>
</body>
</html>
